<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Dashboard — Ansible Remote Server Deployment</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
 --ink:#0f172a;--muted:#64748b;--line:#e5e9f0;--bg:#f6f8fb;--card:#fff;--accent:#0f3a5f;
 --crit:#7f1d1d;--high:#dc2626;--med:#f59e0b;--low:#64748b;--info:#cbd5e1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:28px 22px 72px}
a{color:#1d4ed8;text-decoration:none}a:hover{text-decoration:underline}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;
 border-bottom:3px solid var(--accent);padding-bottom:16px}
h1{font-size:21px;margin:0 0 3px;color:var(--accent)}
.scope{color:var(--muted);font-size:13px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button.pr{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button.print{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.metabar{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px}
.metabar b{color:var(--ink)}
.posture{display:inline-block;padding:3px 11px;border-radius:999px;color:#fff;font-weight:700;font-size:12px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
.rsub{font-size:12px;color:var(--muted);margin-bottom:12px}
.sevrow{display:flex;align-items:center;font-size:15px;margin-top:12px}
.sevrow b{font-weight:700}.sevrow .sevn{color:var(--muted);margin-left:4px}
.catlist{list-style:none;margin:6px 0 0;padding:0 0 0 20px}
.catlist li{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.catlist .cattitle{flex:0 1 auto}
.catlist .catn{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;background:#0f172a;color:#fff;border-radius:999px;padding:1px 9px;font-size:12px}
.hct{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
.hct th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line)}
.hct td{padding:9px 6px;border-bottom:1px solid var(--line)}
.hct td.r,.hct th.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.hdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle}
.atag{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-left:6px}
.fp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.fp input{margin:0}
.tri{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tri.fp{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;cursor:default}
.tri.nr{background:#e2e8f0;color:#475569}
.tri.ok{background:#dcfce7;color:#166534}
.vf{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:8px;text-transform:none;letter-spacing:0}
.vf.ok{background:#dcfce7;color:#166534}
.vf.nr{background:#fef3c7;color:#92400e}
.aitag{color:#7c3aed;font-weight:600}
.prilist{margin:0;padding-left:22px;font-size:14px;color:#334155;line-height:1.7}
.prilist li{margin:3px 0}
.chartbox{position:relative;height:230px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
table.area{width:100%;border-collapse:collapse;font-size:13px}
table.area td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.area td.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sev{display:inline-block;color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.sev.LOW,.sev.INFO{color:#0f172a}
.finding{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.finding .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.finding .t{font-weight:700;font-size:15px}
.cnt{margin-left:auto;background:#0f172a;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.rule{color:var(--muted);font-size:12px;margin-top:4px}
.rule code{background:#f1f5f9;padding:1px 5px;border-radius:4px}
.wf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:640px){.wf{grid-template-columns:1fr}}
.wf .b{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px}
.wf .b .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
details.loc{margin-top:10px}
details.loc>summary{cursor:pointer;color:#1d4ed8;font-size:13px}
ul.locs{margin:8px 0 0;padding-left:0;list-style:none}
ul.locs li{padding:3px 0;border-bottom:1px dashed var(--line)}
ul.locs code{font-size:12px}
details.hard>summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:14px;margin-top:20px}
.muted{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:40px}
.foot{color:var(--muted);font-size:11px;margin-top:26px;line-height:1.7}
@media print{body{background:#fff}.controls,.print,details{}.finding,section{break-inside:avoid}
 details[open]>*{display:revert}details>ul,details>div{display:block}}
</style>
</head>
<body data-palette="#7f1d1d,#dc2626,#f59e0b,#64748b,#cbd5e1">
<div class="wrap">
 <header class="top">
  <div>
   <h1>Security Dashboard</h1>
   <div class="scope" id="scope">Ansible Deployment — Remote Server</div>
   <div style="margin-top:10px"><span class="posture" id="posture">—</span></div>
  </div>
  <div class="controls">
   <label class="fp"><input type="checkbox" id="fpToggle" onchange="renderFindings()"> Hide likely false positives</label>
   <label class="muted" for="runSel">Report</label>
   <select id="runSel" aria-label="Select report run"></select>
   <button class="print" onclick="window.print()">Print / PDF</button>
  </div>
 </header>

 <div class="metabar" id="metabar"></div>

 <section id="execWrap" style="margin-top:18px;display:none">
  <h2>Executive summary <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">· AI-generated</span></h2>
  <div id="exec" style="font-size:14px;color:#334155;line-height:1.65"></div>
 </section>

 <section id="priWrap" style="margin-top:14px;display:none">
  <h2>Priority actions <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">· AI-generated</span></h2>
  <ol id="priList" class="prilist"></ol>
 </section>

 <div class="grid">
  <section>
   <h2>Risk summary</h2>
   <div id="riskHead"></div>
   <div id="highWrap"></div>
  </section>
  <section>
   <h2>Findings by severity</h2>
   <div class="chartbox"><canvas id="donut"></canvas></div>
   <div class="legend" id="donutLegend"></div>
  </section>
 </div>

 <section style="margin-top:18px">
  <h2>Trend across reports (occurrences by severity)</h2>
  <div class="chartbox" style="height:260px"><canvas id="trend"></canvas></div>
 </section>

 <section style="margin-top:18px">
  <h2>Findings by area</h2>
  <table class="area" id="areaTable"></table>
 </section>

 <section style="margin-top:18px">
  <h2 id="prioTitle">Priority findings — High &amp; Critical</h2>
  <div id="prio"></div>
  <div id="hardWrap"></div>
 </section>

 <div class="foot" id="foot"></div>
</div>

<script>
const SEV=["CRITICAL","HIGH","MEDIUM","LOW","INFO"];
const COL={CRITICAL:"#7f1d1d",HIGH:"#dc2626",MEDIUM:"#f59e0b",LOW:"#64748b",INFO:"#cbd5e1"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// format an ISO timestamp in the VIEWER's local timezone with AM/PM (e.g. "Aug 21, 2026, 4:44 PM GMT+5:30")
const fmtTime=ts=>{try{return ts?new Date(ts).toLocaleString(undefined,{year:'numeric',month:'short',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true,timeZoneName:'short'}):"";}catch(e){return ts||"";}};
let donutChart,trendChart,CUR=null;

async function boot(){
  let manifest;
  try{ manifest=await (await fetch("manifest.json",{cache:"no-store"})).json(); }
  catch(e){ document.querySelector(".wrap").innerHTML='<p class="empty">No reports published yet.</p>'; return; }
  const runs=manifest.runs||[];
  if(!runs.length){ $("prio").innerHTML='<p class="empty">No reports published yet.</p>'; return; }
  const sel=$("runSel");
  runs.forEach((r,i)=>{
    const pr=r.pr?` · PR #${r.pr.number}`:"";
    sel.insertAdjacentHTML("beforeend",`<option value="${i}">${esc(fmtTime(r.ts)||r.date)} · ${esc(r.branch)}${pr}</option>`);
  });
  drawTrend(runs);
  sel.onchange=()=>loadRun(runs[+sel.value].file);
  loadRun(runs[0].file);
}

async function loadRun(file){
  let d; try{ d=await (await fetch(file,{cache:"no-store"})).json(); }catch(e){ return; }
  const m=d.meta,s=d.summary;
  // posture
  const highOcc=(s.occBySeverity.CRITICAL||0)+(s.occBySeverity.HIGH||0);
  const p=$("posture");
  if(s.occurrences===0){p.textContent="No issues";p.style.background="#16a34a";}
  else if(highOcc){p.textContent="Action required";p.style.background="#b91c1c";}
  else{p.textContent="Review recommended";p.style.background="#b45309";}
  $("scope").textContent=m.scope||"Ansible Deployment — Remote Server";
  // metabar
  const commit=`<a href="https://github.com/${m.repo}/commit/${m.sha}" target="_blank" rel="noopener"><b>${esc(m.shaShort)}</b></a>`;
  const prLink=m.pr?`<span>PR: <a href="${m.pr.url}" target="_blank" rel="noopener"><b>#${m.pr.number} ${esc(m.pr.title)}</b></a></span>`:"";
  $("metabar").innerHTML=
    `<span>Repo: <b>${esc(m.repo)}</b></span><span>Branch: <b>${esc(m.branch)}</b></span>`+
    `<span>Commit: ${commit}</span>${prLink}<span>Scanned: <b>${esc(fmtTime(m.ts)||m.date)}</b></span>`+
    `<span>Scanners: <b>${(m.scanners||[]).join(" + ")}</b></span>`+
    `<span><a href="${esc(m.runUrl)}" target="_blank" rel="noopener">workflow run ↗</a></span>`;
  // executive summary (present only when Claude enrichment ran)
  const ew=$("execWrap");
  if(m.executive_summary){$("exec").textContent=m.executive_summary;ew.style.display="";}
  else{ew.style.display="none";}
  // risk summary: nested by severity. "Severity - <#categories>", then each category - <occurrences>.
  const sevName=x=>x[0]+x.slice(1).toLowerCase();
  $("riskHead").innerHTML=`<div class="rsub">${s.types} issue types across ${s.occurrences} occurrences</div>`;
  const showSev=SEV.filter(sv=>(s.typesBySeverity[sv]||0)>0||sv==="CRITICAL"||sv==="HIGH");
  $("highWrap").innerHTML=showSev.map(sv=>{
    const n=s.typesBySeverity[sv]||0;
    const cats=(d.findings||[]).filter(f=>f.severity===sv).sort((a,b)=>b.count-a.count);
    let h=`<div class="sevrow"><span class="hdot" style="background:${COL[sv]}"></span><b>${sevName(sv)}</b><span class="sevn"> - ${n}</span></div>`;
    if(cats.length) h+=`<ul class="catlist">`+cats.map(f=>
      `<li><span class="cattitle">${esc(f.title)}</span> <span class="atag">${esc(f.area)}</span><span class="catn">${f.count}</span></li>`).join("")+`</ul>`;
    return h;
  }).join("");
  // donut (occurrences by severity)
  drawDonut(s.occBySeverity);
  // area
  const byArea={};(d.findings||[]).forEach(f=>byArea[f.area]=(byArea[f.area]||0)+f.count);
  $("areaTable").innerHTML=Object.entries(byArea).sort((a,b)=>b[1]-a[1])
    .map(([a,n])=>`<tr><td>${esc(a)}</td><td class="r">${n}</td></tr>`).join("")||'<tr><td class="muted">None</td></tr>';
  // priority actions (AI)
  const pw=$("priWrap");
  if(Array.isArray(m.priority_actions)&&m.priority_actions.length){
    $("priList").innerHTML=m.priority_actions.map(a=>`<li>${esc(a)}</li>`).join("");pw.style.display="";
  } else pw.style.display="none";
  // findings (respects the hide-FP toggle)
  CUR=d; renderFindings();
  const eng=m.engine?`triage & remediation are ${esc(m.engine)}-generated and dual-pass verified`:`remediation is curated`;
  $("foot").innerHTML=`Report-only mode · Count = times each rule matched · file links open the exact line on commit ${esc(m.shaShort)} · ${eng} · per-location detail in Security → Code scanning.`;
}
function renderFindings(){
  const d=CUR; if(!d) return;
  const hideFP=(document.getElementById("fpToggle")||{}).checked;
  const vis=(d.findings||[]).filter(f=>!(hideFP&&(f.triage||{}).verdict==="likely_false_positive"));
  const prio=vis.filter(f=>f.severity==="CRITICAL"||f.severity==="HIGH");
  const hard=vis.filter(f=>f.severity!=="CRITICAL"&&f.severity!=="HIGH");
  $("prioTitle").innerHTML=`Priority findings — High &amp; Critical (${prio.length} types)`;
  $("prio").innerHTML=prio.map(card).join("")||'<p class="muted">None.</p>';
  $("hardWrap").innerHTML=hard.length?
    `<details class="hard"><summary>Hardening recommendations — ${hard.length} issue types (Medium / Low / Info)</summary>${hard.map(card).join("")}</details>`:"";
}

function card(f){
  const locs=(f.locations||[]);
  const first=locs[0];
  const firstLink=first?`<a href="${esc(first.url)}" target="_blank" rel="noopener"><code>${esc(first.path)}:${esc(first.line||"")}</code></a>`:"";
  const list=locs.slice(0,60).map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener"><code>${esc(l.path)}:${esc(l.line||"")}</code></a></li>`).join("");
  const more=locs.length>60?`<li class="muted">and ${locs.length-60} more…</li>`:"";
  const det=locs.length>1?`<details class="loc"><summary>${locs.length} locations</summary><ul class="locs">${list}${more}</ul></details>`:"";
  const guide=f.guide?` · <a href="${esc(f.guide)}" target="_blank" rel="noopener">reference ↗</a>`:"";
  const tv=(f.triage||{}).verdict, treason=esc((f.triage||{}).reason||"");
  const tri = tv==="likely_false_positive" ? `<span class="tri fp" title="${treason}">Likely false positive</span>`
            : tv==="needs_review" ? `<span class="tri nr" title="${treason}">Needs review</span>`
            : tv==="confirmed" ? `<span class="tri ok" title="${treason}">Confirmed</span>` : "";
  const vf=f.verify;
  const vmark = vf ? (vf.verified ? `<span class="vf ok" title="Passed dual-pass review">✓ verified</span>`
                                  : `<span class="vf nr" title="${esc(vf.note||'flagged by a reviewer')}">⚠ needs review</span>`) : "";
  const aitag = f.enriched?' · <span class="aitag" title="AI-generated remediation">✨ AI</span>':'';
  return `<div class="finding">
   <div class="h"><span class="sev ${f.severity}" style="background:${COL[f.severity]}">${f.severity[0]+f.severity.slice(1).toLowerCase()}</span>
    <span class="t">${esc(f.title)}</span>${tri}<span class="cnt">×${f.count}</span></div>
   <div class="rule"><code>${esc(f.id)}</code> · ${esc(f.source)} · ${esc(f.area)}${guide}${aitag}</div>
   <div class="wf"><div class="b"><div class="k">Why it matters</div>${esc(f.why)}</div>
    <div class="b"><div class="k">How to fix ${vmark}</div>${esc(f.fix)}</div></div>
   <div style="margin-top:10px">First location: ${firstLink}${det}</div>
  </div>`;
}

function drawDonut(occ){
  const labels=SEV.filter(s=>occ[s]);const data=labels.map(s=>occ[s]);
  const cols=labels.map(s=>COL[s]);
  $("donutLegend").innerHTML=labels.map(s=>`<span><i class="dot" style="background:${COL[s]}"></i>${s[0]+s.slice(1).toLowerCase()} · ${occ[s]}</span>`).join("");
  if(donutChart)donutChart.destroy();
  donutChart=new Chart($("donut"),{type:"doughnut",
    data:{labels:labels.map(s=>s[0]+s.slice(1).toLowerCase()),datasets:[{data,backgroundColor:cols,borderColor:"#fff",borderWidth:2}]},
    options:{cutout:"62%",plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw}`}}}}});
}

function drawTrend(runs){
  const r=runs.slice().reverse();
  const labels=r.map(x=>x.date.replace(" UTC",""));
  const ds=SEV.map(s=>({label:s[0]+s.slice(1).toLowerCase(),data:r.map(x=>x.occBySeverity[s]||0),
    backgroundColor:COL[s],borderColor:"#fff",borderWidth:1,stack:"o"}));
  if(trendChart)trendChart.destroy();
  trendChart=new Chart($("trend"),{type:"bar",data:{labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,
     scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{color:"#eef2f7"}}},
     plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
}

boot();
</script>
</body>
</html>
