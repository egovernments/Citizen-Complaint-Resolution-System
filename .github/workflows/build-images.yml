name: Build images (reusable)

# Reusable build/push pipeline for every CCRS-owned image in build/build-config.yml.
# Callers:
#   - nightly-build-develop.yml  (schedule + dispatch) → ref develop, nightly tags, prune
#   - release-build.yml          (on release published) → ref = release tag, version tag only
#
# Mechanism: build each service per-arch on native runners (amd64 + arm64),
# push an attempt-scoped staging tag (`<prefix>-staging-<run_id>-<run_attempt>-<arch>`),
# then stitch a multi-arch manifest for the version tag (+ optional rolling tag).
# That scope is what makes the manifest safe: it can only be built from images
# this attempt produced, so a failed arch build can never be papered over by a
# leftover tag. run_id alone is NOT enough — it is constant across re-runs, so a
# cancelled attempt (which skips the cleanup job) would leave tags that the next
# attempt of the SAME run would happily consume. Final manifests reference
# digests, so cleanup deletes the staging tags afterwards without affecting them.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch or tag) to check out and build.
        required: true
        type: string
      version_tag:
        description: Immutable tag to push (e.g. a release tag). Empty → develop-<short-sha>.
        required: false
        type: string
        default: ''
      rolling_tag:
        description: Optional extra rolling tag to also push (e.g. nightly-develop). Empty → skip.
        required: false
        type: string
        default: ''
      staging_prefix:
        description: Stable per-channel prefix for the per-arch intermediate tags.
        required: true
        type: string
      prune_develop:
        description: Prune develop-<sha> snapshot tags to the 5 most recently pushed (develop channel only).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Only a literal at workflow level. Docker creds are referenced directly in the
# login steps (and step-level env on prune) to avoid the ambiguous availability
# of the `secrets` context in a reusable workflow's top-level `env`.
env:
  PUSH_NAMESPACE: egovio

jobs:
  enumerate:
    name: Enumerate build-config.yml
    runs-on: ubuntu-latest
    outputs:
      sha:     ${{ steps.sha.outputs.sha }}
      targets: ${{ steps.list.outputs.targets }}
      images:  ${{ steps.list.outputs.images }}
      version_tag: ${{ steps.list.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # `ref` may be a mutable branch tip (the nightly passes `develop`). Resolve
      # it to a SHA ONCE here; every build leg checks out that SHA. Otherwise a
      # push mid-run means legs build newer code than the manifest enumerated,
      # and the published image is a mix of two commits.
      - name: Resolve ref to an immutable SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install yq
        run: |
          sudo curl -sSL "https://github.com/mikefarah/yq/releases/download/v4.30.8/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Flatten manifest + resolve version tag
        id: list
        # Caller-controlled values go through `env:` and are read as shell
        # variables — never interpolated into the script body, where a ref or
        # tag containing shell metacharacters would execute in this job.
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          RESOLVED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          TARGETS=$(yq -o=json -I=0 '[.config[].build[] | {"image": .["image-name"], "workdir": .["work-dir"], "dockerfile": (.dockerfile // "")}]' build/build-config.yml)
          IMAGES=$(yq -o=json -I=0 '[.config[].build[].["image-name"]]' build/build-config.yml)
          COUNT=$(echo "$TARGETS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then echo "FATAL: no targets parsed"; exit 1; fi
          VERSION_TAG="$INPUT_VERSION_TAG"
          if [ -z "$VERSION_TAG" ]; then
            # Default tag names the COMMIT, not the calendar day. It is sliced
            # from the very SHA `steps.sha` resolved and every build leg checks
            # out, so the tag provably identifies the code inside the image — a
            # date could not: a re-run later the same day silently overwrote the
            # day's "immutable" tag with different code, and two nights on an
            # unchanged develop minted two tags for one commit.
            # 8 hex chars, matching `git rev-parse --short HEAD` in this repo, so
            # the nightly and a build.yml dispatch of the same develop commit
            # agree on one name (`develop-<sha8>`) instead of inventing two.
            if ! printf '%s' "$RESOLVED_SHA" | grep -qE '^[0-9a-f]{40,}$'; then
              echo "FATAL: resolved SHA is not a hex object id: $RESOLVED_SHA"; exit 1
            fi
            VERSION_TAG="develop-${RESOLVED_SHA:0:8}"
          fi
          # A tag is pushed verbatim to the registry and re-read by later shell
          # steps; reject anything outside Docker's own tag grammar up front.
          if ! printf '%s' "$VERSION_TAG" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "FATAL: refusing unsafe version tag: $VERSION_TAG"; exit 1
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "images=$IMAGES"   >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "### Build targets ($COUNT) — ref ${INPUT_REF} → ${VERSION_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "$TARGETS" | jq -r '.[].image' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

  build:
    name: ${{ matrix.target.image }} (${{ matrix.arch }})
    needs: enumerate
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.enumerate.outputs.targets) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The SHA resolved once by `enumerate`, not the mutable input ref.
          ref: ${{ needs.enumerate.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Build and push per-arch staging tag
        env:
          IMAGE: ${{ matrix.target.image }}
          WORKDIR: ${{ matrix.target.workdir }}
          DOCKERFILE: ${{ matrix.target.dockerfile }}
          STAGING_PREFIX: ${{ inputs.staging_prefix }}
          ARCH: ${{ matrix.arch }}
          RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # RUN_SCOPE is run_id + run_attempt, so a manifest can only ever be
          # stitched from images THIS attempt produced. A per-channel-only name
          # let a failed arch build leave the previous run's tag in place and
          # the manifest publish a mixed image (today's amd64 + yesterday's
          # arm64); run_id alone still allowed that across re-runs of one run,
          # since run_id is stable per run and only run_attempt increments.
          TAG="${PUSH_NAMESPACE}/${IMAGE}:${STAGING_PREFIX}-staging-${RUN_SCOPE}-${ARCH}"
          if [ "$DOCKERFILE" = "build/maven/Dockerfile" ]; then
            docker buildx build --platform "linux/${ARCH}" \
              --build-arg WORK_DIR="$WORKDIR" -f build/maven/Dockerfile \
              -t "$TAG" --push .
          elif [ -n "$DOCKERFILE" ]; then
            docker buildx build --platform "linux/${ARCH}" \
              -f "$DOCKERFILE" -t "$TAG" --push "$WORKDIR"
          else
            docker buildx build --platform "linux/${ARCH}" \
              -t "$TAG" --push "$WORKDIR"
          fi

  # One job looping over the images, not a matrix: each leg was a whole runner
  # VM doing a login plus one imagetools call, so boot/checkout dwarfed the real
  # work and burned ~19 org runner slots every nightly. Per-image isolation is
  # kept in the loop — one image failing skips only that image.
  manifest:
    name: Stitch multi-arch tags
    needs: [enumerate, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Create version (+ rolling) manifests
        env:
          IMAGES: ${{ needs.enumerate.outputs.images }}
          VERSION_TAG: ${{ needs.enumerate.outputs.version_tag }}
          ROLLING_TAG: ${{ inputs.rolling_tag }}
          STAGING_PREFIX: ${{ inputs.staging_prefix }}
          RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          failed=0; published=0
          for NAME in $(echo "$IMAGES" | jq -r '.[]'); do
            IMG="${PUSH_NAMESPACE}/${NAME}"
            AMD="$IMG:${STAGING_PREFIX}-staging-${RUN_SCOPE}-amd64"
            ARM="$IMG:${STAGING_PREFIX}-staging-${RUN_SCOPE}-arm64"
            # Both arch tags must exist AND carry this attempt's scope, or we
            # refuse to publish — a half-built or mixed-attempt image must never
            # become the version/rolling tag.
            if ! docker buildx imagetools inspect "$AMD" >/dev/null 2>&1 \
               || ! docker buildx imagetools inspect "$ARM" >/dev/null 2>&1; then
              echo "SKIP ${NAME}: staging tags from attempt ${RUN_SCOPE} are incomplete"
              echo "- ❌ SKIPPED \`${NAME}\` — build did not complete for both arches" >> $GITHUB_STEP_SUMMARY
              failed=1
              continue
            fi
            TAGS=(-t "$IMG:$VERSION_TAG")
            if [ -n "$ROLLING_TAG" ]; then TAGS+=(-t "$IMG:$ROLLING_TAG"); fi
            if docker buildx imagetools create "${TAGS[@]}" "$AMD" "$ARM"; then
              echo "- ✅ \`$IMG:$VERSION_TAG\`${ROLLING_TAG:+, \`$IMG:$ROLLING_TAG\`}" >> $GITHUB_STEP_SUMMARY
              published=$((published+1))
            else
              echo "- ❌ \`${NAME}\` — imagetools create failed" >> $GITHUB_STEP_SUMMARY
              failed=1
            fi
          done
          echo "Published ${published} image(s)."
          exit $failed

  # Runs even when `manifest` failed, so a broken run does not leak its staging
  # tags. The snapshot-tag prune is still gated on the caller opting in.
  cleanup:
    name: Delete this run's staging tags (+ prune develop snapshots)
    needs: [enumerate, manifest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Clean up Docker Hub tags (egovio namespace)
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          IMAGES: ${{ needs.enumerate.outputs.images }}
          STAGING_PREFIX: ${{ inputs.staging_prefix }}
          RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
          PRUNE_DEVELOP: ${{ inputs.prune_develop }}
        run: |
          set -uo pipefail
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"$DOCKER_USERNAME\", \"password\": \"$DOCKER_PASSWORD\"}" | jq -r .token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "Hub login failed"; exit 1; }

          # A silently-failed delete is how tags accumulate unnoticed — and it
          # compounds, because a repo past 100 snapshot tags then needs pagination
          # to prune correctly. So: 404 is idempotent success (already gone),
          # anything else is recorded and fails the job at the end.
          delete_failures=0
          del() { # $1=image $2=tag
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${PUSH_NAMESPACE}/$1/tags/$2/")
            case "$code" in
              2*)  echo "  deleted $1:$2" ;;
              404) echo "  already absent $1:$2" ;;
              *)   echo "  ERROR: delete failed for $1:$2 (HTTP $code — token may lack delete scope)"
                   delete_failures=$((delete_failures+1)) ;;
            esac
          }

          # list_snapshots <image> — every develop-<sha> snapshot tag, following
          # `next` pages. A single page_size=100 request silently truncated the
          # list, so a repo with >100 snapshot tags kept the overflow forever.
          #
          # Emits "<last_updated>TAB<name>", because ORDER is the thing commit
          # tags lost: develop-YYYYMMDD sorted newest-first by name for free,
          # a hash has no intrinsic order at all. The registry's own
          # `last_updated` is the only trustworthy age, so retention sorts on
          # that (falling back to tag_last_pushed, then to "" = treat as oldest).
          #
          # `^develop-[0-9a-f]{8,}$` is deliberately calibrated:
          #  - matches the new 8-char commit tags;
          #  - ALSO matches legacy develop-YYYYMMDD (8 digits are 8 hex chars),
          #    so dated tags already on the Hub keep ageing out instead of
          #    leaking forever once nothing mints them;
          #  - does NOT match the 7-char develop-<sha7> tags that the compose
          #    files and helm values pin as defaults (e.g. develop-70916ea) —
          #    a {7,} bound would have pruned live deployment pins;
          #  - can never match `nightly-develop`, `<prefix>-staging-…-amd64`
          #    (the `name=develop-` server filter returns those too) or a
          #    release tag, all of which fail the anchors or the hex class.
          list_snapshots() {
            local url="https://hub.docker.com/v2/repositories/${PUSH_NAMESPACE}/$1/tags?page_size=100&name=develop-"
            local body
            while [ -n "$url" ] && [ "$url" != "null" ]; do
              body=$(curl -s -H "Authorization: JWT $TOKEN" "$url")
              echo "$body" | jq -r '
                .results[]?
                | select((.name // "") | test("^develop-[0-9a-f]{8,}$"))
                | "\(.last_updated // .tag_last_pushed // "")\t\(.name)"'
              url=$(echo "$body" | jq -r '.next // ""')
            done
          }

          for IMG in $(echo "$IMAGES" | jq -r '.[]'); do
            # 1. This attempt's per-arch staging tags — pure intermediates. The
            #    published manifests reference digests, so removing them is safe.
            for ARCH in amd64 arm64; do
              del "$IMG" "${STAGING_PREFIX}-staging-${RUN_SCOPE}-${ARCH}"
            done

            # 2. develop-<sha> snapshots, the 5 most recently pushed retained.
            #    Sorting the "<last_updated>TAB<name>" lines in C locale orders
            #    by the ISO-8601 timestamp (fixed-width, so lexical == chrono);
            #    -r puts newest first, `tail -n +6` is therefore everything past
            #    the 5 keepers, and `cut -f2` drops the timestamp again. A tag
            #    with no timestamp starts the line with TAB, sorts last, and is
            #    pruned first — which is the safe direction.
            [ "$PRUNE_DEVELOP" = "true" ] || continue
            for T in $(list_snapshots "$IMG" | LC_ALL=C sort -r | tail -n +6 | cut -f2); do
              [ -n "$T" ] || continue
              del "$IMG" "$T"
            done
          done

          if [ "$delete_failures" -gt 0 ]; then
            echo "::error::${delete_failures} tag deletion(s) failed — tags are accumulating on Docker Hub."
            exit 1
          fi
