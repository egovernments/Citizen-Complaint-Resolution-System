# Source-code dependency vulnerability scan (OSV-Scanner) for the application code dirs.
# Reads security_scan/code-base/code-scan-config.yaml, scans each project, and publishes a per-project
# report to Drive + the gh-pages "Source Code" dashboard module. Report-only.
name: Code-Base Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'          # weekly, Monday 02:30 UTC
  push:
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'digit-ui-esbuild/**'
      - 'digit-ui-v2/**'
      - 'security_scan/code-base/**'
      - '.github/workflows/code-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    name: OSV-Scanner (per project)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1

      - name: Install Python deps
        run: pip install -r security_scan/code-base/requirements.txt

      - name: Run source-code scan
        env:
          SECSCAN_TOKEN: ${{ secrets.SECSCAN_TOKEN }}
          SCAN_USER: ${{ github.actor }}
        run: python security_scan/code-base/scan.py --out run.json

      - name: Upload run artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: source-code-scan
          path: run.json
          retention-days: 14
