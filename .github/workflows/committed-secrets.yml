# Fails the build if a tracked file ships a real credential.
#
# This repo is public: a secret committed here is disclosed the moment it lands,
# and deleting it later does not undo that. A security audit found working
# postgres / MinIO / Keycloak credentials for named deployments in tracked
# *.yml.example files, plus two live Google Maps API keys in a checked-in
# globalConfigsPGR.js.
name: committed-secrets

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git grep / git ls-files only see the checked-out tree; full history
          # is not needed (this guards what a PR ADDS, not what history holds —
          # already-leaked values still need rotating out of band).
          fetch-depth: 1
      - name: Scan tracked files for committed secrets
        run: local-setup/ansible/scripts/check-committed-secrets.sh
