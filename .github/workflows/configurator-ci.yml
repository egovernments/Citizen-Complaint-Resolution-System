name: Configurator CI

# Unit tests for configurator/ and its two local packages. None of them needs a
# deployment or a browser. Besides configurator/**, the paths list everything
# outside it that the tests read: ui-shared/ (imported by
# src/config/featureFlags.ts) and the seed/doc files below. Without them, a PR
# that changes only one of those files would merge without this job running.

on:
  pull_request:
    branches: [develop, master]
    paths:
      - 'configurator/**'
      - 'ui-shared/**'
      # src/admin/validation.postalCode.test.ts
      - 'local-setup/db/full-dump.sql'
      - 'utilities/default-data-handler/src/main/resources/mdmsData/common-masters/common-masters.FormValidations.json'
      # src/api/onboarding.test.ts
      - 'backend/identity-bff/docs/identity-bff.md'
      # src/onboarding/signup/mobileRules.test.ts
      - 'backend/pgr-services/src/main/resources/onboarding/platform-baseline-v1.json'
      # src/onboarding/labels.test.ts
      - 'backend/pgr-services/src/main/resources/onboarding/l10n/en_IN/configurator-ui.json'
      - 'local-setup/ansible/files/configurator-localization/configurator-ui.json'
      # src/resources/workflow-services/shippedNotificationDefaults.test.ts
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS/**'
      - '.github/workflows/configurator-ci.yml'
  push:
    branches: [develop, master]
    paths:
      - 'configurator/**'
      - 'ui-shared/**'
      # src/admin/validation.postalCode.test.ts
      - 'local-setup/db/full-dump.sql'
      - 'utilities/default-data-handler/src/main/resources/mdmsData/common-masters/common-masters.FormValidations.json'
      # src/api/onboarding.test.ts
      - 'backend/identity-bff/docs/identity-bff.md'
      # src/onboarding/signup/mobileRules.test.ts
      - 'backend/pgr-services/src/main/resources/onboarding/platform-baseline-v1.json'
      # src/onboarding/labels.test.ts
      - 'backend/pgr-services/src/main/resources/onboarding/l10n/en_IN/configurator-ui.json'
      - 'local-setup/ansible/files/configurator-localization/configurator-ui.json'
      # src/resources/workflow-services/shippedNotificationDefaults.test.ts
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS/**'
      - '.github/workflows/configurator-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: configurator
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not the Dockerfile's 20: under Node 20, LoginPage.test.tsx
          # fails intermittently (findByText returns a node a re-render then
          # replaces).
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      # Also installs the dependencies of the file: packages
      # (packages/data-provider, packages/digit-datagrid) into this node_modules.
      - run: npm ci

      # vitest.config.ts aliases @digit-mcp/data-provider to the package
      # source, so no data-provider build is needed here.
      - name: Configurator unit tests (vitest)
        run: npx vitest run

      # The later steps run even if an earlier suite failed, so one push
      # reports every failing suite.
      - name: digit-datagrid unit tests (vitest)
        if: ${{ !cancelled() }}
        run: npx vitest run --root packages/digit-datagrid

      # data-provider's npm test leaves out the *integration* files, which
      # need a live DIGIT API.
      - name: data-provider unit tests (node --test)
        if: ${{ !cancelled() }}
        working-directory: configurator/packages/data-provider
        run: npm test

      # Advisory until it is made blocking. The app takes
      # @digit-mcp/data-provider's types from its dist/, so build that first.
      # Every check runs even if an earlier one fails.
      - name: Type-check (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          status=0
          npx tsc -p packages/data-provider || status=1
          npx tsc --noEmit -p tsconfig.app.json || status=1
          npx tsc --noEmit -p tsconfig.node.json || status=1
          exit $status
