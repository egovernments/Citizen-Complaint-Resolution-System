name: Keycloak CI

# The identity Keycloak: realm configuration (configure-keycloak.sh +
# realm.json), the image (Dockerfile) and the login themes (theme-src).
on:
  pull_request:
    paths:
      - "keycloak/**"
      # The login theme's palettes are generated from these presets; its tests fail on drift.
      - "configurator/src/themes/**"
      - ".github/workflows/keycloak-ci.yml"
  push:
    branches: [develop]
    paths:
      - "keycloak/**"
      - "configurator/src/themes/**"
      - ".github/workflows/keycloak-ci.yml"

jobs:
  realm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keycloak
    steps:
      - uses: actions/checkout@v4
      - name: Lint the scripts
        run: |
          bash -n configure-keycloak.sh tests/run-live-check.sh
          shellcheck configure-keycloak.sh tests/run-live-check.sh
          jq -e . realm.json >/dev/null
      # Applies the script twice to a throwaway Keycloak 26.7.3, then signs in
      # through it: events, self-service actions (design §8) and the
      # configuration-only changes of design §9.
      - name: Live realm check
        run: tests/run-live-check.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Keycloak 26.7.3 image
        run: docker build -f keycloak/Dockerfile -t identity-keycloak:test keycloak
      - name: Smoke-test the login theme on that Keycloak
        working-directory: keycloak/theme-src
        env:
          IDENTITY_KEYCLOAK_IMAGE: identity-keycloak:test
          SKIP_BUILD: "1"
        run: scripts/keycloak-smoke.sh

  login-theme:
    runs-on: ubuntu-latest
    # The screenshot baselines are recorded in this image (see
    # keycloak/theme-src/scripts/screenshots.sh). Running the job anywhere else
    # rasterizes text differently and the comparison flaps.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: keycloak/theme-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keycloak/theme-src/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit tests (rendering and page coverage)
        run: npm test
      - name: Screenshot regression (desktop and mobile)
        run: npx playwright test
      # The jar itself is built and asserted by the `image` job, which is also
      # where a packaging failure would matter.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: login-theme-screenshot-diff
          path: keycloak/theme-src/test-results/
