name: Nightly Develop Build
run-name: Nightly develop build (${{ github.event_name }})

on:
  schedule:
    - cron: '30 13 * * *'   # 7:00 PM IST (UTC+5:30). Cron is UTC-only.
  workflow_dispatch: {}

# NOTE: scheduled workflows fire only from the DEFAULT branch (master) and this
# file must exist there. It calls develop's build-images.yml (not master's copy) and
# that checks out `develop`, so both the build logic and the source track develop.

concurrency:
  group: nightly-develop
  cancel-in-progress: false

jobs:
  build:
    # develop-channel build logic follows develop: a local ./ path would resolve to the DEFAULT
    # branch's (master's) copy, which drifts behind develop's build pipeline. Same repo, so
    # secrets: inherit and the repo's vars still apply. release-build.yml stays on its own ref.
    uses: egovernments/Citizen-Complaint-Resolution-System/.github/workflows/build-images.yml@develop
    with:
      ref: develop
      rolling_tag: nightly-develop        # rolling latest-develop pointer
      staging_prefix: nightly-develop
      prune_develop: true                 # keep the 5 most recent develop-<sha> per image
    secrets: inherit
