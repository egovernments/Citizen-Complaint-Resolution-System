name: Nightly Develop Build
run-name: Nightly develop build (${{ github.event_name }})

on:
  schedule:
    - cron: '30 13 * * *'   # 7:00 PM IST (UTC+5:30). Cron is UTC-only.
  workflow_dispatch: {}

# NOTE: scheduled workflows fire only from the DEFAULT branch (master) and this
# file must exist there. It calls develop's build-images.yml (not master's copy) and
# that checks out `develop`, so both the build logic and the source track develop.

concurrency:
  group: nightly-develop
  cancel-in-progress: false

jobs:
  build:
    # Only the canonical repository publishes the develop channel: build-images.yml
    # skips every job anywhere else (see its `enumerate` job). Two forks carrying this
    # file and egovio push credentials built THEIR develop every evening, hours after
    # this nightly, under the same egovio/<image>:nightly-develop and develop-<sha8>
    # names: `nightly-develop` ended up as a fork's build (still the Go
    # digit-user-preferences-service, which cannot start under the develop compose
    # definition) and this repo's develop-<sha8> pins aged out of the prune within days.
    # A fork's own builds belong under its own tags (build.yml dispatches tag by branch
    # name). Like the schedule, the guard runs from a repo's default branch: it stops a
    # fork only once the fork has it there.
    uses: ./.github/workflows/build-images.yml
    with:
      ref: develop
      rolling_tag: nightly-develop        # rolling latest-develop pointer
      staging_prefix: nightly-develop
      prune_develop: true                 # keep the 5 most recent develop-<sha> per image
    secrets: inherit
