name: Nightly Develop Build
run-name: Nightly develop build (${{ github.event_name }})

on:
  schedule:
    - cron: '30 13 * * *'   # 7:00 PM IST (UTC+5:30). Cron is UTC-only.
  workflow_dispatch: {}

# NOTE: scheduled workflows fire only from the DEFAULT branch (master) and this
# file must exist there. The reusable build checks out `develop` regardless of
# which branch this file ran from, so the nightly always builds develop.

concurrency:
  group: nightly-develop
  cancel-in-progress: false

jobs:
  build:
    # Only the canonical repository publishes the develop channel. A fork that carries
    # this file and egovio push credentials otherwise builds ITS develop under the same
    # egovio/<image>:nightly-develop and develop-<sha8> names, and its prune evicts this
    # repo's snapshots. Two forks did exactly that every evening, hours after this
    # nightly: `nightly-develop` ended up as a fork's build (still the Go
    # digit-user-preferences-service, which cannot start under the develop compose
    # definition) and the develop-<sha8> pins aged out within days. A fork's own builds
    # belong under its own tags (build.yml dispatches tag by branch name).
    # Like the schedule itself, this takes effect from the default branch.
    if: github.repository == 'egovernments/Citizen-Complaint-Resolution-System'
    uses: ./.github/workflows/build-images.yml
    with:
      ref: develop
      rolling_tag: nightly-develop        # rolling latest-develop pointer
      staging_prefix: nightly-develop
      prune_develop: true                 # keep the 5 most recent develop-<sha> per image
    secrets: inherit
