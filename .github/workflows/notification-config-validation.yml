name: Notification config validation

# "Let's have an out-of-the-box message structure which is validated."
#
# This job is the CI half of that promise. It runs the configurator's PURE
# notification checks — no browser, no app graph — so that:
#   * the four RAINMAKER-PGR.Notification* masters we ship are run through the
#     SAME validator the configurator runs, and a seed edit that breaks a
#     message structure fails the build
#     (configurator/src/resources/notification-configure/defaultSeeds.test.ts);
#   * the placeholder vocabulary the shipped event catalogue advertises stays
#     identical to the tokens pgr-services actually sends — the union of the
#     `data` and `localized` maps of ThinEventBuilder, since the thin-event
#     cutover left the producer filling values rather than rendering messages
#     (configurator/src/resources/workflow-services/placeholderParity.test.ts);
#   * the rules themselves and the save guard keep their unit coverage.
#
# WHY A NAMED LIST OF TEST PATHS AND NOT `npm test`
#   The configurator suite also carries `src/admin/validation.postalCode.test.ts`,
#   whose full-dump.sql-vs-seed contract is RED on master for an unrelated
#   postal-code drift. Running the whole suite here would make this job red for
#   reasons that have nothing to do with notifications, and a job that is always
#   red teaches people to ignore it. Widen the list once that test is green.
#
# NOTE ON `paths`: a seed-only change touches nothing under configurator/, so the
# seed files MUST be listed — otherwise the very change this job exists to catch
# would skip it silently (a path filter is a skip, not a failure). The two lists
# below are duplicated on purpose: GitHub Actions does not support YAML anchors,
# so keep them in sync by hand.

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'configurator/src/resources/notification-configure/**'
      - 'configurator/src/resources/notification-providers/**'
      - 'configurator/src/resources/workflow-services/**'
      - 'configurator/src/admin/**'
      # The resource registry decides which MDMS schema each screen reads and writes,
      # and which of them are read-only. The five NOTIFICATIONS.* masters and the four
      # legacy ones now live there; a change to it that nothing checked would point a
      # screen at a schema that does not exist, or make a frozen master writable again.
      - 'configurator/packages/data-provider/**'
      - 'configurator/package.json'
      - 'configurator/package-lock.json'
      - 'configurator/vitest.config.ts'
      - 'configurator/tsconfig*.json'
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/RAINMAKER-PGR/RAINMAKER-PGR.Notification*.json'
      - 'utilities/default-data-handler/src/main/resources/schema/RAINMAKER-PGR.json'
      # The module-neutral namespace, added with the masters themselves: the generated
      # seed is what the configurator will validate once its resources are re-pointed,
      # and omitting the paths here would silently skip that from the first day.
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS/**'
      - 'utilities/default-data-handler/src/main/resources/schema/NOTIFICATIONS.json'
      - 'local-setup/dataloader/templates/PgrWorkflowConfig.json'
      - 'backend/pgr-services/src/main/java/org/egov/pgr/service/NotificationService.java'
      # The PRODUCER of the placeholder values. pgr-services renders nothing any more:
      # ThinEventBuilder's `data` + `localized` maps ARE the token vocabulary that
      # placeholderParity.test.ts reads, so a change in this package must run this job.
      - 'backend/pgr-services/src/main/java/org/egov/pgr/service/notification/**'
      - '.github/workflows/notification-config-validation.yml'
  # No branch filter on pull_request: a branch list here is a SILENT skip, and
  # retargeting a PR must not quietly drop this check.
  pull_request:
    paths:
      - 'configurator/src/resources/notification-configure/**'
      - 'configurator/src/resources/notification-providers/**'
      - 'configurator/src/resources/workflow-services/**'
      - 'configurator/src/admin/**'
      - 'configurator/packages/data-provider/**'
      - 'configurator/package.json'
      - 'configurator/package-lock.json'
      - 'configurator/vitest.config.ts'
      - 'configurator/tsconfig*.json'
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/RAINMAKER-PGR/RAINMAKER-PGR.Notification*.json'
      - 'utilities/default-data-handler/src/main/resources/schema/RAINMAKER-PGR.json'
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS/**'
      - 'utilities/default-data-handler/src/main/resources/schema/NOTIFICATIONS.json'
      - 'local-setup/dataloader/templates/PgrWorkflowConfig.json'
      - 'backend/pgr-services/src/main/java/org/egov/pgr/service/NotificationService.java'
      # The PRODUCER of the placeholder values. pgr-services renders nothing any more:
      # ThinEventBuilder's `data` + `localized` maps ARE the token vocabulary that
      # placeholderParity.test.ts reads, so a change in this package must run this job.
      - 'backend/pgr-services/src/main/java/org/egov/pgr/service/notification/**'
      - '.github/workflows/notification-config-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Seeds + rules + save guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'configurator/package-lock.json'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Validate the shipped notification seeds + the rules that check them
        run: |
          npx vitest run \
            src/resources/notification-configure \
            src/resources/notification-providers \
            src/resources/workflow-services

  data-provider:
    name: Resource registry (data-provider package)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: configurator/packages/data-provider
    steps:
      - uses: actions/checkout@v4

      # NODE 22, NOT 20, and only in this job. `--test-skip-pattern` is what keeps the
      # three network-dependent cases below out of the run, and it landed in Node 22.1.
      # The vitest job above stays on 20 so this does not move the whole toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'configurator/packages/data-provider/package-lock.json'

      - name: Install
        run: npm ci

      # The registry is where the five NOTIFICATIONS.* masters are declared (state-tenant
      # reads and writes, the event catalogue read-only) and where the four legacy masters
      # are frozen. Nothing else asserts either fact.
      - name: Resource registry
        run: node --import tsx --test src/providers/resourceRegistry.test.ts

      # dataProvider.test.ts is run with three cases EXCLUDED BY NAME. All three resolve a
      # complaint type's hierarchyType/levelCode and reach for a real DIGIT host, so they
      # fail on a runner with no DNS for it — for reasons that have nothing to do with the
      # code under review. They are, verbatim:
      #
      #   "resolves hierarchyType/levelCode for a new complaint type from the tenant's
      #    actual hierarchy definition, not a hardcoded literal"
      #   "falls back to PGR/SUB_TYPE for a new complaint type when the tenant has no
      #    hierarchy definition yet"
      #   "does not overwrite an existing complaint type's hierarchyType/levelCode on update"
      #
      # The filter is the substring "complaint type", which today matches exactly those
      # three and nothing else. A future case whose name contains it would be skipped
      # silently, so: name new cases in this file without that phrase, or narrow the
      # pattern here. The remaining 31 cases run for real.
      - name: Data provider (excluding the three network-dependent complaint-type cases)
        run: node --import tsx --test --test-skip-pattern='complaint type' src/providers/dataProvider.test.ts
