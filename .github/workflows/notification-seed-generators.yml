name: Notification seed generators

# The NOTIFICATIONS.* seed data is GENERATED, not hand-written:
#
#   * NOTIFICATIONS.{Routing,Template,ProviderTemplate,Channel}.json are produced from
#     the RAINMAKER-PGR.Notification* seed by local-setup/scripts/notifications_convert.py
#     — the same pure functions seed-notifications.py runs against a LIVE tenant's rows.
#   * NOTIFICATIONS.EventCatalogue.json is produced from the PGR workflow definition by
#     local-setup/scripts/generate_event_catalogue.py.
#
# Generated files that nothing regenerates in CI drift the moment somebody edits the
# source by hand: the catalogue would advertise an event the workflow can no longer
# reach, or a template would exist for a transition that was deleted, and the first
# sign of it would be a notification that never fires in production. So this job
# re-runs both generators and fails on a diff.
#
# It also diffs the access-control rows in seed-notifications.py against
# local-setup/db/full-dump.sql. A tenant seeded by the dump and a tenant seeded by the
# script must agree on the numeric action ids, because a role-action references an
# action by id — and when they disagree, Kong's enforce_rbac fails CLOSED on one of the
# two stacks and the Notifications screens 403 with no message anywhere.
#
# WHY A SEPARATE JOB FROM notification-config-validation.yml
#   That job is the configurator's vitest suite: Node, npm ci, the whole TS toolchain.
#   This one is stdlib Python with no install step, so it stays a seconds-long gate that
#   a seed-only PR gets for free. The two `paths` lists below are duplicated on purpose:
#   GitHub Actions does not support YAML anchors, so keep them in sync by hand.
#
# NOTE ON `paths`: a path filter is a SILENT SKIP, not a failure. A change to only the
# workflow definition, or only the seed data, or only the dump, MUST appear below —
# otherwise the very change this job exists to catch never runs it.

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'local-setup/scripts/notifications_convert.py'
      - 'local-setup/scripts/generate_event_catalogue.py'
      - 'local-setup/scripts/seed-notifications.py'
      - 'local-setup/scripts/test_notifications_convert.py'
      - 'local-setup/scripts/test_event_catalogue.py'
      - 'local-setup/scripts/test_acl_dump_parity.py'
      - 'local-setup/dataloader/templates/PgrWorkflowConfig.json'
      - 'local-setup/db/full-dump.sql'
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS/**'
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/RAINMAKER-PGR/RAINMAKER-PGR.Notification*.json'
      - 'utilities/default-data-handler/src/main/resources/schema/NOTIFICATIONS.json'
      - 'utilities/default-data-handler/src/main/resources/schema/RAINMAKER-PGR.json'
      - '.github/workflows/notification-seed-generators.yml'
  # No branch filter on pull_request: a branch list here is a SILENT skip, and
  # retargeting a PR must not quietly drop this check.
  pull_request:
    paths:
      - 'local-setup/scripts/notifications_convert.py'
      - 'local-setup/scripts/generate_event_catalogue.py'
      - 'local-setup/scripts/seed-notifications.py'
      - 'local-setup/scripts/test_notifications_convert.py'
      - 'local-setup/scripts/test_event_catalogue.py'
      - 'local-setup/scripts/test_acl_dump_parity.py'
      - 'local-setup/dataloader/templates/PgrWorkflowConfig.json'
      - 'local-setup/db/full-dump.sql'
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS/**'
      - 'utilities/default-data-handler/src/main/resources/mdmsData-dev/RAINMAKER-PGR/RAINMAKER-PGR.Notification*.json'
      - 'utilities/default-data-handler/src/main/resources/schema/NOTIFICATIONS.json'
      - 'utilities/default-data-handler/src/main/resources/schema/RAINMAKER-PGR.json'
      - '.github/workflows/notification-seed-generators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generators:
    name: Generated seed data matches its sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Stdlib only, on purpose: these scripts also run on a deploy host next to
      # seed-notifications.py, where nothing may be pip-installed.
      - name: unit tests (converter, catalogue generator, ACL/dump parity)
        working-directory: local-setup/scripts
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: every touched python file compiles
        run: |
          python3 -m py_compile \
            local-setup/scripts/notifications_convert.py \
            local-setup/scripts/generate_event_catalogue.py \
            local-setup/scripts/seed-notifications.py \
            local-setup/scripts/test_notifications_convert.py \
            local-setup/scripts/test_event_catalogue.py \
            local-setup/scripts/test_acl_dump_parity.py

      # The no-diff gates, run again as the generators' own --check modes so a failure
      # names the file and the command to regenerate it rather than an assertion.
      - name: converted NOTIFICATIONS.* defaults are up to date
        run: python3 local-setup/scripts/notifications_convert.py --check

      - name: the event catalogue matches the PGR workflow definition
        run: python3 local-setup/scripts/generate_event_catalogue.py --check

      # Belt and braces: regenerate for real and let git decide. --check compares the
      # bytes the generator would write; this also catches a file added to the
      # NOTIFICATIONS/ directory that no generator produces.
      - name: regenerating produces no diff
        run: |
          python3 local-setup/scripts/notifications_convert.py
          python3 local-setup/scripts/generate_event_catalogue.py
          git --no-pager diff --stat --exit-code -- \
            utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS \
          || {
            echo "::error::Generated NOTIFICATIONS.* seed data is stale. Re-run:"
            echo "  python3 local-setup/scripts/notifications_convert.py"
            echo "  python3 local-setup/scripts/generate_event_catalogue.py"
            exit 1
          }
          untracked=$(git ls-files --others --exclude-standard -- \
            utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS)
          if [ -n "$untracked" ]; then
            echo "::error::untracked generated files: $untracked"
            exit 1
          fi

      - name: every notification JSON file parses
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = 0
          for pattern in (
              'utilities/default-data-handler/src/main/resources/schema/NOTIFICATIONS.json',
              'utilities/default-data-handler/src/main/resources/schema/RAINMAKER-PGR.json',
              'utilities/default-data-handler/src/main/resources/mdmsData-dev/NOTIFICATIONS/*.json',
              'utilities/default-data-handler/src/main/resources/mdmsData-dev/RAINMAKER-PGR/RAINMAKER-PGR.Notification*.json',
          ):
              for path in sorted(glob.glob(pattern)):
                  try:
                      with open(path, encoding='utf-8') as fh:
                          json.load(fh)
                      print('OK  ' + path)
                  except ValueError as exc:
                      print('BAD ' + path + ': ' + str(exc))
                      bad += 1
          sys.exit(1 if bad else 0)
          PY

      # An empty "x-ref-schema": [] is mangled to {} on storage and then throws
      # ClassCastException on EVERY subsequent data create for that schema. The seeder
      # strips one defensively; authoring one is still a bug, so it fails here.
      - name: no schema authors an empty x-ref-schema
        run: |
          python3 - <<'PY'
          import json, sys
          path = 'utilities/default-data-handler/src/main/resources/schema/NOTIFICATIONS.json'
          with open(path, encoding='utf-8') as fh:
              schemas = json.load(fh)
          bad = [s['code'] for s in schemas
                 if (s.get('definition') or {}).get('x-ref-schema') == []]
          if bad:
              print('::error::empty x-ref-schema in: ' + ', '.join(bad))
              sys.exit(1)
          print('OK: %d schemas, none with an empty x-ref-schema' % len(schemas))
          PY
