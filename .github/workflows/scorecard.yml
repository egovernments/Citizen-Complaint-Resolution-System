# OpenSSF Scorecard - supply-chain security health check for eGov-Global/CMS-MOZAMBIQUE.
# Runs the Scorecard analysis and publishes results to the GitHub Security tab (code scanning)
# and to the public OpenSSF viewer (https://scorecard.dev/viewer/?uri=github.com/eGov-Global/CMS-MOZAMBIQUE).
# Aligned with the eGov OpenSSF guideline. All actions are pinned to full commit SHAs.
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '45 1 * * 4'   # weekly, Thursday 01:45 UTC
  push:
    branches: [ "master" ]
  workflow_dispatch:

# Least-privilege default; the job below opts into only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Only run on the default branch (or a manual dispatch) - publish_results aborts elsewhere.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish the results to the OpenSSF API
    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
