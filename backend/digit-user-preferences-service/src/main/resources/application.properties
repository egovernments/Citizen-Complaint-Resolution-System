# Server
# The API lives under user.preference.context-path (applied per-controller, see
# PreferenceController) while /health stays at the root, matching the routing
# the Go service exposed and every probe that already points at it.
server.port=${SERVER_PORT:8080}
user.preference.context-path=${SERVER_CONTEXT_PATH:/user-preference}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SERVER_SHUTDOWN_TIMEOUT:30s}
server.tomcat.connection-timeout=${SERVER_READ_TIMEOUT:15s}
# SERVER_WRITE_TIMEOUT has no Tomcat counterpart — Go's http.Server applied a
# deadline to writing the response, which Tomcat does not expose — so it is
# accepted-and-ignored rather than mapped onto an unrelated knob. No deployment
# sets it.

# Database
# DB_* are the Go service's variable names and are what the Helm chart and the
# compose stack already set, so the image stays a drop-in replacement. The
# SPRING_DATASOURCE_* forms take precedence for parity with the sibling Java
# services, whose compose entries set those instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_preferences}?sslmode=${DB_SSL_MODE:disable}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# Connection pool: DB_MAX_CONNS, DB_MIN_CONNS, DB_MAX_CONN_LIFETIME and
# DB_MAX_CONN_IDLE_TIME are read in DataSourceConfig, which accepts the Go
# duration spellings ("1h", "30m") those last two have always carried.

# Flyway
# Replaces the Go service's GORM AutoMigrate. The history table is namespaced
# per service because deployments share one `egov` database. Enabled by default
# so a standalone run still creates its schema; the compose and Kubernetes
# stacks turn it off and let the digit-user-preferences-service-db init
# container own the schema, as they do for every sibling service.
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}
spring.flyway.table=${SPRING_FLYWAY_TABLE:digit_user_preferences_service_schema}
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:db/migration/main
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=false

# Jackson
# Go matched JSON keys case-insensitively, so callers settled on whichever
# casing they happened to use: novu-bridge posts `requestInfo`, the seed
# scripts post `RequestInfo`. Both must keep working.
spring.jackson.mapper.accept-case-insensitive-properties=true
# Go ignored unknown keys too, and callers do send fields this service has no
# use for (RequestInfo.plainAccessRequest, for one). Stated rather than left to
# Boot's default so the tolerance is part of the configuration, not an accident.
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false

# Actuator — deliberately left at its default /actuator base path, unlike
# digit-config-service which moves it to /. Moving it here would shadow the
# /health controller that every probe for this service points at.
management.endpoints.web.exposure.include=health,info

# Search paging
user.preference.search.default-offset=0
user.preference.search.default-limit=10
user.preference.search.max-limit=100

# Timezone
app.timezone=${APP_TIMEZONE:UTC}
