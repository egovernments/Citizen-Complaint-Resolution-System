# Server
# The API lives under user.preference.context-path (applied per-controller, see
# PreferenceController) while /health stays at the root, matching the routing
# the Go service exposed and every probe that already points at it.
server.port=${SERVER_PORT:8080}
user.preference.context-path=${SERVER_CONTEXT_PATH:/user-preference}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SERVER_SHUTDOWN_TIMEOUT:30s}
server.tomcat.connection-timeout=${SERVER_READ_TIMEOUT:15s}
# SERVER_WRITE_TIMEOUT has no Tomcat counterpart — Go's http.Server applied a
# deadline to writing the response, which Tomcat does not expose — so it is
# accepted-and-ignored rather than mapped onto an unrelated knob. No deployment
# sets it.

# Database
# DB_* are the Go service's variable names and are what the Helm chart and the
# compose stack already set, so the image stays a drop-in replacement. The
# SPRING_DATASOURCE_* forms take precedence for parity with the sibling Java
# services, whose compose entries set those instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_preferences}?sslmode=${DB_SSL_MODE:disable}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
# TLS is set as a driver property rather than only as a URL parameter. On
# Kubernetes the common chart injects SPRING_DATASOURCE_URL from egov-config's
# db-url, which carries no sslmode and would replace the URL composed above,
# silently dropping it. Hikari hands these to the driver for every connection,
# and pgjdbc lets an explicit URL parameter win, so a local or compose URL that
# does spell out sslmode still overrides this.
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:disable}

# Connection pool. Applied by DataSourceConfig rather than by Hikari's own
# properties, because the two durations accept the Go spellings ("1h", "30m")
# they have always carried as well as plain milliseconds, and Hikari's
# millisecond-typed keys reject those outright.
user.preference.db.max-conns=${DB_MAX_CONNS:25}
user.preference.db.min-conns=${DB_MIN_CONNS:5}
user.preference.db.max-conn-lifetime=${DB_MAX_CONN_LIFETIME:1h}
user.preference.db.max-conn-idle-time=${DB_MAX_CONN_IDLE_TIME:30m}

# Flyway
# Replaces the Go service's GORM AutoMigrate. The history table is namespaced
# per service because deployments share one `egov` database. Enabled by default
# so a standalone run still creates its schema; the compose and Kubernetes
# stacks turn it off and let the digit-user-preferences-service-db init
# container own the schema, as they do for every sibling service.
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}
spring.flyway.table=${SPRING_FLYWAY_TABLE:digit_user_preferences_service_schema}
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:db/migration/main
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=false

# Jackson
# Go matched JSON keys case-insensitively, so callers settled on whichever
# casing they happened to use: novu-bridge posts `requestInfo`, the seed
# scripts post `RequestInfo`. Both must keep working.
spring.jackson.mapper.accept-case-insensitive-properties=true
# Go ignored unknown keys too, and callers do send fields this service has no
# use for (RequestInfo.plainAccessRequest, for one). Stated rather than left to
# Boot's default so the tolerance is part of the configuration, not an accident.
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false

# Actuator — deliberately left at its default /actuator base path, unlike
# digit-config-service which moves it to /. Moving it here would shadow the
# /health controller that every probe for this service points at.
management.endpoints.web.exposure.include=health,info

# Search paging
user.preference.search.default-offset=${SEARCH_DEFAULT_OFFSET:0}
user.preference.search.default-limit=${SEARCH_DEFAULT_LIMIT:10}
user.preference.search.max-limit=${SEARCH_MAX_LIMIT:100}

# Locales accepted in a USER_NOTIFICATION_PREFERENCES payload. Tenant-
# configurable because the citizen profile screen offers whatever
# StateInfo.languages carries in MDMS, which is per-tenant data; a deployment
# that adds a locale there would otherwise get INVALID_LANGUAGE for a value
# its own MDMS advertises. An empty value disables the check.
user.preference.valid-languages=${VALID_LANGUAGES:en_IN,hi_IN,fr_IN,pt_IN}

# Authorization. Both endpoints key on the userId in the request body, so
# without this a citizen can read or overwrite another citizen's consent
# (CWE-639). A call with no userInfo at all is service-to-service (novu-bridge
# posts an empty requestInfo) and is allowed through; the gateway is the authN
# boundary and populates userInfo for anything carrying a citizen token.
user.preference.security.enforce-ownership=${ENFORCE_OWNERSHIP:true}
# Roles that may act on someone else's record, and only within their own
# tenant. EMPLOYEE is deliberately absent: HRMS forces it onto every employee
# it creates, so listing it here would grant tenant-wide read and write over
# citizens' consent to every field worker and CSR rather than to admins.
user.preference.security.privileged-roles=${PRIVILEGED_ROLES:SUPERUSER,ACCOUNT_ADMIN,SYSTEM}

# Timezone
app.timezone=${APP_TIMEZONE:UTC}
