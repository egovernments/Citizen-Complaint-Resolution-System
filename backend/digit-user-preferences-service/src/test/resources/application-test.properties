# Test overrides ONLY. Everything else (paging defaults, the language
# allowlist, the Jackson flags, the ownership rule) loads from the real
# src/main/resources/application.properties, so a default changed there is
# exercised by the suite instead of being shadowed by a second copy.
#
# This is a profile, not a second application.properties: a same-named file in
# test resources shadows the main one outright rather than merging with it.
spring.datasource.url=jdbc:h2:mem:userpreferencedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway's migration targets PostgreSQL (jsonb, partial and expression
# indexes), so the suite provisions the equivalent H2 schema instead.
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
