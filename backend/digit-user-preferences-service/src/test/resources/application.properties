# Test configuration — H2 in-memory, no PostgreSQL required.
server.port=8080
user.preference.context-path=/user-preference

spring.datasource.url=jdbc:h2:mem:userpreferencedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway's migration targets PostgreSQL (jsonb, partial and expression
# indexes), so the suite provisions the equivalent H2 schema instead.
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

spring.jackson.mapper.accept-case-insensitive-properties=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false

management.endpoints.web.exposure.include=health,info

user.preference.search.default-offset=0
user.preference.search.default-limit=10
user.preference.search.max-limit=100

app.timezone=UTC
