# Public browser surface only. Include inside the DIGIT server block.
# Keycloak serves from its root; KC_HOSTNAME carries the public /auth prefix.
# Only realm protocol endpoints and login theme resources are exposed: the
# admin console and /internal/identity/v1/* control plane stay private.
location /auth/realms/ {
  proxy_pass http://127.0.0.1:18180/realms/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_buffer_size 64k;
  proxy_buffers 8 64k;
}

location /auth/resources/ {
  proxy_pass http://127.0.0.1:18180/resources/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /identity/ {
  proxy_pass http://127.0.0.1:18400;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_read_timeout 120s;
}
