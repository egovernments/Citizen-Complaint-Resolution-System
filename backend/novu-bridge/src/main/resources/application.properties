server.servlet.context-path=/novu-bridge
server.port=8290
app.timezone=UTC

# Kafka
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=novu-bridge
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Inbound topics. The eventType (never the topic) decides handling; complaints.domain.events
# is the original PGR topic, notifications.events the module-neutral one.
novu.bridge.kafka.input.topics=${NOVU_BRIDGE_KAFKA_INPUT_TOPICS:complaints.domain.events,notifications.events}
novu.bridge.kafka.dlq.topic=${NOVU_BRIDGE_KAFKA_DLQ_TOPIC:novu-bridge.dlq}
# Producer eventTypes the bridge accepts; anything else is REJECTED/NB_UNSUPPORTED_EVENT_TYPE.
novu.bridge.event.types=${NOVU_BRIDGE_EVENT_TYPES:COMPLAINTS_WORKFLOW_TRANSITIONED,CORE_SMS}
# DIGIT core SMS topic (login OTPs, password resets), translated by CoreSmsTranslator.
# These (PROMOTION aside) bypass the consent gate below: the recipient just asked for them. Only
# SMS read off this topic do; an envelope elsewhere that says CORE_SMS is consent-checked.
novu.bridge.core.sms.enabled=${NOVU_BRIDGE_CORE_SMS_ENABLED:true}
novu.bridge.kafka.core.sms.topic=${NOVU_BRIDGE_CORE_SMS_TOPIC:egov.core.notification.sms}
novu.bridge.core.sms.default.tenant=${NOVU_BRIDGE_CORE_SMS_DEFAULT_TENANT:}
novu.bridge.core.sms.country.code=${NOVU_BRIDGE_CORE_SMS_COUNTRY_CODE:}
novu.bridge.default.locale=${NOVU_BRIDGE_DEFAULT_LOCALE:en_IN}

# External dependencies
novu.bridge.preference.enabled=${NOVU_BRIDGE_PREFERENCE_ENABLED:true}
novu.bridge.preference.host=${NOVU_BRIDGE_PREFERENCE_HOST:http://digit-user-preferences-service.egov:8080/user-preference}
novu.bridge.preference.check.path=${NOVU_BRIDGE_PREFERENCE_CHECK_PATH:/v1/_search}
# Outage policy for the consent check: true = allow when the service is down/erroring.
novu.bridge.preference.fail.open=${NOVU_BRIDGE_PREFERENCE_FAIL_OPEN:true}
novu.bridge.preference.code=${NOVU_BRIDGE_PREFERENCE_CODE:USER_NOTIFICATION_PREFERENCES}

novu.bridge.user.host=${NOVU_BRIDGE_USER_HOST:http://egov-user.egov:8080}
novu.bridge.user.search.path=${NOVU_BRIDGE_USER_SEARCH_PATH:/user/_search}

# Per-tenant channel policy (MDMS, state tenant); legacy namespace and then channels.enabled are
# per-tenant fallbacks. LEAVE THE SCHEMA UNSET in deployments so a dropped overlay cannot flip it.
novu.bridge.channel.policy.enabled=${NOVU_BRIDGE_CHANNEL_POLICY_ENABLED:true}
novu.bridge.channel.policy.schema=${NOVU_BRIDGE_CHANNEL_POLICY_SCHEMA:NOTIFICATIONS.Channel}
novu.bridge.channel.policy.legacy.schema=${NOVU_BRIDGE_CHANNEL_POLICY_LEGACY_SCHEMA:RAINMAKER-PGR.NotificationChannel}
novu.bridge.channel.policy.cache.ttl.ms=${NOVU_BRIDGE_CHANNEL_POLICY_CACHE_TTL_MS:60000}
# Freshness of the "does the pinned provider exist and is it active" check; only bounds edits made in Novu directly.
novu.bridge.provider.availability.cache.ttl.ms=${NOVU_BRIDGE_PROVIDER_AVAILABILITY_CACHE_TTL_MS:60000}
novu.bridge.mdms.host=${NOVU_BRIDGE_MDMS_HOST:http://egov-mdms-service:8094}
novu.bridge.mdms.search.path=${NOVU_BRIDGE_MDMS_SEARCH_PATH:/mdms-v2/v2/_search}

# Configurator endpoints: DIGIT token introspected at egov-user, EMPLOYEE + an allowed role.
novu.bridge.proxy.auth.enabled=${NOVU_BRIDGE_PROXY_AUTH_ENABLED:true}
novu.bridge.user.details.path=${NOVU_BRIDGE_USER_DETAILS_PATH:/user/_details}
novu.bridge.proxy.allowed.roles=${NOVU_BRIDGE_PROXY_ALLOWED_ROLES:EMPLOYEE,SUPERUSER,GRO,PGR_LME,MDMS_ADMIN}
# Creating, rotating or deleting a provider (and dispatch/_resolve) also needs one of these.
novu.bridge.proxy.admin.roles=${NOVU_BRIDGE_PROXY_ADMIN_ROLES:SUPERUSER,MDMS_ADMIN,ACCOUNT_ADMIN}

# Per-channel Novu workflow ids; the rendered body travels in payload.body.
novu.bridge.workflow.id.sms=${NOVU_BRIDGE_WORKFLOW_ID_SMS:complaints-sms}
novu.bridge.workflow.id.whatsapp=${NOVU_BRIDGE_WORKFLOW_ID_WHATSAPP:complaints-whatsapp}
novu.bridge.workflow.id.email=${NOVU_BRIDGE_WORKFLOW_ID_EMAIL:complaints-email}
# WhatsApp rides Novu's sms channel; without this, WHATSAPP resolves to the PRIMARY (plain SMS) integration.
novu.bridge.integration.id.whatsapp=${NOVU_BRIDGE_INTEGRATION_ID_WHATSAPP:}

# Blank = SMS through Novu; "smscountry" = straight to SMSCountry's legacy bulk API.
novu.bridge.sms.provider=${NOVU_BRIDGE_SMS_PROVIDER:}
novu.bridge.sms.sender.id=${NOVU_BRIDGE_SMS_SENDER_ID:}

# SMSCountry panel login (that account type issues no API key).
novu.bridge.smscountry.url=${NOVU_BRIDGE_SMSCOUNTRY_URL:http://api.smscountry.com/SMSCwebservice_bulk.aspx}
novu.bridge.smscountry.user=${NOVU_BRIDGE_SMSCOUNTRY_USER:}
novu.bridge.smscountry.password=${NOVU_BRIDGE_SMSCOUNTRY_PASSWORD:}
# Hosts the adapter may post credentials to when a caller passes ?apiUrl= (the smscountry.url
# host is always allowed). Anything else falls back to smscountry.url: the adapter is not a proxy.
novu.bridge.smscountry.allowed.hosts=${NOVU_BRIDGE_SMSCOUNTRY_ALLOWED_HOSTS:api.smscountry.com,www.smscountry.com}
# The adapter URL stored as the Novu integration's baseUrl: must be reachable from the Novu WORKER.
novu.bridge.smscountry.adapter.url=${NOVU_BRIDGE_SMSCOUNTRY_ADAPTER_URL:http://novu-bridge:8080/novu-bridge/novu-adapter/v1/gateways/smscountry/send}
novu.bridge.identify.cache.ttl.ms=${NOVU_BRIDGE_IDENTIFY_CACHE_TTL_MS:300000}
# FALLBACK for tenants with no channel rows. No default: name the channels you onboarded a provider for.
novu.bridge.channels.enabled=${NOVU_BRIDGE_CHANNELS_ENABLED:}

novu.base.url=${NOVU_BASE_URL:http://novu-api.novu:3000}
novu.api.key=${NOVU_API_KEY:test-api-key-123}

# Every outbound call runs on the Kafka listener thread: fail fast rather than stall the group.
novu.bridge.http.connect.timeout.ms=${NOVU_BRIDGE_HTTP_CONNECT_TIMEOUT_MS:5000}
novu.bridge.http.read.timeout.ms=${NOVU_BRIDGE_HTTP_READ_TIMEOUT_MS:10000}

# DB - Local PostgreSQL setup
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres4
spring.datasource.username=postgres
spring.datasource.password=1234

spring.flyway.url=jdbc:postgresql://localhost:5432/postgres4
spring.flyway.user=postgres
spring.flyway.password=1234
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=true

# Delivery receipts (Novu webhook / gateway DR callbacks). Blank = endpoint disabled (403).
novu.bridge.receipts.secret=${NOVU_BRIDGE_RECEIPTS_SECRET:}
novu.bridge.dispatch.log.enabled=${NOVU_BRIDGE_DISPATCH_LOG_ENABLED:true}

management.endpoints.web.base-path=/

# Keep the floor at INFO: DEBUG lines can print recipient PII.
logging.level.org.egov.novubridge=${NOVU_BRIDGE_LOG_LEVEL:INFO}
logging.level.org.egov.novubridge.service.DispatchPipelineService=${NOVU_BRIDGE_LOG_LEVEL:INFO}
# Where a partition with no committed offset starts. earliest for the domain-event topics: a
# producer can publish before this group's first commit, and those events must not be lost.
# The core SMS listener overrides it to latest (CoreSmsConsumer): replaying days of old OTPs is worse.
spring.kafka.consumer.auto-offset-reset=earliest

# ---- Resolution stage (thin events) ----
# Config masters' MDMS namespace; a tenant without rows here is served its legacy rows.
novu.bridge.notifications.namespace=${NOVU_BRIDGE_NOTIFICATIONS_NAMESPACE:NOTIFICATIONS}
novu.bridge.notifications.cache.ttl.ms=${NOVU_BRIDGE_NOTIFICATIONS_CACHE_TTL_MS:60000}
# page.size x max.pages = most rows one master can have before the read truncates (with a WARN).
novu.bridge.notifications.page.size=${NOVU_BRIDGE_NOTIFICATIONS_PAGE_SIZE:200}
novu.bridge.notifications.max.pages=${NOVU_BRIDGE_NOTIFICATIONS_MAX_PAGES:50}
# One event's fan-out ceiling. Over it nothing is delivered: half a fan-out is worse than none.
novu.bridge.notifications.recipient.cap=${NOVU_BRIDGE_NOTIFICATIONS_RECIPIENT_CAP:1000}

# page.size x max.pages = most holders one role can notify.
novu.bridge.role.pool.page.size=${NOVU_BRIDGE_ROLE_POOL_PAGE_SIZE:100}
novu.bridge.role.pool.max.pages=${NOVU_BRIDGE_ROLE_POOL_MAX_PAGES:10}
novu.bridge.internal.user.uuid=${NOVU_BRIDGE_INTERNAL_USER_UUID:}

# On an outage the producer's literal stays in place: an all-blank template is what providers reject.
novu.bridge.localization.host=${NOVU_BRIDGE_LOCALIZATION_HOST:http://egov-localization-service:8080}
novu.bridge.localization.search.path=${NOVU_BRIDGE_LOCALIZATION_SEARCH_PATH:/localization/messages/v1/_search}
novu.bridge.localization.cache.ttl.ms=${NOVU_BRIDGE_LOCALIZATION_CACHE_TTL_MS:300000}
novu.bridge.localization.modules=${NOVU_BRIDGE_LOCALIZATION_MODULES:rainmaker-pgr,rainmaker-common}
