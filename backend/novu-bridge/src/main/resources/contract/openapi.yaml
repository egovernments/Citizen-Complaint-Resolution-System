openapi: 3.0.3
info:
  title: novu-bridge — notification delivery adapter
  version: "1"
  description: |
    Every HTTP endpoint novu-bridge exposes, as implemented. Written from the controllers in
    `backend/novu-bridge/src/main/java/org/egov/novubridge/web/controllers/`. Add or change a
    path here in the same change that adds or changes its controller mapping.

    The bridge's PRIMARY interface is not HTTP at all — it is the pair of Kafka messages
    described by `envelope-v1.schema.json` (a finished message) and `thin-event-v1.schema.json`
    (a domain event the box resolves), told apart by the `kind` discriminator. These endpoints
    are the management and observability surface the Configurator drives, plus machine
    callbacks.

    ## Tiers

    | Tier | Endpoints | Who may call |
    |---|---|---|
    | Operator (read) | `/config/source`, `/logs`, `/integrations`, `/preferences`, `/providers/catalog`, `/providers/templates`, `/providers/twilio-templates`, `/providers/verify`, `POST /dispatch/_validate` | DIGIT bearer token, `type == EMPLOYEE`, a role from `novu.bridge.proxy.allowed.roles` (or from the admin list, which is a superset by intent). `/logs` and `/config/source` answer only for the caller's own tenants: see below |
    | Admin, providers (credentials, sends) | `POST /providers`, `POST /providers/_update`, `POST /providers/_delete`, `POST /providers/test-send` | the above **and** a role from `novu.bridge.proxy.admin.roles` held at a STATE tenant (`ke`, not `ke.bomet`); otherwise `403 NB_ADMIN_ROLE_REQUIRED`. That state must own the deployment's providers: the core-SMS default tenant's state (`NOVU_BRIDGE_CORE_SMS_DEFAULT_TENANT`, which the deploy sets to its state root) or one listed in `NOVU_BRIDGE_PROVIDER_ADMIN_TENANTS`; otherwise `403 NB_TENANT_NOT_ALLOWED` |
    | Admin, one tenant's events | `POST /dispatch/_resolve`, `POST /dispatch/_dry-run` | the above **and** a role from `novu.bridge.proxy.admin.roles` held at a STATE tenant (else `403 NB_ADMIN_ROLE_REQUIRED`), at the state root of the event's `tenantId` or at a state that owns the providers; otherwise `403 NB_TENANT_NOT_ALLOWED`. `_dry-run` with `send: true` is a real send through the shared providers and, like test-send, needs a state that owns them |
    | Workspace admin, its OWN account (#2203) | the provider calls above with `?tenantId=<workspace>`, when that workspace has its own Novu organization | the broad gate **and** a role from `novu.bridge.proxy.admin.roles` held at THAT workspace's root tenant. No `NOVU_BRIDGE_PROVIDER_ADMIN_TENANTS` listing is needed, and nobody else may act on it, an owning state's admin included (`403 NB_TENANT_NOT_ALLOWED`). Reads with the selector need the workspace among the caller's tenants |
    | Machine callback | `/receipts/{provider}` | shared secret `novu.bridge.receipts.secret`, header `X-Receipt-Secret` or query `secret`. `403` while the secret is blank |
    | Internal: tenant account admin (#2203) | `/tenants/**` | header `X-Novu-Bridge-Token` = `novu.bridge.internal.admin.token` (pgr-services onboarding, operators). Never a DIGIT token. Not routed by Kong (it answers 404). `403 NB_INTERNAL_API_DISABLED` while the token is blank |
    | Internal: send (#2203) | `POST /messages/_send`, and `GET /tenants/{tenantId}` | header `X-Novu-Bridge-Token` = `novu.bridge.internal.send.token` (the Identity BFF). Not routed by Kong. `403 NB_INTERNAL_API_DISABLED` while the token is blank |
    | Unauthenticated | `/contract/envelope`, `/contract/thin-event`, `/contract/openapi` | anyone who can reach the service |

    **Tenant scope.** egov-user returns every role with its own `tenantId`. The caller's
    tenants are its own `tenantId` plus every tenant at which it holds an allowed or admin
    role; a STATE tenant among them also covers that state's cities. `/logs` and
    `/config/source` answer `403 NB_TENANT_NOT_ALLOWED` for any other `tenantId`. For the
    provider calls, admin roles count only at a state tenant that owns the providers, because
    provider integrations are deployment-wide: neither a city admin nor the admin of another
    root on the same box (an onboarded workspace) may rotate or delete the provider the owning
    state's OTPs go through. `_resolve` and `_dry-run` (without `send: true`) are about one
    tenant's events, so the admin of each root runs them for its own tenants, as
    `migrate-notifications.py` does when it previews a root.

    `ProxyAuthFilter` is registered on `/novu-adapter/v1/*` but gates only the namespaces
    `config`, `logs`, `integrations`, `preferences`, `providers` and `dispatch`. `InternalAuthFilter`
    gates `tenants` and `messages` with the internal tokens. Anything else — the contract
    documents, the machine callbacks, the actuator endpoints — passes through unauthenticated by
    design.

    ## Per-tenant Novu accounts (#2203)

    With `novu.bridge.tenant.accounts.enabled`, a ROOT tenant can have its own Novu
    organization: created by the bridge with the Novu platform admin's login (per-tenant Novu
    *environments* are a paid feature, `402` on self-hosted), its API key stored encrypted. Every
    message of a tenant whose root has one (complaint notifications, core SMS, test-send,
    `_dry-run` sends, `messages/_send`) goes through it; every other tenant through the shared
    account exactly as before. The Configurator's provider calls act on a workspace's own
    organization when they carry `?tenantId=<workspace>` and that workspace has one.

    ## Auth, honestly

    The operator endpoints take an `Authorization: Bearer <DIGIT access token>` HEADER, not a
    `RequestInfo.authToken` in the body. The bridge introspects that token itself against
    egov-user `POST /user/_details` (60 s cache, keyed by the token's SHA-256, never the raw
    token). Through Kong these paths are in the auth-optional whitelist for exactly that
    reason: the gateway's body-token enrichment cannot authenticate a Bearer-only request, so
    the bridge is the real auth boundary.

    ## Error envelope

    Most failures are thrown as DIGIT `CustomException`s and rendered by the shared tracer
    error handler as `{"ResponseInfo": …, "Errors": [{"code": "NB_…", "message": …}]}`.
    `ProxyAuthFilter` writes its own bodies — see each response schema below. Every `NB_*` code is catalogued in `error-codes.md`.

servers:
  - url: https://<gateway-host>
    description: Through Kong. Paths are context-prefixed (`/novu-bridge/...`) and `strip_path` is false.
  - url: http://novu-bridge:8080
    description: In-cluster, direct. Same context prefix.

tags:
  - name: contract
    description: The published interface, served by the service that implements it.
  - name: logs
    description: The delivery ledger.
  - name: providers
    description: Provider management — the Configurator's Providers screen.
  - name: preferences
    description: Per-user consent, read-only.
  - name: dispatch
    description: Diagnostics. Not routed publicly.
  - name: receipts
    description: Provider delivery reports.
  - name: tenant-accounts
    description: Internal. Per-tenant Novu organizations (#2203). Never routed by Kong.
  - name: messages
    description: Internal. Synchronous sends through the tenant's own account (#2203). Never routed by Kong.

security:
  - digitBearer: []

paths:

  /novu-bridge/novu-adapter/v1/contract/envelope:
    get:
      tags: [contract]
      summary: JSON Schema of the inbound Kafka envelope (version 1)
      description: |
        The byte-identical copy packaged in this build's jar, so what you fetch is what this
        build enforces. Unauthenticated: a description of an interface, not of a deployment.
      security: []
      responses:
        "200":
          description: JSON Schema 2020-12 document
          content:
            application/json:
              schema:
                type: object
        "404":
          description: The jar was built without `contract/envelope-v1.schema.json`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /novu-bridge/novu-adapter/v1/contract/thin-event:
    get:
      tags: [contract]
      summary: JSON Schema of the inbound thin domain event (version 1)
      description: |
        The second inbound kind: a producer says only what happened to which entity, and the
        box decides who to tell, on which channel, in which language and what the words are.
        Told apart from the envelope by the `kind` discriminator (`THIN`); see `README.md`.

        The byte-identical copy packaged in this build's jar. Unauthenticated, for the same
        reason as the other two: a description of an interface, not of a deployment.
      security: []
      responses:
        "200":
          description: JSON Schema 2020-12 document
          content:
            application/json:
              schema:
                type: object
        "404":
          description: The jar was built without `contract/thin-event-v1.schema.json`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /novu-bridge/novu-adapter/v1/contract/openapi:
    get:
      tags: [contract]
      summary: This document
      security: []
      responses:
        "200":
          description: OpenAPI 3.0 document
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: The jar was built without `contract/openapi.yaml`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /novu-bridge/novu-adapter/v1/logs:
    get:
      tags: [logs]
      summary: List dispatch-log rows for a tenant, newest first
      description: |
        Read-only projection of `nb_dispatch_log`. Recipient PII is masked SERVER-SIDE before
        the response is built — `recipientValue`, the embedded subscriber inside
        `transactionId`, any phone or email quoted in `lastErrorMessage`, and the whole
        `providerResponse` tree. Stored rows are untouched.

        One masking rule, the same for every field: an **id stays an id** (a canonical
        `8-4-4-4-12` hex UUID is never masked, alone or embedded, whatever digits it holds);
        an **email** keeps the first character and the domain (`c***@example.org`); a
        **phone** is every run of 7+ digits outside a UUID, cut to `***` and its last three
        digits (`+254712345678` → `+***678`, `ke:+254712345678` → `ke:+***678`). So a
        recipient addressed by user uuid shows the uuid, and one addressed by phone (no
        account, or a login OTP) shows the masked phone. The Configurator's Logs screen
        applies the same rule again (for older bridges).

        Statuses and their transitions are described in `outputs.md`.
      parameters:
        - { name: tenantId, in: query, required: true, schema: { type: string },
            description: "Required. A blank or missing value answers 400 with an empty body. A state-level tenant (no dot, e.g. `mz`) also returns the rows of its city tenants (`mz.*`); a city tenant matches only itself. Must be one of the caller's tenants (see Tenant scope), else `403 NB_TENANT_NOT_ALLOWED`." }
        - { name: referenceNumber, in: query, schema: { type: string },
            description: "Exact match, or prefix when `referenceNumberPrefix=true`." }
        - { name: referenceNumberPrefix, in: query, schema: { type: boolean, default: false } }
        - { name: transactionId, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string, enum: [SMS, WHATSAPP, EMAIL, NONE] },
            description: "`NONE` selects the channel-less rows — decisions the box took before a channel existed." }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DispatchStatus" } }
        - { name: sourcePath, in: query, schema: { $ref: "#/components/schemas/DispatchSourcePath" },
            description: "Which inbound path produced the row. This is how you answer \"which path is this deployment on\" per message, in production." }
        - { name: includeTest, in: query, schema: { type: boolean, default: false },
            description: "Operator test-sends are hidden unless asked for." }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 },
            description: "Clamped to 1..500 server-side." }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: A page of rows plus the unpaged total for the same filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DispatchLogEntry" }
                  total: { type: integer, format: int64 }
        "400": { description: "`tenantId` missing. Empty body." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /novu-bridge/novu-adapter/v1/integrations:
    get:
      tags: [providers]
      summary: List the configured Novu provider integrations
      description: |
        An ALLOWLIST projection: only `_id`, `providerId`, `channel`, `name`, `identifier`,
        `active`, `primary`, `environmentId` are copied out, plus a derived `type`. No
        `credentials` key in any shape ever leaves this service. There is deliberately no
        endpoint that returns a provider secret or the Novu API key.

        With `?tenantId=<workspace>` and a workspace that has its own Novu organization (#2203),
        that organization's integrations; otherwise the shared account's. `account` says which.
      parameters:
        - $ref: "#/components/parameters/AccountSelector"
      responses:
        "200":
          description: The projected integration list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Integration" }
                  total: { type: integer, format: int64 }
                  account: { $ref: "#/components/schemas/AccountView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Novu answered non-2xx. Empty body — an upstream failure is not an empty list.

  /novu-bridge/novu-adapter/v1/preferences:
    get:
      tags: [preferences]
      summary: List stored per-user notification preferences
      description: |
        Allowlist projection of `userId`, `tenantId` and, lifted out of the record's payload,
        `preferredLanguage` and `consent`. Resolves no phone number, email or other identity.
      parameters:
        - { name: tenantId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 },
            description: "Clamped to 1..500 server-side." }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: The projected preference list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Preference" }
                  total: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /novu-bridge/novu-adapter/v1/providers/catalog:
    get:
      tags: [providers]
      summary: The out-of-the-box provider types and their credential forms
      description: |
        The Configurator renders its Add-provider form straight from this, so a provider gained
        or a field renamed needs no SPA change. Describes what to ASK for; contains no stored
        credential. With `NOVU_BRIDGE_DIGIT_WORKER_PROVIDERS=false` (a Novu worker that does
        not load DIGIT's providers) `smscountry`, `ozeki` and `jasmin` are left out.
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /novu-bridge/novu-adapter/v1/providers/templates:
    get:
      tags: [providers]
      summary: Discover Novu workflows (delivery shells)
      description: |
        Lists `{workflowId, name, channels}` from Novu. Does NOT call any gateway: SMS/EMAIL
        message text lives in MDMS `NotificationTemplate`, approved WhatsApp Content SIDs in
        `NotificationProviderTemplate`.
      parameters:
        - { name: channel, in: query, schema: { type: string, enum: [SMS, WHATSAPP, EMAIL] },
            description: "Filters by Novu step type: SMS/WHATSAPP → `sms` steps, EMAIL → `email`. A workflow that declares no steps is never filtered out." }
        - { name: providerId, in: query, schema: { type: string },
            description: "Accepted and ignored — Novu workflows are channel-scoped, not provider-scoped." }
      responses:
        "200":
          description: Matching workflows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        workflowId: { type: string }
                        name: { type: string }
                        channels: { type: array, items: { type: string } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /novu-bridge/novu-adapter/v1/providers/twilio-templates:
    get:
      tags: [providers]
      summary: Pull the linked Twilio account's approved WhatsApp Content templates
      description: |
        Auto-matches them to routing keys. The Configurator persists the matched rows to MDMS
        `NotificationProviderTemplate`. Never returns credentials.
      responses:
        "200":
          description: Proposed rows plus diagnostics for the ones that did not match
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: array, items: { type: object } }
                  unmatched: { type: array, items: { type: object } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /novu-bridge/novu-adapter/v1/providers:
    post:
      tags: [providers]
      summary: Create a provider integration from operator-entered credentials
      description: |
        **Admin role required** (`novu.bridge.proxy.admin.roles`), because the body carries
        live credentials.

        Two request forms. The CATALOG form `{type, name?, credentials, active?, identifier?}`
        is the one the Configurator uses: the bridge resolves the Novu provider id, the Novu
        channel, the credential mapping and a round-trippable `<type>-<sha256(name)[0:16]>`
        identifier, and validates the type's required credentials BEFORE anything reaches Novu.
        A caller-supplied `identifier` must start with `<type>-`, because rotation reads the
        type back from it; anything else is `400 NB_INVALID_PROVIDER`.
        `active` absent means true. The LEGACY form `{channel, providerId, name, identifier,
        credentials}` remains the escape hatch for a Novu provider the catalog does not cover.
        `smscountry`, `ozeki` and `jasmin` are DIGIT's providers, mounted into the stock Novu
        worker: on a worker without them Novu would create the integration and fail every send
        through it, so with `NOVU_BRIDGE_DIGIT_WORKER_PROVIDERS=false` either form naming one
        answers `400 NB_PROVIDER_TYPE_UNAVAILABLE`.

        Credentials POST straight through to Novu over TLS. They are never persisted here,
        never logged (only key NAMES are) and never echoed back.

        `?tenantId=<workspace>` on a workspace with its own Novu organization (#2203) creates the
        provider THERE, for an admin of that workspace (see Tiers). The same selector applies to
        `_update`, `_delete`, `verify`, `test-send`, `templates` and `twilio-templates`.
      parameters:
        - $ref: "#/components/parameters/AccountSelector"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ProviderCreateFromCatalog"
                - $ref: "#/components/schemas/ProviderCreateLegacy"
      responses:
        "200":
          description: The created integration, allowlist-projected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Integration" }
        "400":
          description: "`NB_UNKNOWN_PROVIDER_TYPE`, `NB_PROVIDER_TYPE_UNAVAILABLE`, `NB_INVALID_PROVIDER`, `NB_INVALID_CHANNEL`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /novu-bridge/novu-adapter/v1/providers/_update:
    post:
      tags: [providers]
      summary: Rename a provider, toggle it, or rotate its credentials
      description: |
        **Admin role required.** The id is in the BODY, not the path: the gateway matches exact
        URLs, so every management call is a POST to a fixed path.

        `credentials` present means ROTATION. Novu REPLACES a credential set wholesale rather
        than merging, so a partial map would silently blank the keys it omits — hence full
        required-field validation first, against the type derived from the integration's own
        identifier. An integration whose type cannot be derived cannot be rotated
        (`NB_UNKNOWN_PROVIDER_TYPE`): re-create it from the catalog.

        `active: false` (disable) is guarded exactly like `_delete`: it needs `tenantId` and is
        refused with 409 while a tenant still sends through the provider.

        Rotating or re-enabling (`active: true`) an SMSCountry, Ozeki or Jasmin integration while
        `NOVU_BRIDGE_DIGIT_WORKER_PROVIDERS=false` is `400 NB_PROVIDER_TYPE_UNAVAILABLE`; a
        rename, a disable and a delete still work, so they can be cleaned up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: "Novu `_id` or `identifier`." }
                name: { type: string }
                active: { type: boolean }
                tenantId: { type: string, description: "Required with `active: false`: the caller's state tenant. See `_delete`." }
                credentials:
                  type: object
                  additionalProperties: true
                  description: "Complete credential set for the type. Partial maps blank the rest."
      responses:
        "200":
          description: The updated integration, allowlist-projected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Integration" }
        "400":
          description: "`NB_INVALID_PROVIDER` (no id, an empty change set, or `active: false` without `tenantId`), `NB_UNKNOWN_PROVIDER_TYPE`, `NB_PROVIDER_TYPE_UNAVAILABLE`, `NB_PROVIDER_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`NB_ADMIN_ROLE_REQUIRED` / `NB_TENANT_NOT_ALLOWED` (see AdminForbidden), or `NB_TENANT_NOT_ALLOWED` when disabling for a `tenantId` whose state the caller holds no admin role at"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NB_PROVIDER_IN_USE` on `active: false` — as for `_delete`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /novu-bridge/novu-adapter/v1/providers/_delete:
    post:
      tags: [providers]
      summary: Delete a provider and the credentials Novu holds for it
      description: |
        **Admin role required.** Refuses with 409 while a tenant is still routing through the
        provider: Novu would delete it happily and every notification on that channel would
        start failing with no active integration.

        The check fails CLOSED. It reads the channel rows (`NOTIFICATIONS.Channel`, else the
        legacy `RAINMAKER-PGR.NotificationChannel`, as dispatch does) from MDMS at the time of
        the call, never from a cache, for: the state of `tenantId`, every state the caller holds
        an admin role at, every state this instance has dispatched for since it started, and the
        states that own the providers (the core-SMS default tenant's and
        `NOVU_BRIDGE_PROVIDER_ADMIN_TENANTS`). It refuses when:

        - a row selects the provider by `identifier` OR Novu `_id` (case-insensitive);
        - it is the integration `NOVU_BRIDGE_INTEGRATION_ID_WHATSAPP` names (by identifier or
          `_id`) and an enabled WhatsApp channel selects no provider: every such trigger names it;
        - the provider is the LAST active integration of its DIGIT channel (SMS, WhatsApp or
          Email, from its catalog type; Novu stores Twilio WhatsApp on its `sms` channel, but a
          WhatsApp integration does not stand in for SMS, nor SMS for WhatsApp) and a channel
          with that code sends through Novu's default because nothing pins it: an enabled row
          with no `provider` (every legacy row), a state with no rows on
          `NOVU_BRIDGE_CHANNELS_ENABLED`, or every tenant when the channel policy is off. An SMS
          channel on the direct SMSCountry route does not count, and neither does WhatsApp while
          `NOVU_BRIDGE_INTEGRATION_ID_WHATSAPP` is set (the rule above covers it);
        - a state's rows cannot be read.

        The Novu integration list is read first; when it cannot be, the call fails
        (`NB_NOVU_INTEGRATIONS_FAILED`) and nothing is deleted. Integrations are deployment-wide,
        so a state that is none of those is not checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, tenantId]
              properties:
                id: { type: string, description: "Novu `_id` or `identifier`." }
                tenantId: { type: string, description: "Required: the caller's state tenant (a city resolves to its state). The caller must hold an admin role at that state." }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      deleted: { type: boolean }
        "400":
          description: "`NB_INVALID_PROVIDER` (no `id` or no `tenantId`), `NB_PROVIDER_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`NB_ADMIN_ROLE_REQUIRED` / `NB_TENANT_NOT_ALLOWED` (see AdminForbidden), or `NB_TENANT_NOT_ALLOWED` when the caller holds no admin role at the state of `tenantId`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`NB_PROVIDER_IN_USE` — a channel row still selects it, it is the last active integration behind an unpinned enabled channel, or a state's channel rows could not be read (nothing was deleted)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /novu-bridge/novu-adapter/v1/providers/verify:
    post:
      tags: [providers]
      summary: Check that a configured integration exists and is active
      description: |
        Matches by `integrationId` (Novu `_id` or `identifier`; `id` is an accepted alias), or
        by catalog `type`, or by `channel` + `providerId`. This confirms CONFIGURATION, not
        reachability, and never whether the credentials are right — nothing is sent. The
        Configurator labels it "Check status". Every catalog type advertises
        `supportsVerify: true`; a test send is the only credential proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId: { type: string }
                id: { type: string, description: "Alias of `integrationId`." }
                type: { type: string, description: "Catalog type, e.g. `smtp`." }
                channel: { type: string, enum: [SMS, WHATSAPP, EMAIL] }
                providerId: { type: string, description: "Novu provider id, e.g. `twilio`." }
      responses:
        "200":
          description: Always 200 — `ok:false` is a verdict, not a transport failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  active: { type: boolean }
                  detail: { type: string }
        "400":
          description: "`NB_INVALID_CHANNEL`, `NB_UNKNOWN_PROVIDER_TYPE`, `NB_PROVIDER_TYPE_UNAVAILABLE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /novu-bridge/novu-adapter/v1/providers/test-send:
    post:
      tags: [providers]
      summary: Send one live test message
      description: |
        **Admin role required.** A REAL send, of the caller's text to the caller's recipient,
        through the government sender. Down the same provider seam the live pipeline uses. Writes exactly one
        `nb_dispatch_log` row flagged `isTest` at `tenantId` (the operator's own tenant; the
        synthetic `TEST` tenant is only the fallback for callers that omit it), with
        `eventName`/`templateKey` = `TEST` and a masked recipient — auditable, visible on the
        Logs screen on request, never counted as real traffic.

        The derived `subscriberId` is `nb-test-<sha256(seed)[0:16]>` with no clock and no
        random, so repeating a test is idempotent.

        **Refused when nothing could deliver it** (`409 NB_PROVIDER_UNAVAILABLE`, the reason in
        `Errors[0].message`; nothing is sent and no row is written). Before triggering, the test
        runs dispatch's availability check, on a fresh read of Novu's integrations: a named
        integration must be active, on Novu's channel for `channel`, and not an SMSCountry,
        Ozeki or Jasmin one while `NOVU_BRIDGE_DIGIT_WORKER_PROVIDERS=false`; with none named, a
        channel that goes through Novu needs an active integration that delivers it (and, under
        that flag, a default that is not one of those three). Novu accepts a trigger nothing can
        deliver and fails it inside, so without the check the answer was `ok: true` for a message
        that never left. A channel on the legacy direct SMSCountry gateway is not checked against
        Novu. When Novu's integration list cannot be read the test is sent anyway, as dispatch
        does, and the 200 carries `warning`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: { type: string, enum: [SMS, WHATSAPP, EMAIL] }
                type: { type: string, description: "Catalog type; fills in `channel` when omitted." }
                integrationId: { type: string, description: "Pin the test to one integration (`_id` or `identifier`)." }
                id: { type: string, description: "Alias of `integrationId`." }
                tenantId: { type: string, description: "Whose Logs screen the row lands on. Defaults to `TEST`." }
                to:
                  type: object
                  properties:
                    phone: { type: string, description: "E.164." }
                    email: { type: string }
                body: { type: string }
                subject: { type: string, description: "EMAIL only." }
                workflowId: { type: string, description: "Override the per-channel default workflow." }
                contentSid: { type: string, description: "WHATSAPP provider template id." }
                variables: { type: array, items: {}, description: "Turned into 1-based positional contentVariables." }
                transactionId: { type: string, description: "Seeds the stable subscriberId; supply it to repeat a test exactly." }
      responses:
        "200":
          description: The send was attempted — a rejected send reports `ok:false` with the provider's code
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  novuStatus: { type: integer }
                  transactionId: { type: string }
                  errorCode: { type: string, description: "Only when `ok` is false." }
                  errorMessage: { type: string, description: "Only when `ok` is false." }
                  warning: { type: string, description: "Only when the availability check could not run (Novu's integration list unreadable): the test was sent unchecked." }
        "400":
          description: "`NB_INVALID_CHANNEL`, `NB_UNKNOWN_PROVIDER_TYPE`, `NB_PROVIDER_TYPE_UNAVAILABLE` (the type or the named integration is SMSCountry, Ozeki or Jasmin on a worker without DIGIT's providers), `NB_PROVIDER_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409":
          description: "`NB_PROVIDER_UNAVAILABLE` — nothing could deliver the test: the named integration is disabled or on another channel, or (none named) Novu has no active integration that delivers the channel, or its default is a DIGIT worker provider the worker does not load. Nothing was sent; the message says what to fix"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /novu-bridge/novu-adapter/v1/config/source:
    get:
      tags: [config]
      summary: Which namespace is serving this tenant's notification config
      description: |
        Reports, per master, whether the tenant is being served from the new `NOTIFICATIONS.*`
        MDMS masters or from the legacy `RAINMAKER-PGR.Notification*` ones, together with the
        schema code actually read and how many rows it found.

        **This exists because there is no setting to read.** The choice is made by the data — a
        tenant with zero rows in the new namespace is served the old one, per tenant and
        all-or-nothing — precisely so that no compose overlay can flip it. The cost is that two
        tenants on the same build can legitimately differ, and this is how an operator sees which.

        `stale: true` on a master means its rows came from a cache entry past its TTL because
        MDMS could not be reached: the config is being served, and it is not fresh.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: string }
          description: One of the caller's tenants (see Tenant scope), else `403 NB_TENANT_NOT_ALLOWED`; the masters themselves are read at its state root.
      responses:
        "200":
          description: The per-master report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSourceReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /novu-bridge/novu-adapter/v1/dispatch/_resolve:
    post:
      tags: [dispatch]
      summary: Resolve a thin domain event WITHOUT sending or writing a row
      description: |
        Takes a thin domain event and returns the v1 envelopes the box WOULD mint for it: one per
        recipient x channel, in emission order, fully rendered, with the contact block filled in.
        Nothing is dispatched and **no ledger row is written**, which is what makes it safe to
        point at a production tenant.

        It runs the real resolver against the tenant's real config — the same routing rows,
        templates, role pools and locale preferences — so it answers "why would this event send
        nothing?" before the event happens rather than forensically afterwards. `terminalCode`
        carries the channel-less decision when there would be none (`NB_NO_ROUTING`,
        `NB_NO_RECIPIENTS`, `NB_UNKNOWN_AUDIENCE_SCHEME`, `NB_RECIPIENT_LIMIT_EXCEEDED`) and
        `diagnostics` lists every decision taken on the way, including per-recipient skips.

        **Admin of the event's state.** It expands role pools and returns recipient PII for every
        holder of a role, which is broader than the Logs screen's read tier should hand out. The
        caller needs an admin role at the state root of `event.tenantId` (or at a state that owns
        the providers); otherwise `403 NB_TENANT_NOT_ALLOWED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThinEventResolveRequest" }
      responses:
        "200":
          description: The envelopes the event would produce
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThinEventResolveResponse" }
        "400":
          description: "`NB_EVENT_NOT_IN_CATALOGUE` — the event name has no active catalogue row for this tenant."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /novu-bridge/novu-adapter/v1/dispatch/_validate:
    post:
      tags: [dispatch]
      summary: Run one envelope through the pipeline WITHOUT sending
      description: |
        Diagnostic. Validates the envelope, derives the context and persists a `RECEIVED` row.
        Nothing is handed to a provider.

        **Not routed publicly by Kong.** Reachable in-cluster; inside the service it is gated
        by `ProxyAuthFilter` like the other `/dispatch` paths.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchDryRunRequest" }
      responses:
        "200":
          description: The pipeline's verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchDryRunResponse" }
        "400":
          description: "Envelope rejection — `NB_INVALID_EVENT`, `NB_UNSUPPORTED_SCHEMA_VERSION`, `NB_UNSUPPORTED_EVENT_TYPE`. A `REJECTED` row is written before the error is returned."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /novu-bridge/novu-adapter/v1/dispatch/_dry-run:
    post:
      tags: [dispatch]
      summary: "Same as _validate, but `send: true` actually delivers"
      description: |
        Diagnostic. With `send` absent or false this behaves exactly like `_validate`. With
        `send: true` the envelope goes down the full live path, gates and all, and a real
        message is delivered. **Admin role required**, whatever `send` says: the flag is in the
        body, and without it this is `_validate`. The role must be held at the state root of
        `event.tenantId` or at a state that owns the providers; `send: true` needs the latter,
        like test-send, because it sends the caller's text through the deployment-wide
        providers. Otherwise `403 NB_TENANT_NOT_ALLOWED`. **Not routed publicly by Kong.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchDryRunRequest" }
      responses:
        "200":
          description: The pipeline's verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchDryRunResponse" }
        "400":
          description: "Envelope rejection. A `REJECTED` row is written before the error is returned."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /novu-bridge/novu-adapter/v1/receipts/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [novu, smscountry] }
        description: |
          Which provider's report shape this is. The parser is tolerant — it looks for a
          correlation id and an outcome word anywhere in the payload — so an unlisted value is
          accepted and parsed on the same rules; only these two are routed by the gateway.
    post:
      tags: [receipts]
      summary: Accept a delivery report and move the matching row past SENT
      description: |
        Authenticated by the shared secret `novu.bridge.receipts.secret`, presented as header
        `X-Receipt-Secret` or query `secret`. Blank secret = the endpoint is OFF (403). Outside
        `ProxyAuthFilter`: the caller is a machine, not an operator.

        Only `SENT` rows move, so a late or duplicate report cannot regress a row. Non-terminal
        words (queued, sent, accepted, read) are acknowledged and ignored. Always 200 once
        authenticated — `matched: 0` says the report addressed nothing.

        The per-provider payload shapes are in `outputs.md`.
      security:
        - receiptSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "401":
          description: Wrong or missing secret
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string } }
        "403":
          description: "`novu.bridge.receipts.secret` is blank — receipts are disabled"
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string } }
    get:
      tags: [receipts]
      summary: Same, for gateways whose delivery-report pings are GETs
      description: |
        Identical semantics; the report travels as query parameters instead of a body (`secret`
        is stripped before parsing). SMSCountry's bulk API reports this way.
      security:
        - receiptSecret: []
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "401":
          description: Wrong or missing secret
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string } }
        "403":
          description: Receipts are disabled
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string } }

  # ─────────────────────────── Per-tenant Novu accounts (#2203). INTERNAL. ───────────────────────────

  /novu-bridge/novu-adapter/v1/tenants/{tenantId}/_provision:
    post:
      tags: [tenant-accounts]
      summary: Give a root tenant its own Novu organization (idempotent)
      security: [{ internalAdminToken: [] }]
      description: |
        Creates the tenant's Novu organization (or adopts the one Novu already has under its
        name, after a crash), reads its environment's API key, stores it encrypted, and creates
        every workflow the bridge triggers, OTP included. Calling it again for a provisioned
        tenant changes nothing and returns the current state; a tenant never gets a second
        organization. A sub-tenant id (`acme.city`) provisions its root (`acme`).
        pgr-services calls it as the last, non-fatal step of tenant creation.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: The tenant's account state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/TenantAccount"
                      - type: object
                        properties:
                          organizationCreated: { type: boolean, description: "True only when this call created the Novu organization." }
                          workflowsCreated: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/InternalError", description: "`NB_INVALID_TENANT`" }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "403": { $ref: "#/components/responses/InternalDisabled" }
        "409": { $ref: "#/components/responses/InternalError", description: "`NB_PROVISIONING_IN_PROGRESS` (retry shortly), `NB_TENANT_ACCOUNTS_DISABLED`" }
        "502": { $ref: "#/components/responses/InternalError", description: "`NB_NOVU_PLATFORM_LOGIN_FAILED`, `NB_NOVU_PLATFORM_FAILED`, `NB_NOVU_WORKFLOW_CREATE_FAILED`" }
        "503": { $ref: "#/components/responses/InternalError", description: "`NB_NOVU_UNAVAILABLE`, `NB_TENANT_ACCOUNTS_MISCONFIGURED`" }

  /novu-bridge/novu-adapter/v1/tenants/{tenantId}:
    get:
      tags: [tenant-accounts]
      summary: Is the tenant provisioned, and which channels have a working provider
      security: [{ internalAdminToken: [] }, { internalSendToken: [] }]
      description: |
        The capability lookup a sender needs (the SEND token may call it). `channels` is present
        for a provisioned tenant: per channel, whether a usable provider carries it and which one
        a send would be pinned to. Never a key or a credential.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Status (NOT_PROVISIONED for an unknown tenant, never 404)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tenantId: { type: string }
                      tenantAccountsEnabled: { type: boolean }
                      provisioned: { type: boolean }
                      status: { type: string, enum: [NOT_PROVISIONED, PROVISIONING, PROVISIONED, FAILED, DEPROVISIONED] }
                      account: { $ref: "#/components/schemas/TenantAccount" }
                      channels:
                        type: object
                        additionalProperties: { $ref: "#/components/schemas/ChannelReadiness" }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "403": { $ref: "#/components/responses/InternalDisabled" }

  /novu-bridge/novu-adapter/v1/tenants/{tenantId}/_deprovision:
    post:
      tags: [tenant-accounts]
      summary: Remove the tenant's Novu setup
      security: [{ internalAdminToken: [] }]
      description: |
        Self-hosted Novu 2.3.0 cannot delete an organization (its organization API has no
        delete), so: every integration of the organization is deleted (and with it every
        provider credential), the environment's API key is regenerated and the new one is not
        kept, the stored key is erased and the row is marked DEPROVISIONED. The tenant then uses
        the shared account again. A later `_provision` reuses the same organization.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: The tenant's account state, now DEPROVISIONED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TenantAccount" }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "403": { $ref: "#/components/responses/InternalDisabled" }
        "404": { $ref: "#/components/responses/InternalError", description: "`NB_TENANT_NOT_PROVISIONED`: no row" }
        "409": { $ref: "#/components/responses/InternalError", description: "`NB_PROVISIONING_IN_PROGRESS`, `NB_TENANT_ACCOUNTS_DISABLED`" }
        "502": { $ref: "#/components/responses/InternalError", description: "`NB_DEPROVISIONING_FAILED`, `NB_NOVU_PLATFORM_*`" }

  /novu-bridge/novu-adapter/v1/tenants/{tenantId}/providers:
    get:
      tags: [tenant-accounts]
      summary: The tenant's providers (no credentials)
      security: [{ internalAdminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Allowlist-projected integrations of the tenant's own organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Integration" } }
                  total: { type: integer }
        "409": { $ref: "#/components/responses/InternalError", description: "`NB_TENANT_NOT_PROVISIONED`" }
    post:
      tags: [tenant-accounts]
      summary: Add a provider (credentials) to the tenant's own organization
      security: [{ internalAdminToken: [] }]
      description: |
        The catalog form of `POST /providers`, in the tenant's organization: different tenants
        hold different credentials for the same provider type (two Twilio accounts, two Jasmin
        gateways). Validated, never persisted by the bridge, never echoed.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCreateFromCatalog" }
      responses:
        "200":
          description: The created integration, allowlist-projected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/InternalError", description: "`NB_UNKNOWN_PROVIDER_TYPE`, `NB_PROVIDER_TYPE_UNAVAILABLE`, `NB_INVALID_PROVIDER`" }
        "409": { $ref: "#/components/responses/InternalError", description: "`NB_TENANT_NOT_PROVISIONED`" }

  /novu-bridge/novu-adapter/v1/tenants/{tenantId}/providers/_update:
    post:
      tags: [tenant-accounts]
      summary: Rename, rotate (full credential set) or enable/disable one of the tenant's providers
      security: [{ internalAdminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                name: { type: string }
                credentials: { type: object, additionalProperties: true }
                active: { type: boolean }
      responses:
        "200":
          description: The integration, allowlist-projected
        "409": { $ref: "#/components/responses/InternalError", description: "`NB_PROVIDER_IN_USE` (deactivating the provider a channel of this tenant sends through), `NB_TENANT_NOT_PROVISIONED`" }

  /novu-bridge/novu-adapter/v1/tenants/{tenantId}/providers/_delete:
    post:
      tags: [tenant-accounts]
      summary: Delete one of the tenant's providers and its credentials
      security: [{ internalAdminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200":
          description: "`{data: {id, deleted: true}}`"
        "409": { $ref: "#/components/responses/InternalError", description: "`NB_PROVIDER_IN_USE`, `NB_TENANT_NOT_PROVISIONED`" }

  /novu-bridge/novu-adapter/v1/tenants:
    get:
      tags: [tenant-accounts]
      summary: Every tenant account and its state
      security: [{ internalAdminToken: [] }]
      responses:
        "200":
          description: All rows of `nb_tenant_account` (never a key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TenantAccount" } }
                  total: { type: integer }

  /novu-bridge/novu-adapter/v1/tenants/_backfill:
    post:
      tags: [tenant-accounts]
      summary: Provision many tenants (existing ones, or ones created while Novu was down)
      security: [{ internalAdminToken: [] }]
      description: |
        Provisions each tenant in turn (idempotent: provisioned ones are no-ops) and reports
        each outcome; one failure does not stop the rest. At most 500 per call. pgr-services'
        reconciler calls it for workspaces whose provisioning was deferred; operators call it for
        tenants created before #2203 (`local-setup/scripts/novu-tenant-accounts.py backfill`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantIds]
              properties:
                tenantIds: { type: array, maxItems: 500, items: { type: string } }
      responses:
        "200":
          description: One row per tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tenantId: { type: string }
                        status: { type: string, description: "The account status, or ERROR" }
                        organizationCreated: { type: boolean }
                        organizationId: { type: string }
                        code: { type: string, description: "NB_* code when status is ERROR" }
                        message: { type: string }
                  total: { type: integer }
                  failed: { type: integer }

  /novu-bridge/novu-adapter/v1/messages/_send:
    post:
      tags: [messages]
      summary: Send an OTP now, through the tenant's own Novu account
      security: [{ internalSendToken: [] }]
      description: |
        For the Identity BFF's citizen OTP (#2189). Sent immediately (no Kafka) through the
        tenant's OWN Novu organization, never the shared account, pinned to the provider the
        tenant's channel row selects, else its primary active provider for the channel. The text
        is the bridge's OTP workflow: the code and its expiry, nothing else.

        The call then waits up to `novu.bridge.messages.confirm.timeout.ms` (5 s) for Novu's
        job: `200 SENT` when the provider accepted the message, `502 NB_PROVIDER_FAILED` when it
        refused it, `202 QUEUED` when it had not answered yet (the message may still go out).

        **Errors, distinct by design** (the BFF maps the first two to `OTP_CHANNEL_UNAVAILABLE`):

        | Status | Code | Meaning |
        |---|---|---|
        | 409 | `NB_TENANT_NOT_PROVISIONED` | The tenant's root has no Novu account of its own (or the feature is off) |
        | 422 | `NB_NO_PROVIDER_FOR_CHANNEL` | It has one, but no usable provider carries the channel |
        | 502 | `NB_PROVIDER_FAILED` | Novu ran the send and the provider refused it |
        | 502 | `NB_NOVU_TRIGGER_FAILED` | Novu refused the trigger itself |
        | 503 | `NB_NOVU_UNAVAILABLE` | Novu could not be reached |
        | 503 | `NB_TENANT_ACCOUNT_UNAVAILABLE` | The tenant's account could not be read (fails closed, never the shared account) |
        | 400 | `NB_INVALID_REQUEST`, `NB_UNKNOWN_TEMPLATE`, `NB_INVALID_TENANT` | The request is malformed |

        The code is never logged, never written to the ledger and never echoed in an error. Each
        send writes one `nb_dispatch_log` row (module `identity`, event `OTP_SEND`, recipient as
        a hashed subscriber id `otp_<uuid>`, stable per tenant and number), visible on the Logs
        screen. Both ids are UUID-shaped, so the Logs masking leaves them as they are. Rate
        limiting is the caller's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendRequest" }
            example:
              tenantId: acme
              channel: SMS
              recipient: "+254712345678"
              templateKey: OTP
              payload: { code: "482913", expiresInSeconds: 300 }
      responses:
        "200":
          description: The provider accepted the message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SendResponse" }
        "202":
          description: Novu accepted it; the provider had not answered within the confirm timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SendResponse" }
        "400": { $ref: "#/components/responses/InternalError" }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "403": { $ref: "#/components/responses/InternalDisabled" }
        "409": { $ref: "#/components/responses/InternalError", description: "`NB_TENANT_NOT_PROVISIONED`" }
        "422": { $ref: "#/components/responses/InternalError", description: "`NB_NO_PROVIDER_FOR_CHANNEL`" }
        "502": { $ref: "#/components/responses/InternalError", description: "`NB_PROVIDER_FAILED`, `NB_NOVU_TRIGGER_FAILED`" }
        "503": { $ref: "#/components/responses/InternalError", description: "`NB_NOVU_UNAVAILABLE`, `NB_TENANT_ACCOUNT_UNAVAILABLE`" }

components:

  securitySchemes:
    digitBearer:
      type: http
      scheme: bearer
      description: |
        A DIGIT access token, introspected by the bridge against egov-user
        `POST /user/_details`. The caller must be `type == EMPLOYEE` and hold a role from
        `novu.bridge.proxy.allowed.roles`; the admin-tier calls need a role from
        `novu.bridge.proxy.admin.roles` as well, held at a state tenant that owns the providers.
    receiptSecret:
      type: apiKey
      in: header
      name: X-Receipt-Secret
      description: "`novu.bridge.receipts.secret`. May also be sent as the `secret` query parameter."
    internalAdminToken:
      type: apiKey
      in: header
      name: X-Novu-Bridge-Token
      description: "`novu.bridge.internal.admin.token` (NOVU_BRIDGE_INTERNAL_ADMIN_TOKEN). Internal callers only; Kong never routes these paths."
    internalSendToken:
      type: apiKey
      in: header
      name: X-Novu-Bridge-Token
      description: "`novu.bridge.internal.send.token` (NOVU_BRIDGE_INTERNAL_SEND_TOKEN). The Identity BFF."

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: "A root tenant code (`acme`) or a tenant under it (`acme.city`, which means its root): lower-case letters, digits, `-`, `_`."
      schema: { type: string, example: acme }
    AccountSelector:
      name: tenantId
      in: query
      required: false
      description: |
        #2203: the workspace whose notification account to act on. When it has its own Novu
        organization, the call acts there (admins of that workspace only); otherwise, and when
        absent, on the deployment's shared account under the rules in Tiers.
      schema: { type: string, example: acme }

  responses:
    InternalUnauthorized:
      description: "`NB_INTERNAL_TOKEN_REQUIRED` (no `X-Novu-Bridge-Token`) or `NB_INTERNAL_TOKEN_INVALID`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalDisabled:
      description: "`NB_INTERNAL_API_DISABLED`: the token for this API is not configured, so the API is off"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: An `Errors` envelope with the `NB_*` code
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: No bearer token, or the token does not introspect
      content:
        application/json:
          schema:
            type: object
            properties: { error: { type: string } }
    Forbidden:
      description: The caller is not an EMPLOYEE, or holds no allowlisted role
      content:
        application/json:
          schema:
            type: object
            properties: { error: { type: string } }
    AdminForbidden:
      description: |
        `NB_ADMIN_ROLE_REQUIRED` — the caller passed the broad gate but holds no role from
        `novu.bridge.proxy.admin.roles` at a state tenant (one held only at a city does not
        count). `NB_TENANT_NOT_ALLOWED` — it holds one, but not at a state that owns the
        deployment's providers (the core-SMS default tenant's state, or one in
        `NOVU_BRIDGE_PROVIDER_ADMIN_TENANTS`), or neither setting names one; for `_resolve` and
        `_dry-run`, not at the state root of the event's `tenantId` either (and `_dry-run` with
        `send: true` always needs an owning state). The body carries
        BOTH the flat `error` key the read-only paths have always written and the `Errors`
        envelope the controllers use.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, example: NB_ADMIN_ROLE_REQUIRED }
              Errors:
                type: array
                items: { $ref: "#/components/schemas/Error" }
    TenantForbidden:
      description: |
        As Forbidden, or `NB_TENANT_NOT_ALLOWED` — `tenantId` is not one of the caller's tenants
        (see Tenant scope), in the same two-key body as AdminForbidden.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, example: NB_TENANT_NOT_ALLOWED }
              Errors:
                type: array
                items: { $ref: "#/components/schemas/Error" }
    Receipt:
      description: The report as the bridge understood it
      content:
        application/json:
          schema:
            type: object
            properties:
              provider: { type: string }
              providerStatus: { type: string, description: "The provider's own word, verbatim." }
              status:
                type: string
                nullable: true
                enum: [DELIVERED, BOUNCED, FAILED, null]
                description: "null when the report carries no terminal outcome."
              matched: { type: integer, description: "Rows moved. 0 is normal for a duplicate, late or non-terminal report." }
              note: { type: string, description: "Why nothing matched, when nothing did." }

  schemas:

    TenantAccount:
      type: object
      description: A tenant's Novu account as the bridge records it. Never the API key.
      properties:
        tenantId: { type: string, example: acme }
        status: { type: string, enum: [PROVISIONING, PROVISIONED, FAILED, DEPROVISIONED] }
        provisioned: { type: boolean }
        organizationId: { type: string }
        organizationName: { type: string, example: DIGIT tenant acme }
        environmentId: { type: string }
        environmentName: { type: string, example: Development }
        apiKeyStored: { type: boolean }
        apiKeyEncryptionKeyId: { type: string, description: "Which encryption key wrote the stored key (rotation)." }
        workflowsVersion: { type: integer }
        currentWorkflowsVersion: { type: integer }
        lastErrorCode: { type: string }
        lastErrorMessage: { type: string }
        provisionedTime: { type: integer, format: int64, nullable: true }
        deprovisionedTime: { type: integer, format: int64, nullable: true }
        lastModifiedTime: { type: integer, format: int64 }

    ChannelReadiness:
      type: object
      properties:
        ready: { type: boolean }
        pinned: { type: boolean, description: "The tenant's channel row selects the provider." }
        provider: { type: string, description: "Integration identifier a send is pinned to." }
        providerId: { type: string }
        type: { type: string, nullable: true }
        reason: { type: string, description: "Why not ready." }

    AccountView:
      type: object
      description: "#2203: whose notification account a provider list shows, and whether the caller may change it."
      properties:
        tenantAccountsEnabled: { type: boolean }
        mode: { type: string, enum: [TENANT, SHARED] }
        tenantId: { type: string, nullable: true }
        status: { type: string, enum: [PROVISIONED, NOT_PROVISIONED, PROVISIONING, FAILED, DEPROVISIONED, DISABLED, UNKNOWN] }
        manageable: { type: boolean }

    SendRequest:
      type: object
      required: [tenantId, channel, recipient, templateKey, payload]
      properties:
        tenantId: { type: string, description: "The tenant (its root's account sends)." }
        channel: { type: string, enum: [SMS, EMAIL] }
        recipient: { type: string, description: "SMS: E.164 (`+` and 7 to 15 digits), else `400 NB_INVALID_REQUEST`; a national number is never completed with a country code here (dispatch does that for DIGIT's stored numbers; a sign-in code goes only to the number as the caller validated it). EMAIL: an address." }
        templateKey: { type: string, enum: [OTP] }
        payload:
          type: object
          required: [code]
          description: "`expiresInSeconds` (1 to 86400) or `expiresAt` (ISO-8601 instant) is required."
          properties:
            code: { type: string, pattern: "^[0-9A-Za-z]{4,12}$" }
            expiresInSeconds: { type: integer, minimum: 1, maximum: 86400 }
            expiresAt: { type: string, format: date-time }

    SendResponse:
      type: object
      properties:
        status: { type: string, enum: [SENT, QUEUED] }
        transactionId: { type: string, description: "Novu's transaction id (`otp_<uuid>`), also the ledger row's `transactionId` and `eventId`." }
        tenantId: { type: string }
        channel: { type: string }
        provider: { type: string, description: "The integration identifier the send was pinned to." }
        account: { type: string, example: "tenant:acme" }

    Error:
      type: object
      properties:
        code: { type: string, example: NB_NO_PROVIDER }
        message: { type: string }
        description: { type: string }

    ErrorEnvelope:
      type: object
      description: The shared DIGIT error shape rendered by the tracer handler.
      properties:
        ResponseInfo: { type: object, nullable: true }
        Errors:
          type: array
          items: { $ref: "#/components/schemas/Error" }

    DispatchStatus:
      type: string
      enum: [RECEIVED, SENT, DELIVERED, BOUNCED, FAILED, SKIPPED, REJECTED]
      description: See `outputs.md` for the meaning of each and the legal transitions.

    DispatchSourcePath:
      type: string
      enum: [PRERENDERED, RESOLVED]
      default: PRERENDERED
      description: |
        Which inbound path produced this row. `PRERENDERED` — the producer sent a v1 envelope
        and the bridge only gated and delivered it. `RESOLVED` — the producer sent a thin
        domain event and the box routed, recruited, rendered and localized it.

        There is no configuration to read for this: the path is on every row, per message, in
        production. Rows written before the column existed are `PRERENDERED`, which is what
        they were.

    DispatchLogEntry:
      type: object
      description: One row of the delivery ledger, PII masked at read time.
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string }
        transactionId: { type: string, description: "Masked: the embedded subscriber is hidden." }
        referenceNumber: { type: string, nullable: true, description: "The producing module's own handle." }
        module: { type: string }
        eventName: { type: string }
        tenantId: { type: string }
        channel: { type: string, description: "`SMS` | `WHATSAPP` | `EMAIL`, or `NONE` for a decision taken before a channel existed." }
        sourcePath: { $ref: "#/components/schemas/DispatchSourcePath" }
        recipientValue: { type: string, description: "The subscriber: a user uuid (shown as it is: an id, not PII), or a phone / `tenant:phone` / email, masked (see the masking rule on `GET /logs`). `none` on a channel-less row." }
        templateKey: { type: string, nullable: true }
        templateVersion: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/DispatchStatus" }
        attemptCount: { type: integer }
        lastErrorCode: { type: string, nullable: true }
        lastErrorMessage: { type: string, nullable: true, description: "Masked like `transactionId`: it can quote one." }
        providerResponse:
          type: object
          nullable: true
          additionalProperties: true
          description: "The provider's raw acceptance/receipt, deep-masked at read time."
        isTest: { type: boolean, nullable: true }
        providerRef: { type: string, nullable: true, description: "Provider-side correlation id — how a receipt finds the row." }
        deliveredTime: { type: integer, format: int64, nullable: true }
        createdTime: { type: integer, format: int64 }
        lastModifiedTime: { type: integer, format: int64 }

    Integration:
      type: object
      description: Allowlist projection of a Novu integration. No credentials, ever.
      properties:
        _id: { type: string }
        providerId: { type: string, description: "Novu's provider id, e.g. `twilio`, `nodemailer`, `smscountry`." }
        channel: { type: string, description: "Novu's channel — `sms` or `email`. WhatsApp rides `sms`." }
        name: { type: string }
        identifier: { type: string, description: "`<catalog type>-<sha256(name)[0:16]>`; this is what makes the type round-trippable." }
        active: { type: boolean }
        primary: { type: boolean }
        environmentId: { type: string }
        type:
          type: string
          nullable: true
          description: "Catalog type derived from the identifier, or null when it cannot be established."

    ProviderType:
      type: object
      description: One out-of-the-box provider the operator can configure without an env edit.
      properties:
        type: { type: string, enum: [twilio-sms, twilio-whatsapp, smtp, smscountry, ozeki, jasmin] }
        label: { type: string }
        channel: { type: string, enum: [SMS, WHATSAPP, EMAIL] }
        transport:
          type: string
          enum: [novu]
          description: |
            How the message reaches the gateway. `novu` — Novu's worker calls it through the
            provider named by `novuProviderId`. `smscountry`, `ozeki` and `jasmin` are DIGIT's
            provider classes (backend/novu-bridge/novu-worker-providers), mounted into the stock
            Novu worker.
        novuProviderId: { type: string }
        credentialFields:
          type: array
          items: { $ref: "#/components/schemas/CredentialField" }
        supportsVerify: { type: boolean }
        supportsTestSend: { type: boolean }

    CredentialField:
      type: object
      description: One field of the operator's credential form. Describes what to ASK for.
      properties:
        name: { type: string }
        label: { type: string }
        type: { type: string, description: "text | password | checkbox" }
        required: { type: boolean }
        placeholder: { type: string, nullable: true }
        help: { type: string, nullable: true }

    Preference:
      type: object
      description: Allowlist projection of one stored preference record. No PII.
      properties:
        userId: { type: string, description: "Opaque uuid." }
        tenantId: { type: string }
        preferredLanguage: { type: string }
        consent:
          type: object
          additionalProperties: true
          description: "Per channel, `{status, scope}`."

    ProviderCreateFromCatalog:
      type: object
      required: [type, credentials]
      properties:
        type: { type: string, enum: [twilio-sms, twilio-whatsapp, smtp, smscountry, ozeki, jasmin] }
        name: { type: string, description: "Defaults to the type's label. Also seeds the identifier." }
        identifier: { type: string, description: "Overrides the derived `<type>-<hash>` identifier. Must start with `<type>-`, else `400 NB_INVALID_PROVIDER`." }
        active: { type: boolean, default: true, description: "Absent means true." }
        credentials:
          type: object
          additionalProperties: true
          description: "Exactly the fields `GET /providers/catalog` lists for the type. Validated before anything reaches Novu."

    ProviderCreateLegacy:
      type: object
      required: [providerId]
      properties:
        providerId: { type: string, description: "A Novu provider id the catalog does not cover." }
        channel: { type: string, enum: [SMS, WHATSAPP, EMAIL] }
        name: { type: string }
        identifier: { type: string, description: "A WHATSAPP integration without one gets `whatsapp-<hash>` so the channel survives Novu's `sms` storage." }
        credentials:
          type: object
          additionalProperties: true

    NotificationEvent:
      type: object
      description: |
        The inbound Kafka envelope. Authoritatively defined by `envelope-v1.schema.json` —
        this entry exists only so the `/dispatch` diagnostics can reference it.
      externalDocs:
        description: envelope-v1.schema.json
        url: ./envelope-v1.schema.json
      additionalProperties: true

    ConfigSourceReport:
      type: object
      description: Which namespace served each notification-config master for one tenant.
      properties:
        tenantId: { type: string, description: The tenant asked about. }
        stateTenantId:
          type: string
          description: The tenant the masters were actually read at — they are held at the state root.
        anyLegacy:
          type: boolean
          description: True when ANY master is still being served from the legacy namespace.
        masters:
          type: object
          description: "Master name (`Routing`, `Template`, `ProviderTemplate`, `EventCatalogue`) to its source."
          additionalProperties:
            type: object
            properties:
              master: { type: string }
              schemaCode:
                type: string
                description: "The MDMS schema code actually read, e.g. `NOTIFICATIONS.Routing`."
              rows: { type: integer, description: How many rows it found. }
              legacy:
                type: boolean
                description: True when the legacy adapter served this master because the new one had no rows.
              stale:
                type: boolean
                description: True when the rows came from a cache entry past its TTL, MDMS being unreachable.

    ThinEventResolveRequest:
      type: object
      required: [RequestInfo, event]
      properties:
        RequestInfo:
          type: object
          description: The standard DIGIT RequestInfo.
        event:
          type: object
          description: "A thin domain event; see `contract/thin-event-v1.schema.json`."

    ThinEventResolveResponse:
      type: object
      properties:
        responseInfo: { type: object }
        envelopes:
          type: array
          description: One per recipient x channel, in emission order. Empty when nothing would be sent.
          items: { $ref: "#/components/schemas/NotificationEvent" }
        terminalCode:
          type: string
          nullable: true
          description: "The channel-less decision code when nothing would be sent — `NB_NO_ROUTING`, `NB_NO_RECIPIENTS`, `NB_UNKNOWN_AUDIENCE_SCHEME`, `NB_RECIPIENT_LIMIT_EXCEEDED`."
        diagnostics:
          type: array
          items: { type: string }
          description: Every decision the resolver took, in order, including per-recipient skips.

    DispatchDryRunRequest:
      type: object
      required: [RequestInfo, event]
      properties:
        RequestInfo:
          type: object
          description: The standard DIGIT RequestInfo.
        send:
          type: boolean
          default: false
          description: "`_dry-run` only. True delivers for real."
        event: { $ref: "#/components/schemas/NotificationEvent" }

    DispatchDryRunResponse:
      type: object
      properties:
        responseInfo: { type: object }
        result:
          type: object
          properties:
            valid: { type: boolean }
            preferenceAllowed: { type: boolean }
            derivedContext:
              type: object
              description: What the bridge read out of the envelope — channel, audience, locale, recipient, subscriberId, body, subject, transactionId.
            novuTriggered: { type: boolean }
            novuStatusCode: { type: integer, nullable: true }
            novuResponse: { type: object, nullable: true, additionalProperties: true }
            diagnostics:
              type: array
              items: { type: string }
              description: One line saying what happened, e.g. "Preference denied".
