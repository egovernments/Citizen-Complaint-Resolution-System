environments:
  env:
    values:
      - ../environments/env-secrets.yaml
      - ../environments/env.yaml
---
repositories:
- name: bitnami
  url: https://charts.bitnami.com/bitnami

templates: 
  default: &default
    namespace: backbone
    missingFileHandler: Warn

releases:
# Listed first so the seed dump lands before core-services' Flyway init
# containers run. Ships disabled — see db-seed/values.yaml for why loading a
# dump into a managed DB is opt-in-per-environment rather than a default.
#
# `installed:` is the ONLY switch, as with every sibling release here. Flipping
# it to true is sufficient; the chart has no second internal gate.
- name: db-seed
  installed: false
  chart: ./db-seed
  namespace: egov
  version: 0.1.0
  values:
    - ./db-seed/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: cert-manager
  chart: ./cert-manager
  namespace: egov
  installed: true
  version: v1.13.3
  disableValidation: true
  values:
    - ./cert-manager/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: minio
  installed: false
  chart: ./minio
  version: 13.3.1
  <<: *default
  values:
    - ./minio/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: postgresql
  installed: false
  chart: ./postgresql
  version: 11.9.13
  <<: *default
  values:
    - ./postgresql/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - global:
        postgresql:
          auth:
            postgresPassword: {{ .Values.secrets.db.password | quote }}

- name: redis
  installed: true
  chart: ./redis
  version: 7.2.4
  <<: *default
  values:
    - ./redis/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: elasticsearch
  chart: ./elasticsearch
  version: 8.11.3
  <<: *default
  values:
    - ./elasticsearch/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - secret:
        password: {{ .Values.secrets.elasticsearch.password }}

- name: elasticsearch-data
  chart: ./elasticsearch-data
  version: 8.11.3
  <<: *default
  values:
    - ./elasticsearch-data/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: kibana
  chart: ./kibana
  version: 8.11.3
  force: true
  <<: *default
  values:
    - ./kibana/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - ingress:
        hosts:
          - host: {{ .Values.global.domain }}
            paths:
              - path: /kibana
        tls: 
          - secretName: {{ .Values.global.domain }}-tls-certs
            hosts:
              - {{ .Values.global.domain }}

- name: kafka-kraft
  installed: true
  chart: ./kafka-kraft
  version: 26.2.0
  <<: *default
  values:
    - ./kafka-kraft/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
  set:
    - name: kraft.clusterId
      value: {{ .Values.secrets.kafka.clusterID }}
    # Broker metrics (#1647). Scoped to THIS release on purpose: the chart
    # reads .Values.metrics.*, and a top-level `metrics:` key in env.yaml would
    # be injected into every release — including charts/common/_service.yaml,
    # which emits prometheus.io/* scrape annotations for any chart that sets
    # `metrics`, i.e. all 41 application services.
    #
    # kafka exporter is the one that yields consumer-group LAG
    # (kafka_consumergroup_lag). Lag is the failure that matters here:
    # egov-persister is the sole Kafka->Postgres write path and runs a single
    # replica, so when it stalls the API still returns 200 while complaints are
    # never persisted. JMX gives broker health (under-replicated partitions,
    # request rates) but NOT lag — both, or the exercise misses its point.
    - name: metrics.kafka.enabled
      value: true
    - name: metrics.jmx.enabled
      value: true
    # Prometheus only selects ServiceMonitors labelled with its release name:
    # serviceMonitorSelectorNilUsesHelmValues is true with an empty selector,
    # which renders as matchLabels {release: kube-prometheus-stack}. Without
    # this label the object is created and silently never scraped.
    - name: metrics.serviceMonitor.enabled
      value: true
    - name: metrics.serviceMonitor.labels.release
      value: kube-prometheus-stack

- name: ingress-nginx
  installed: true
  chart: ./ingress-nginx
  version: 4.10.0
  <<: *default
  values:
    - ./ingress-nginx/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - domain: {{ .Values.global.domain }}

- name: novu
  installed: true
  chart: ./novu
  version: 2.3.0
  namespace: novu
  values:
    - ./novu/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
