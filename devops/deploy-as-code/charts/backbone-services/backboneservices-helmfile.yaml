environments:
  env:
    values:
      - ../environments/env-secrets.yaml
      - ../environments/env.yaml
---
repositories:
- name: bitnami
  url: https://charts.bitnami.com/bitnami

templates: 
  default: &default
    namespace: backbone
    missingFileHandler: Warn

releases:
# Listed first so the seed dump lands before core-services' Flyway init
# containers run. Ships disabled — see db-seed/values.yaml for why loading a
# dump into a managed DB is opt-in-per-environment rather than a default.
#
# `installed:` is the ONLY switch, as with every sibling release here. Flipping
# it to true is sufficient; the chart has no second internal gate.
- name: db-seed
  installed: false
  chart: ./db-seed
  namespace: egov
  version: 0.1.0
  values:
    - ./db-seed/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: cert-manager
  chart: ./cert-manager
  namespace: egov
  installed: true
  version: v1.13.3
  disableValidation: true
  values:
    - ./cert-manager/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: minio
  installed: false
  chart: ./minio
  version: 13.3.1
  <<: *default
  values:
    - ./minio/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: postgresql
  installed: false
  chart: ./postgresql
  version: 11.9.13
  <<: *default
  values:
    - ./postgresql/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - global:
        postgresql:
          auth:
            postgresPassword: {{ .Values.secrets.db.password | quote }}

- name: redis
  installed: true
  chart: ./redis
  version: 7.2.4
  <<: *default
  values:
    - ./redis/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: elasticsearch
  chart: ./elasticsearch
  version: 8.11.3
  <<: *default
  values:
    - ./elasticsearch/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - secret:
        password: {{ .Values.secrets.elasticsearch.password }}

- name: elasticsearch-data
  chart: ./elasticsearch-data
  version: 8.11.3
  <<: *default
  values:
    - ./elasticsearch-data/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: kibana
  chart: ./kibana
  version: 8.11.3
  force: true
  <<: *default
  values:
    - ./kibana/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - ingress:
        hosts:
          - host: {{ .Values.global.domain }}
            paths:
              - path: /kibana
        tls: 
          - secretName: {{ .Values.global.domain }}-tls-certs
            hosts:
              - {{ .Values.global.domain }}

- name: kafka-kraft
  installed: true
  chart: ./kafka-kraft
  version: 26.2.0
  <<: *default
  values:
    - ./kafka-kraft/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
  set:
    - name: kraft.clusterId
      value: {{ .Values.secrets.kafka.clusterID }}

- name: ingress-nginx
  installed: true
  chart: ./ingress-nginx
  version: 4.10.0
  <<: *default
  values:
    - ./ingress-nginx/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - domain: {{ .Values.global.domain }}
    # Security config (#1648). Two of these three keys were reaching nothing at
    # all, and it was not cosmetic: the TLS cipher suite and the protocol floor
    # were silently absent while env.yaml stated them plainly.
    #
    # The precise shape of the defect, since it is not the obvious one. This
    # vendored chart carries a LOCAL modification to templates/_helpers.tpl
    # (lines 6-9, absent from upstream 4.10.0): inside "ingress-nginx.name" it
    # merges .Values[.Chart.Name] over the root context with mustMergeOverwrite,
    # which mutates in place. So env.yaml's `ingress-nginx.controller.*` IS
    # read -- the subtree is hoisted to the root at template time. What is NOT
    # read is everything the hoist cannot help:
    #   - ssl-ciphers / ssl-protocols / ssl-ecdh-curve are SIBLINGS of
    #     `controller:` in env.yaml, so they hoist to root `.Values.ssl-ciphers`,
    #     not to `.Values.controller.config.*` where the chart reads them
    #   - `replicas` is simply the wrong key name; the chart reads replicaCount
    # Those two are what this block genuinely repairs. addHeaders is re-pathed
    # here as well and is belt-and-braces -- the hoist already delivers it --
    # but stating it explicitly beats depending on a hand-patched helper.
    #
    # Re-pathed HERE rather than by moving the block to a top-level
    # `controller:` key in env.yaml, because kafka-kraft reads .Values.controller
    # too (13 templates, its own controller block) and the whole-values
    # passthrough on the line above is shared -- a root-level move would leak
    # these into the broker.
    #
    # An inline values block rather than `set:`: Access-Control-Allow-Headers
    # contains COMMAS, which helm's --set parses as separate assignments.
    #
    # NB: do not write a Go-template action in these comments. helmfile renders
    # the file as a template BEFORE parsing it as YAML, so `#` does not protect
    # anything -- an interpolation here expands into the middle of the comment
    # and corrupts the document.
    - controller:
        replicaCount: {{ index .Values "ingress-nginx" "controller" "replicas" | default 1 }}
        # Roll the controller whenever the headers change.
        #
        # The `add-headers` ConfigMap is read by nginx when the controller
        # builds its configuration, and the running process does not pick up
        # later edits to it. Verified on a cluster: the ConfigMap was updated at
        # 11:39:14 and the controller was still serving the OLD
        # Access-Control-Allow-Origin at 11:41 -- it had even logged a RELOAD,
        # for the main config, while the custom headers stayed stale. A restart
        # applied them immediately.
        #
        # Without this annotation a `helmfile apply` that changes only these
        # headers reports success and changes nothing that a browser can see --
        # the same silent no-op this whole block exists to fix, one level up.
        # The hash makes the pod template differ, so helm rolls it for us.
        podAnnotations:
          checksum/add-headers: {{ index .Values "ingress-nginx" "controller" "addHeaders" | toYaml | sha256sum }}
        # Rendered into its own ConfigMap and referenced by the controller's
        # `add-headers` key -- this is what actually applies X-Frame-Options,
        # nosniff and the CORS policy to every response.
        addHeaders: {{ index .Values "ingress-nginx" "controller" "addHeaders" | toYaml | nindent 10 }}
        # nginx ConfigMap entries. ssl-protocols is the one that matters most:
        # without it the controller keeps its build default, which on some
        # builds still permits TLSv1.0/1.1.
        config:
          ssl-ciphers: {{ index .Values "ingress-nginx" "ssl-ciphers" | quote }}
          ssl-protocols: {{ index .Values "ingress-nginx" "ssl-protocols" | quote }}
          ssl-ecdh-curve: {{ index .Values "ingress-nginx" "ssl-ecdh-curve" | quote }}
    # Gateway metrics (#1648). Every citizen request crosses this controller and
    # it contributes nothing to Prometheus, so "are we returning errors, and on
    # which route?" can only be answered by reading logs.
    #
    # Written into the `ingress-nginx:` subtree, and NOT via `set:`, because of
    # a local modification to this vendored chart. templates/_helpers.tpl:6-9
    # (absent from upstream 4.10.0) does, inside "ingress-nginx.name":
    #
    #   $envOverrides := index .Values .Chart.Name
    #   mustMergeOverwrite . (dict "Values" (mustMergeOverwrite $baseValues $envOverrides))
    #
    # mergeOverwrite mutates its destination, and the destination here is the
    # root context -- so the first template to render a label permanently
    # merges .Values["ingress-nginx"] OVER .Values for the whole render. That
    # happens at TEMPLATE time, after every values file and after --set, so
    # anything named in env.yaml's block wins over both. Verified: with
    # env.yaml present, `--set controller.metrics.enabled=true` renders NO
    # metrics Service, because env.yaml says `enabled: false` one level down.
    #
    # Which is also why this cannot move to a root `controller:` key: the
    # subtree would still overwrite it, and kafka-kraft reads .Values.controller
    # for its own broker block off the same shared passthrough.
    - ingress-nginx:
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              # Prometheus selects only ServiceMonitors carrying its release
              # name (serviceMonitorSelectorNilUsesHelmValues true + empty
              # selector renders as matchLabels {release: kube-prometheus-stack}).
              # Without this the object exists and is never scraped.
              additionalLabels:
                release: kube-prometheus-stack
            # MUST stay false while `prometheusRule.rules` is [] in
            # ingress-nginx/values.yaml. The template emits `spec:` with no
            # body when the list is empty, so the object renders as
            # `spec: null` -- and the PrometheusRule CRD marks spec required
            # and typed object, so the API server rejects it and the whole
            # release apply fails. env.yaml asks for true; it was harmless only
            # because metrics.enabled gated it off. Turning metrics on is what
            # makes it dangerous.
            prometheusRule:
              enabled: false

- name: novu
  installed: true
  chart: ./novu
  version: 2.3.0
  namespace: novu
  values:
    - ./novu/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
