environments:
  env:
    values:
      - ../environments/env-secrets.yaml
      - ../environments/env.yaml
---
repositories:
- name: bitnami
  url: https://charts.bitnami.com/bitnami

templates: 
  default: &default
    namespace: backbone
    missingFileHandler: Warn

releases:
# Listed first so the seed dump lands before core-services' Flyway init
# containers run. Ships disabled — see db-seed/values.yaml for why loading a
# dump into a managed DB is opt-in-per-environment rather than a default.
#
# `installed:` is the ONLY switch, as with every sibling release here. Flipping
# it to true is sufficient; the chart has no second internal gate.
- name: db-seed
  installed: false
  chart: ./db-seed
  namespace: egov
  version: 0.1.0
  values:
    - ./db-seed/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: cert-manager
  chart: ./cert-manager
  namespace: egov
  installed: true
  version: v1.13.3
  disableValidation: true
  values:
    - ./cert-manager/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: minio
  installed: false
  chart: ./minio
  version: 13.3.1
  <<: *default
  values:
    - ./minio/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: postgresql
  installed: false
  chart: ./postgresql
  version: 11.9.13
  <<: *default
  values:
    - ./postgresql/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - global:
        postgresql:
          auth:
            postgresPassword: {{ .Values.secrets.db.password | quote }}

- name: redis
  installed: true
  chart: ./redis
  version: 7.2.4
  <<: *default
  values:
    - ./redis/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: elasticsearch
  chart: ./elasticsearch
  version: 8.11.3
  <<: *default
  values:
    - ./elasticsearch/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - secret:
        password: {{ .Values.secrets.elasticsearch.password }}

- name: elasticsearch-data
  chart: ./elasticsearch-data
  version: 8.11.3
  <<: *default
  values:
    - ./elasticsearch-data/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: kibana
  chart: ./kibana
  version: 8.11.3
  force: true
  <<: *default
  values:
    - ./kibana/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - ingress:
        hosts:
          - host: {{ .Values.global.domain }}
            paths:
              - path: /kibana
        tls: 
          - secretName: {{ .Values.global.domain }}-tls-certs
            hosts:
              - {{ .Values.global.domain }}

- name: kafka-kraft
  installed: true
  chart: ./kafka-kraft
  version: 26.2.0
  <<: *default
  values:
    - ./kafka-kraft/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
  set:
    - name: kraft.clusterId
      value: {{ .Values.secrets.kafka.clusterID }}

- name: ingress-nginx
  installed: true
  chart: ./ingress-nginx
  version: 4.10.0
  <<: *default
  values:
    - ./ingress-nginx/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - domain: {{ .Values.global.domain }}
    # Security config (#1648). env.yaml's `ingress-nginx:` block is read by
    # NOTHING -- this vendored chart reads .Values.controller.* at the root, so
    # everything under `ingress-nginx.controller.*` lands one level too deep.
    # The consequence was not cosmetic: the security headers, the TLS cipher
    # suite and the protocol floor were all silently absent while the file
    # stated them plainly.
    #
    # Re-pathed HERE rather than by moving the block to a top-level
    # `controller:` key, because kafka-kraft reads .Values.controller too (13
    # templates, its own controller block) and the whole-values passthrough on
    # the line above is shared -- a root-level move would leak these into the
    # broker.
    #
    # An inline values block rather than `set:`: Access-Control-Allow-Headers
    # contains COMMAS, which helm's --set parses as separate assignments.
    #
    # NB: do not write a Go-template action in these comments. helmfile renders
    # the file as a template BEFORE parsing it as YAML, so `#` does not protect
    # anything -- an interpolation here expands into the middle of the comment
    # and corrupts the document.
    - controller:
        replicaCount: {{ index .Values "ingress-nginx" "controller" "replicas" | default 1 }}
        # Rendered into its own ConfigMap and referenced by the controller's
        # `add-headers` key -- this is what actually applies X-Frame-Options,
        # nosniff and the CORS policy to every response.
        addHeaders: {{ index .Values "ingress-nginx" "controller" "addHeaders" | toYaml | nindent 10 }}
        # nginx ConfigMap entries. ssl-protocols is the one that matters most:
        # without it the controller keeps its build default, which on some
        # builds still permits TLSv1.0/1.1.
        config:
          ssl-ciphers: {{ index .Values "ingress-nginx" "ssl-ciphers" | quote }}
          ssl-protocols: {{ index .Values "ingress-nginx" "ssl-protocols" | quote }}
          ssl-ecdh-curve: {{ index .Values "ingress-nginx" "ssl-ecdh-curve" | quote }}
  # Gateway metrics (#1648). Every citizen request crosses this controller and
  # it contributes nothing to Prometheus, so "are we returning errors, and on
  # which route?" can only be answered by reading logs.
  #
  # Set HERE, not in env.yaml. This is a vendored upstream chart that reads
  # .Values.controller.* directly (39 templates) with no chart-name hoisting,
  # so env.yaml's `ingress-nginx:` block lands one level too deep and is
  # ignored in full — which is the wider defect #1648 tracks. And it must not
  # move to a top-level `controller:` key either: kafka-kraft reads
  # .Values.controller too (13 templates, its own controller block), so the
  # override would leak into the broker.
  set:
    # Already effectively true via the chart default, but the env.yaml block
    # tries to set it FALSE. Pinning it here means the deployed state stops
    # depending on which of two ignored/honoured paths wins.
    - name: controller.metrics.enabled
      value: true
    - name: controller.metrics.serviceMonitor.enabled
      value: true
    # Prometheus selects only ServiceMonitors carrying its release name
    # (serviceMonitorSelectorNilUsesHelmValues true + empty selector renders as
    # matchLabels {release: kube-prometheus-stack}). Without this the object
    # exists and is never scraped.
    - name: controller.metrics.serviceMonitor.additionalLabels.release
      value: kube-prometheus-stack

- name: novu
  installed: true
  chart: ./novu
  version: 2.3.0
  namespace: novu
  values:
    - ./novu/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
