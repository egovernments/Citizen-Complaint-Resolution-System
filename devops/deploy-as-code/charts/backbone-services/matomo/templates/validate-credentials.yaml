{{/*
LOCAL ADDITION (#1254) — not from the upstream Bitnami chart. Re-add on re-vendor.

Refuses to render an install whose superuser password is absent or is one of the
placeholders this repository ships. Both of those are worse than they look:

  empty        the chart falls back to `common.secrets.passwords.manage`, which
               generates a random password per render. Every `helmfile apply`
               would rewrite the Secret with a different value and no operator
               would ever hold a working one — the same trap the Grafana block in
               charts/monitoring/monitoring-helmfile.yaml documents.

  placeholder  env-secrets.yaml is committed, unencrypted and not gitignored, so
               a placeholder that survives to a real apply publishes /matomo with
               credentials anyone can read out of the repository.

Living in the chart rather than in the helmfile is deliberate: helmfile renders
the WHOLE file as a Go template before parsing it, so a `fail` there fires on
every release in backbone-services even when matomo is `installed: false`. A
chart template only renders when this release actually renders, which is exactly
the scope wanted.

Emits no manifest — helm skips a document that renders to nothing.
*/}}
{{- $existing := .Values.existingSecret | default "" -}}
{{- $password := .Values.matomoPassword | default "" -}}
{{- if not $existing -}}
  {{- if not $password -}}
    {{- fail "matomo: no superuser password. Set secrets.matomo.existingSecret (preferred — a Kubernetes Secret with a matomo-password key, created out of band so nothing credential-shaped lands in git) or secrets.matomo.password in charts/environments/env-secrets.yaml. Leaving it empty is NOT a safe default: the chart would mint a new random password on every render and none of them would be recoverable." -}}
  {{- end -}}
  {{- $placeholders := list "change-me-strong" "change-me" "changeme" "password" "matomo" "admin" "bitnami" -}}
  {{- if has (lower $password) $placeholders -}}
    {{- fail (printf "matomo: secrets.matomo.password is still the placeholder %q. env-secrets.yaml is committed and unencrypted, so this would publish /matomo with credentials that are public in this repository. Set a real password, or better, secrets.matomo.existingSecret." $password) -}}
  {{- end -}}
{{- end -}}
