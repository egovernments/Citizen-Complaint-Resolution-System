apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ include "novu.namespace" . }}
  labels:
{{- toYaml .Values.api.labels | nindent 4 }}
spec:
  {{- include "novu.replicas" (dict "component" .Values.api) | nindent 2 }}
  selector:
    matchLabels:
{{- toYaml .Values.api.labels | nindent 6 }}
  template:
    metadata:
      labels:
{{- toYaml .Values.api.labels | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          {{- if or .Values.api.env .Values.bootstrap.enabled }}
          env:
          {{- with .Values.api.env }}
{{- tpl . $ | nindent 12 }}
          {{- end }}
          {{- if .Values.bootstrap.enabled }}
            # Public sign-up stays off: the first signup would own the organization. The first
            # account comes from templates/bootstrap/job.yaml. With bootstrap off (the environment
            # pins novu-bridge.novu-api-key) Novu's default applies, so an operator can still sign
            # up in the dashboard to create the account and key they pin.
            - name: DISABLE_USER_REGISTRATION
              value: "true"
          {{- end }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
{{- toYaml . | nindent 12 }}
          {{- end }}
