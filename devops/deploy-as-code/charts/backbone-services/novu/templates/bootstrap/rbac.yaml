{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novu-bootstrap
  namespace: {{ include "novu.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: novu-bootstrap
  namespace: {{ include "novu.namespace" . }}
rules:
  # Kubernetes cannot limit create by resourceNames, so create is a separate rule.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.bootstrap.adminSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: novu-bootstrap
  namespace: {{ include "novu.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: novu-bootstrap
subjects:
  - kind: ServiceAccount
    name: novu-bootstrap
    namespace: {{ include "novu.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: novu-bootstrap
  namespace: {{ .Values.bootstrap.bridgeNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.bootstrap.apiKeySecret | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: novu-bootstrap
  namespace: {{ .Values.bootstrap.bridgeNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: novu-bootstrap
subjects:
  - kind: ServiceAccount
    name: novu-bootstrap
    namespace: {{ include "novu.namespace" . }}
{{- end }}
