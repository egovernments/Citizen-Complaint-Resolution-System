{{- if .Values.worker.digitProviders.enabled }}
# DIGIT's SMS providers for the stock Novu worker, mounted at
# /opt/digit-novu-providers and preloaded via NODE_OPTIONS (worker-deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.worker.name }}-digit-providers
  namespace: {{ include "novu.namespace" . }}
  labels:
{{- toYaml .Values.worker.labels | nindent 4 }}
data:
{{ (.Files.Glob "files/novu-worker-providers/*.js").AsConfig | indent 2 }}
{{- end }}
