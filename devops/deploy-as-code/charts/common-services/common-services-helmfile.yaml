environments:
  env:
    values:
      - ../environments/env-secrets.yaml
      - ../environments/env.yaml
---
templates:
  default: &default
    chart: ./{{`{{ .Release.Name }}`}}
    labels:
      target: ./{{`{{ .Release.Name }}`}}
    version: 0.1.0
    namespace: egov
    # This prevents helmfile exiting when it encounters a missing file
    # Valid values are "Error", "Warn", "Info", "Debug". The default is "Error"
    # Use "Debug" to make missing files errors invisible at the default log level(--log-level=INFO)
    missingFileHandler: Warn
    values:
    - {{ .Values | toYaml | nindent 8 }}

releases:
  - name: egov-user-event
    installed: true
    <<: *default

  - name: egov-hrms
    installed: true
    <<: *default

  - name: digit-config-service
    installed: true
    <<: *default

  - name: digit-user-preferences-service
    installed: true
    <<: *default

  - name: novu-bridge
    installed: true
    <<: *default
    # Wait for the rollout before moving on: digit-helmfile.yaml deploys urban
    # (pgr-services) after this file, and a new pgr-services must not publish thin
    # events while the old bridge is still the one consuming them — it dead-letters
    # them. A bridge that never becomes Ready fails the sync here, before pgr-services
    # is touched, and the old pair keeps working.
    wait: true
    timeout: 600
