{{- /*
  One tag for the notification stack. global.notificationStackTag (charts/environments/
  env.yaml) sets this chart's image AND its db-migration image together with those of
  pgr-services and novu-bridge, so a cluster that pins the stack to an immutable tag
  does not leave this pair on the chart's rolling default. An explicit per-chart
  override in env.yaml (digit-user-preferences-service.image.tag /
  .initContainers.dbMigration.image.tag) still wins, because common.name merges those
  over .Values after this runs. Same block as common-services/novu-bridge.
*/ -}}
{{- $stackTag := (.Values.global | default dict).notificationStackTag -}}
{{- if $stackTag }}
{{- $_ := set .Values.image "tag" $stackTag }}
{{- $_ := set .Values.initContainers.dbMigration.image "tag" $stackTag }}
{{- end }}
{{- /*
  Pull policy follows the tag that will actually run, for the app image and the
  db-migration image alike: IfNotPresent for an immutable tag (a release,
  develop-<sha8>), Always for a rolling one (nightly-*, latest, develop, …), or a
  node that already holds the image keeps running whatever the tag pointed at
  when it was first pulled. common.name merges the env.yaml per-chart overrides
  into .Values; run it first so the decision sees an overriding tag too. Same
  rule as common-services/novu-bridge.
*/ -}}
{{- $_ := include "common.name" . }}
{{- range $img := list .Values.image .Values.initContainers.dbMigration.image }}
{{- if regexMatch "^(latest|nightly-.*|develop|main|master)$" (toString $img.tag) }}
{{- $_ := set $img "pullPolicy" "Always" }}
{{- end }}
{{- end }}
# deployment.yaml
{{- template "common.deployment" . -}}
