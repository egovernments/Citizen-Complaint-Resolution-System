# Common Labels
labels:
  app: "digit-user-preferences-service"
  group: "egov"

# Ingress Configs
ingress:
  namespace: "egov"
  enabled: true
  zuul: true
  context: "user-preference"

# Init Containers - DB Migration
# The service is Spring Boot with Flyway; this init container owns the schema
# and the app's embedded Flyway is switched off below, matching every sibling
# Java service. (The Go implementation relied on GORM AutoMigrate, which is
# why this used to be disabled.)
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "digit_user_preferences_service_schema"
    image:
      repository: "digit-user-preferences-service-db"
      tag: "2.12-5137119"

# Container Configs
image:
  repository: "digit-user-preferences-service"
  tag: "2.12-5137119"
replicas: "1"
httpPort: 8080
appType: "java-spring"
heap: "-Xmx192m -Xms192m"
java-args: "-Dspring.profiles.active=monitoring"

# Health Checks
# /health is at the container root, not under the API context path: the service
# mounts its API under SERVER_CONTEXT_PATH and leaves the probe at the root.
healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"

# Resources
memory_limits: "512Mi"
resources: |
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: {{ .Values.memory_limits | quote }}
    cpu: "300m"

tracing-enabled: true

# Environment variables
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_CONTEXT_PATH
    value: "/user-preference"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  {{- if index .Values "tracing-enabled" }}
  - name: TRACER_OPENTRACING_ENABLED
    value: "true"
  {{- end }}
  # The init container above applies the migrations, so the app must not.
  - name: SPRING_FLYWAY_ENABLED
    value: "false"
  # Both endpoints key on the userId in the request body, and this route is
  # exposed through the gateway, so the service holds a citizen principal to
  # its own record. Roles listed here may act on someone else's record within
  # their own tenant, and are overridable per environment from env.yaml.
  - name: ENFORCE_OWNERSHIP
    value: {{ index .Values "enforce-ownership" | quote }}
  - name: PRIVILEGED_ROLES
    value: {{ index .Values "privileged-roles" | quote }}
  # The datasource url, username and password all arrive from extraEnv.java
  # (egov-config's db-url plus the db secret), as they do for every sibling
  # Java service, so this chart does not restate them. DB_SSL_MODE is the
  # exception: nothing upstream carries it, and application.properties applies
  # it as a driver property so it survives the injected url.
  - name: DB_SSL_MODE
    value: {{ index .Values "db-ssl-mode" | quote }}

# Default values, overridable per environment from charts/environments/env.yaml
db-ssl-mode: "require"
enforce-ownership: "true"
# EMPLOYEE is excluded on purpose: HRMS forces that role onto every employee it
# creates, so including it would cover every field worker and CSR rather than
# administrators.
privileged-roles: "SUPERUSER,ACCOUNT_ADMIN,SYSTEM"
