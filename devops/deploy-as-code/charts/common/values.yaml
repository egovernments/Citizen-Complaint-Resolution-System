# Default values for commons.
# This is a YAML-formatted file.
# Declare name/value pairs to be passed into your templates.
global:
    containerRegistry: egovio

replicas: 1
httpPort: 8080
appType: ""

disableAnnotationTimestamp: true

ingress:
  enabled: false
  zuul: false
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true" 
   # nginx.ingress.kubernetes.io/limit-rpm: "300"
  waf: 
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/lua-resty-waf: "active"  
      nginx.ingress.kubernetes.io/lua-resty-waf-debug: "true"
      nginx.ingress.kubernetes.io/lua-resty-waf-score-threshold: "10"
      nginx.ingress.kubernetes.io/lua-resty-waf-allow-unknown-content-types: "true"
      nginx.ingress.kubernetes.io/lua-resty-waf-process-multipart-body: "false"              

image:
  pullPolicy: IfNotPresent   

affinity:
    preferSpreadAcrossAZ: true

initContainers:
  dbMigration:
    enabled: false
    image:
      pullPolicy: IfNotPresent  
      tag: latest
    env: |
        - name: "DB_URL"
          valueFrom: 
            configMapKeyRef: 
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}              
        - name: "FLYWAY_USER"
          valueFrom: 
            secretKeyRef: 
                name: db
                key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef: 
                name: db
                key: flyway-password
        - name: "FLYWAY_LOCATIONS"
          valueFrom: 
            configMapKeyRef: 
                name: egov-config
                key: flyway-locations
        - name: "FLYWAY_IGNORE_MIGRATION_PATTERNS"
          value: "*:missing"
        - name: "FLYWAY_OUT_OF_ORDER"
          value: "true"
        - name: "FLYWAY_BASELINE_ON_MIGRATE"
          value: "true"
        - name: "SCHEMA_NAME"
          value: "public"

  gitSync:
    enabled: false
    image:
      repository: k8s.gcr.io/git-sync
      tag: v3.1.1
      pullPolicy: IfNotPresent   
    env: |
        - name: "GIT_SYNC_REPO"
          value: "{{ .Values.initContainers.gitSync.repo }}"
        - name: "GIT_SYNC_BRANCH"
          value: "{{ .Values.initContainers.gitSync.branch }}"        
        - name: "GIT_SYNC_DEPTH"
          value: "1"            
        - name: "GIT_SYNC_ONE_TIME"
          value: "true"          
        - name: "GIT_SYNC_SSH"
          value: "true"      
        - name: "GIT_SYNC_ROOT"
          value: "/work-dir"

healthChecks:
    enabled: false
    livenessProbe: |
        httpGet:
            path: "{{ .Values.healthChecks.livenessProbePath }}"
            port: {{ .Values.httpPort }}
        initialDelaySeconds: 30
        timeoutSeconds: 3
        periodSeconds: 60
        successThreshold: 1
        failureThreshold: 5
    readinessProbe: |
        httpGet:
            path: "{{ .Values.healthChecks.readinessProbePath }}"
            port: {{ .Values.httpPort }}
        initialDelaySeconds: 30
        timeoutSeconds: 3
        periodSeconds: 30
        successThreshold: 1
        failureThreshold: 5        

lifecycle:
    preStop:
        exec:
            command:
            - sh
            - -c
            - "sleep 10"

memory_limits: "512Mi"
resources: |
  {{- if eq .Values.appType "java-spring" -}}
  requests:
    memory: {{ .Values.memory_limits | quote }}
  limits:
    memory: {{ .Values.memory_limits | quote }}
  {{- end -}}
## Allows specification of additional environment variables
extraEnv:
  java: |
      - name: SPRING_DATASOURCE_URL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: FLYWAY_ENABLED
        value: "false"      
      - name: SPRING_FLYWAY_ENABLED
        value: "false"      
      - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
        value: "/"
      - name: APP_TIMEZONE
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: timezone              
      - name: FLYWAY_URL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: db
            key: username
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db
            key: password
      - name: SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-datasource-tomcat-initialSize
      {{- if .Values.otel.enabled }}
      # OTEL javaagent (#1646). JAVA_TOOL_OPTIONS is how the JVM picks the
      # agent up without changing any service's entrypoint. Metrics AND traces
      # travel one OTLP pipeline to the collector, which re-exposes metrics for
      # Prometheus — so this single block is what gives 41 services JVM metrics.
      - name: JAVA_TOOL_OPTIONS
        value: "-javaagent:/otel/opentelemetry-javaagent.jar"
      - name: OTEL_SERVICE_NAME
        value: {{ template "common.name" . }}
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: {{ .Values.otel.endpoint | quote }}
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: "grpc"
      - name: OTEL_METRICS_EXPORTER
        value: "otlp"
      - name: OTEL_TRACES_EXPORTER
        value: {{ .Values.otel.tracesExporter | quote }}
      # Logs stay on the promtail -> loki path this tier already uses.
      - name: OTEL_LOGS_EXPORTER
        value: "none"
      {{- else }}
      - name: OTEL_TRACES_EXPORTER
        value: "none"
      {{- end }}
      - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: "org.postgresql.Driver"
      - name: SERVER_TOMCAT_MAX_THREADS
      {{- if index .Values "server-tomcat-max-threads" }} 
        value: {{ index .Values "server-tomcat-max-threads" | quote }}    
      {{- else }}        
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: server-tomcat-max-threads
      {{- end }}            
      - name: SERVER_TOMCAT_MAX_CONNECTIONS
      {{- if index .Values "server-tomcat-max-connections" }} 
        value: {{ index .Values "server-tomcat-max-connections" | quote }}    
      {{- else }}        
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: server-tomcat-max-connections
      {{- end }}                
      - name: SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE
      {{- if index .Values "spring-datasource-tomcat-max-active" }}
        value: {{ index .Values "spring-datasource-tomcat-max-active" | quote }}
      {{- else }} 
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-datasource-tomcat-max-active 
      {{- end }}       
      - name: SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE
      {{- if index .Values "spring-datasource-tomcat-max-active" }}
        value: {{ index .Values "spring-datasource-tomcat-max-active" | quote }}
      {{- else }}
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-datasource-tomcat-max-active 
      {{- end }}           
      - name: KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: kafka-brokers
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: kafka-brokers
      - name: SPRING_JPA_SHOW_SQL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-jpa-show-sql  
      - name: STATE_LEVEL_TENANTID_LENGTH
        value: "1"            
      - name: IS_ENVIRONMENT_CENTRAL_INSTANCE
        value: "false"
      - name: STATE_SCHEMA_INDEX_POSITION_TENANTID
        value: "0"
      - name: KAFKA_TOPIC_AUDIT
      {{- if index .Values "kafka.topic.audit" }}
        value: {{ index .Values "kafka.topic.audit" | quote }}
      {{- else }}
        value: "enc-user-audit-data"
      {{- end }}           
        
            
            
            
  jaeger: |             
      - name: JAEGER_SERVICE_NAME
        value: {{ template "common.name" . }}
      - name: JAEGER_SAMPLER_TYPE
        value: remote
      - name: JAEGER_AGENT_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
      - name: JAEGER_AGENT_PORT
        value: "6831"
      - name: JAEGER_SAMPLER_MANAGER_HOST_PORT
        value: "$(JAEGER_AGENT_HOST):5778"
      - name: TRACER_OPENTRACING_ENABLED
        value: "true"         
## Additional init containers
extraInitContainers: |

## Additional sidecar containers
extraContainers: |

## Add additional volumes and mounts, e. g. for custom themes
extraVolumes: |
extraVolumeMounts: |

additionalLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000            

service:
  additionalAnnotations: {}

# ── Application telemetry (#1646) ──────────────────────────────────────
# OFF BY DEFAULT, deliberately. Switching it on adds an init container and a
# JAVA_TOOL_OPTIONS javaagent to EVERY java-spring service in the deployment —
# the widest blast radius of any value in this chart. Enable it in env.yaml
# for one environment, verify pods still start and metrics arrive, then roll
# it wider.
#
# What it buys: JVM metrics for all 41 services, which this tier has none of
# today (0 of 41 charts define a ServiceMonitor, and no service exposes a
# micrometer/actuator endpoint for one to scrape). The agent exports OTLP to
# the collector, which re-exposes everything on a SINGLE Prometheus endpoint —
# so collection needs one ServiceMonitor, not 41.
#
# It also supersedes the Jaeger env this chart still injects (extraEnv.jaeger,
# below): 25 live services point at a node-local jaeger agent that is not
# deployed and, with useHostPort: false in the jaeger values, could not receive
# them if it were. Remove that block once this is on everywhere.
otel:
  enabled: false
  # Where the agent sends OTLP. Service name follows the collector release in
  # charts/monitoring/monitoring-helmfile.yaml.
  endpoint: "http://otel-collector-opentelemetry-collector.monitoring:4317"
  # Traces need a backend. This tier has none yet (jaeger is installed: false
  # and is a different architecture), so traces stay off while metrics flow.
  # Flip to "otlp" when a trace store lands, and add the traces pipeline to
  # the collector values at the same time.
  tracesExporter: "none"
  # Image carrying the javaagent jar. This is the image the OpenTelemetry
  # Operator uses for Java auto-instrumentation; it ships the jar at
  # /javaagent.jar. Pinned to match the Ansible tier's agent version
  # (local-setup/otel/download-agent.sh pins 2.11.0) so metric names and the
  # JVM dashboard line up across both tiers.
  #
  # The 2.11.0 tag is published and pullable — GHCR's package page only shows
  # recent tags by default, so check the registry, not the page. Verified
  # 2026-08-10 against ghcr.io/v2/.../manifests/2.11.0: an OCI image index at
  # sha256:b32b2153611bb11a98006d8d34c3ee91d307f491fa754ab66f5b0aff31a93a1b
  # covering linux/amd64, arm64, s390x and ppc64le. Re-check before bumping:
  # otel.enabled adds this as an init container to every service, so a bad tag
  # is ImagePullBackOff across the whole tier at once.
  agentImage: "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.11.0"
  # Path to the jar INSIDE agentImage. Configurable because it differs between
  # the operator image (/javaagent.jar) and a hand-built one.
  agentJarPath: "/javaagent.jar"

serviceMonitor:
  honorLabels: true
  # interval: 2m  

cron:
  namespace: egov
  concurrencyPolicy: Forbid
  restartPolicy: OnFailure
  httpPort: 8080
  ## Additional sidecar containers
  extraContainers: |

  ## Add additional volumes and mounts
  extraVolumes: |

  ## Add additional mounts
  extraVolumeMounts: |

vpa:
  enabled: false  
  updateMode: "Off"
