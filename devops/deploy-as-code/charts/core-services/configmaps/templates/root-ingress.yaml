{{- with index .Values "root-ingress" -}}
{{- if ne (.defaultTenantSlug | default "") "" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/app-root: /{{ .defaultTenantSlug }}/digit-ui
    kubernetes.io/ingress.class: nginx
  {{- if ne $.Values.global.setup "quickstart" }}     
    #certmanager.k8s.io/cluster-issuer: {{ index . "cert-issuer" }}
    cert-manager.io/cluster-issuer: {{ index . "cert-issuer" }}
  {{- end }}  
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  rules:
  - host: {{ $.Values.global.domain }}
    http:
      paths:
      - backend:
          service:
            name: {{ .serviceName }}
            port: 
              number: {{ .servicePort }}
        path: /
        pathType: Exact
{{- if ne $.Values.global.setup "quickstart" }}        
  tls:
  - hosts:
    - {{ $.Values.global.domain }}
    secretName: {{ $.Values.global.domain }}-tls-certs    
{{- end }}         
{{- else if and (ne (toString (index . "configuratorRedirect")) "false") (not (has "configurator" ($.Values.disabledReleases | default list))) }}
{{- /* No default tenant slug: the bare domain lands on the Configurator (sign in,
       or sign up a new workspace), as the Ansible tier's root_to_configurator.
       `/$` as a regex is an exact match: ingress-nginx runs a host in regex mode
       once any of its Ingresses uses regex (digit-ui's tenant routes do), and a
       plain `/` would then catch every unmatched path. The redirect target is
       absolute: ingress-nginx refuses a relative one. Not where the environment
       leaves configurator out (disabledReleases), as Ansible renders its redirect
       only with nginx_features.configurator. */}}
{{- $scheme := ternary "http" "https" (eq $.Values.global.setup "quickstart") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/temporal-redirect: {{ printf "%s://%s/configurator/" $scheme $.Values.global.domain | quote }}
  {{- if ne $.Values.global.setup "quickstart" }}
    cert-manager.io/cluster-issuer: {{ index . "cert-issuer" }}
  {{- end }}
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  rules:
  - host: {{ $.Values.global.domain }}
    http:
      paths:
      - backend:
          service:
            name: {{ .configuratorServiceName | default "configurator" }}
            port:
              number: {{ .configuratorServicePort | default 80 }}
        path: /$
        pathType: ImplementationSpecific
{{- if ne $.Values.global.setup "quickstart" }}
  tls:
  - hosts:
    - {{ $.Values.global.domain }}
    secretName: {{ $.Values.global.domain }}-tls-certs
{{- end }}
{{- end }}
{{- end -}}
