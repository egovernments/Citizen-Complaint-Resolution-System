bases:
  - ../environments/helmfile-environments.yaml
---
{{- /* Releases this environment turns off by name (env values `disabledReleases`,
       empty by default): every release that is otherwise always installed reads it. */ -}}
{{- $disabled := index .Values "disabledReleases" | default list }}
templates:
  default: &default
    chart: ./{{`{{ .Release.Name }}`}}
    labels:
      target: ./{{`{{ .Release.Name }}`}}
    version: 0.1.0
    namespace: egov
    # This prevents helmfile exiting when it encounters a missing file
    # Valid values are "Error", "Warn", "Info", "Debug". The default is "Error"
    # Use "Debug" to make missing files errors invisible at the default log level(--log-level=INFO)
    missingFileHandler: Warn
    values:
      - {{ .Values | toYaml | nindent 8 }}

releases:
  - name: mdms-v2
    installed: {{ not (has "mdms-v2" $disabled) }}
    <<: *default

  # /egov-mdms-service/* -> mdms-v2 path shim, as Compose/Ansible run it. Needed by
  # pgr-services' self-service onboarding (see the chart's values.yaml).
  - name: egov-mdms-service
    installed: {{ not (has "egov-mdms-service" $disabled) }}
    <<: *default
  
  - name: egov-localization
    installed: {{ not (has "egov-localization" $disabled) }}
    <<: *default

  - name: boundary-service
    installed: {{ not (has "boundary-service" $disabled) }}
    <<: *default
  
  - name: egov-accesscontrol
    installed: {{ not (has "egov-accesscontrol" $disabled) }}
    <<: *default

  - name: audit-service
    installed: {{ not (has "audit-service" $disabled) }}
    <<: *default

  - name: egov-enc-service
    installed: {{ not (has "egov-enc-service" $disabled) }}
    needs:
    - mdms-v2
    <<: *default

  - name: egov-filestore
    installed: {{ not (has "egov-filestore" $disabled) }}
    <<: *default

  - name: egov-idgen
    installed: {{ not (has "egov-idgen" $disabled) }}
    <<: *default

  - name: egov-indexer
    installed: {{ not (has "egov-indexer" $disabled) }}
    <<: *default

  - name: egov-notification-mail
    installed: {{ not (has "egov-notification-mail" $disabled) }}
    <<: *default

  # Replaced by novu-bridge, which consumes egov.core.notification.sms itself
  # (see common-services/novu-bridge). Kept for a one-release rollback.
  - name: egov-notification-sms
    installed: false
    <<: *default

  - name: egov-user
    installed: {{ not (has "egov-user" $disabled) }}
    needs:
    - egov-enc-service
    <<: *default

  - name: egov-otp
    installed: {{ not (has "egov-otp" $disabled) }}
    <<: *default
  
  - name: egov-persister
    installed: {{ not (has "egov-persister" $disabled) }}
    <<: *default

  - name: egov-url-shortening
    installed: {{ not (has "egov-url-shortening" $disabled) }}
    <<: *default

  - name: egov-workflow-v2
    installed: {{ not (has "egov-workflow-v2" $disabled) }}
    needs:
    - mdms-v2
    <<: *default

  - name: user-otp
    installed: {{ not (has "user-otp" $disabled) }}
    <<: *default

  - name: configmaps
    installed: {{ not (has "configmaps" $disabled) }}
    <<: *default

  # service-request / pdf-service: not used by CCRS — zero callers in pgr-services, the
  # digit-ui app (Utilities/PGR modules), or configs. Disabled to cut footprint + attack
  # surface. Re-enable if a future CCRS feature needs them.
  - name: service-request
    installed: false
    <<: *default

  - name: pdf-service
    installed: false
    <<: *default
  
  - name: gateway
    installed: {{ not (has "gateway" $disabled) }}
    <<: *default
  
  - name: boundary-bulk-bff
    installed: {{ not (has "boundary-bulk-bff" $disabled) }}
    <<: *default






  # Post-deploy Job: provision ADMIN/GRO/INTERNAL_USER via the egov-user API so
  # they are encrypted with THIS deployment's key (the dump's users use the
  # compose key and are unusable here) and ADMIN gets ACCOUNT_ADMIN for onboarding.
  - name: user-bootstrap
    installed: {{ not (has "user-bootstrap" $disabled) }}
    <<: *default
