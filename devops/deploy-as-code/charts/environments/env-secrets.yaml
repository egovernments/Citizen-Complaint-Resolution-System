    # Novu (#1644). The chart ships the upstream project's EXAMPLE values;
    # generate real ones per deployment. jwtSecret signs session tokens — a
    # known value lets a session be forged with no password. storeEncryptionKey
    # encrypts the stored SMS/email provider credentials and MUST be exactly
    # 32 characters. Rotate anything encrypted under a placeholder key.
    #
    # The values below are placeholders and the deploy WILL FAIL until they are
    # replaced (#1676) — novu/templates/secret.yaml refuses any `change-me`
    # value by name, the same way db-seed refuses the `<...>` placeholders in
    # env.yaml. That is deliberate: this file is not SOPS-encrypted, so a
    # placeholder left in place is a signing key published in this repository.
    # Prefer novu.secrets.existingSecret and keep the values out of git
    # entirely; see backbone-services/novu/values.yaml for the kubectl command.
    # Self-hosted Matomo (#1254). Only read when the `matomo` release in
    # backboneservices-helmfile.yaml is flipped to installed: true.
    #
    # Matomo is PHP + MySQL and cannot use the platform's Postgres, so the
    # chart brings its own MariaDB — dbPassword/dbRootPassword below belong to
    # THAT database, not to `secrets.db` above.
    matomo:
        # Matomo's superuser. The chart installs Matomo unattended
        # (matomoUsername / matomoPassword / matomoEmail), so unlike the compose
        # tier there is no browser wizard and this value IS the admin login.
        #
        # DELIBERATELY EMPTY, and a render error rather than a default. This
        # file is committed, unencrypted and not gitignored, so a placeholder
        # that shipped as a working password would publish /matomo with
        # credentials readable straight out of the repository the moment someone
        # flipped the release to installed: true. And an empty value is not safe
        # either — the chart would mint a new random password on every render,
        # so no operator would ever hold a working one. The chart's
        # validate-credentials.yaml therefore refuses both.
        #
        # Preferred instead of a password here: name a Kubernetes Secret with a
        # matomo-password key, created out of band, and nothing
        # credential-shaped is committed at all.
        #   existingSecret: matomo-admin
        existingSecret: ""
        password: ""
        # Matomo's own MariaDB — NOT the platform Postgres in secrets.db above.
        # Set these before the first apply: MariaDB bakes them in at
        # initialisation and only ALTER USER changes them afterwards.
        dbPassword: ""
        dbRootPassword: ""
    novu:
        jwtSecret: change-me-strong
        storeEncryptionKey: change-me-exactly-32-characters!
        novuSecretKey: change-me-strong
    grafana:
        clientID: cdabbaabcdefghi
        clientSecret: 8292723f0e1d596d234abc123def456
        # Local admin login (#1650). Grafana is published at /monitoring with
        # no ingress-level auth, so this is a real credential, not a fallback.
        #
        # It is deliberately NOT written here. This file is committed and
        # unencrypted -- there is no SOPS anywhere under devops/deploy-as-code,
        # and .gitignore covers only the ansible tier's per-tenant secrets -- so
        # a password put here enters git history and stays there after rotation.
        #
        # Instead, create a Kubernetes Secret in the monitoring namespace with
        # keys `admin-user` and `admin-password` (sealed-secret,
        # external-secret, or OpenBao/vault-synced -- whichever this
        # environment already uses) and name it below. Grafana's chart reads
        # both keys via secretKeyRef and then creates no Secret of its own:
        #
        #   kubectl -n monitoring create secret generic grafana-admin \
        #     --from-literal=admin-user=admin \
        #     --from-literal=admin-password="$(openssl rand -base64 24)"
        #
        adminExistingSecret: grafana-admin
        # Escape hatch for throwaway clusters only: blank adminExistingSecret
        # above and put a literal here. Anything written here is committed in
        # cleartext -- treat it as public and rotate it.
        #
        # Leaving BOTH empty is a render error rather than a default, because
        # the chart's own fallback is `randAlphaNum 40` evaluated at render
        # time: every helmfile run would mint a different admin password and
        # the operator would never hold a working one.
        adminPassword: ""
    # NOTE (#1640): there is deliberately no `alertmanager:` block here.
    #
    # One used to sit at secrets.alertmanager.config -- a full copy of the
    # Alertmanager routing config, complete with an <smtp_password> placeholder.
    # Nothing read it. kube-prometheus-stack reads `alertmanager.config` at the
    # top level, not under `secrets.`, so that block was inert: it looked like
    # the secret had a safe home in the SOPS-covered file while the credential
    # that actually shipped was a plaintext literal in
    # charts/monitoring/values/prometheus.yaml. That appearance is why the real
    # one went unnoticed, so the dead copy is removed rather than corrected.
    #
    # The SMTP password now comes from a Kubernetes Secret mounted into the
    # Alertmanager pods and read via auth_password_file. See the comment beside
    # auth_password_file in charts/monitoring/values/prometheus.yaml for the
    # exact `kubectl create secret` command.
