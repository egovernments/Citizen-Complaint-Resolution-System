  distUrl: "https://<assets_s3_bucket>.s3.ap-south-1.amazonaws.com/deploy/digit-ui-v2-<tenant_id>.tgz"

ingress-nginx:
  default-backend-service: "egov/nginx"
  namespace: egov
  cert-issuer: "letsencrypt-prod"
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "EECDH+CHACHA20:EECDH+AES"
  ssl-ecdh-curve: "X25519:prime256v1:secp521r1:secp384r1"
  controller:
    replicas: 1
    # Unlike the keys around it, this subtree IS read: the vendored chart's
    # templates/_helpers.tpl merges .Values["ingress-nginx"] over the root
    # context (a local modification, not in upstream 4.10.0). So `enabled:
    # false` here was really switching gateway metrics off (#1648), and it beat
    # even a --set on the release. The helmfile pins the same three values.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      # Deliberately false: the chart's prometheusRule.rules list is empty, so
      # this renders a PrometheusRule whose spec is null, which the CRD rejects.
      prometheusRule:
        enabled: false
    addHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      X-XSS-Protection: "1; mode=block"
      # A placeholder, NOT a template (#1648). This file is plain YAML at this
      # point -- nothing interpolates it -- so `<domain_name>` is the same
      # manual-substitution convention as global.domain on line 2 and the other
      # `<domain_name>` placeholders here. One sed keeps them in sync.
      #
      # It used to name urban-lts.digit.org, a DIFFERENT environment's hostname
      # inherited from the upstream import. That was live, not inert: addHeaders
      # is one of the keys the chart's patched _helpers.tpl hoists out of this
      # block, so every response advertised a foreign origin as the only
      # allowed one, breaking CORS for this deployment's own SPA.
      Access-Control-Allow-Origin: "https://<domain_name>"
      Access-Control-Allow-Methods: "GET, POST, OPTIONS"
      Access-Control-Allow-Headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    # Not read by anything (#1648). The default TLS certificate is set by
    # --default-ssl-certificate in _params.tpl, which derives it from
    # `domain` -- passed in by the helmfile from global.domain. Kept only to
    # record that the key is inert; the value named another environment.
    # setSslTls: "<domain_name>-tls-certs"
