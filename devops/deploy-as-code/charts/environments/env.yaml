global:
  domain: <domain_name> ## Add your Domain Name "Eg: site.mydomain.com" Do not use the dummy domain
# ──────────────────────────────────────────────────────────────────────
# Monitoring (#1619). Every component is OFF by default -- turn on only what
# this deployment actually needs. A site with limited capacity can run metrics
# alone and still get alerting; a full stack is all six set to true.
#
# Nothing here deploys unless ./charts/monitoring/monitoring-helmfile.yaml is
# listed in digit-helmfile.yaml (it is, as of #1619).
#
# Rough order of value if you are picking a subset:
#   1. metrics    -- without it nothing else has data to work from
#   2. dashboards -- makes the metrics legible
#   3. logs       -- answers "why", once metrics tell you "what"
#   4. probes     -- catches TLS expiry and outside-in failures
#   5. traces     -- only worth it when chasing latency across services
monitoring:
  # kube-prometheus-stack: Prometheus, Alertmanager, node-exporter,
  # kube-state-metrics. The foundation -- enable this first.
  metrics: false
  # loki-stack: Loki + Promtail. Log aggregation and search.
  logs: false
  # Grafana. Has nothing to query on its own, so enable it alongside
  # metrics and/or logs.
  dashboards: false
  # blackbox-exporter: external HTTP/TLS probing, including certificate
  # expiry (#1649). Cheap; catches failures from outside the cluster.
  probes: false
  # Jaeger distributed tracing. Requires an Elasticsearch backend, which makes
  # it much the most expensive item here -- leave off unless you want traces.
  traces: false
  # Kafka UI. NOT monitoring: a write-capable Kafka admin console that happens
  # to live in the same helmfile. Treat enabling it as an access-control
  # decision, not an observability one.
  kafkaUi: false

