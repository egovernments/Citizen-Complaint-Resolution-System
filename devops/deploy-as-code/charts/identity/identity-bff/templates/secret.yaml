{{- /*
Rendered only when secret.existingSecret is empty (the escape hatch; see
values.yaml). Placeholders are refused as in
charts/backbone-services/novu/templates/secret.yaml.
*/ -}}
{{- $_ := include "common.name" . }}
{{- if not .Values.secret.existingSecret }}
{{- $values := .Values.secret.values | default dict }}
{{- $required := include "identity-bff.requiredSecrets" . | fromYaml }}
{{- $optional := include "identity-bff.optionalSecrets" . | fromYaml }}
{{- range $key, $_ := $required }}
{{- if not (index $values $key) }}
{{- fail (printf "identity-bff: secret key %q is required. Set secrets.identity.values.%s in environments/env-secrets.yaml, or point secrets.identity.existingSecret at a Secret created out of band." $key $key) }}
{{- end }}
{{- end }}
{{- range $key, $value := $values }}
{{- if regexMatch "^<.*>$" (toString $value) }}
{{- fail (printf "identity-bff: secret key %q is still the placeholder %q." $key (toString $value)) }}
{{- end }}
{{- if regexMatch "(?i)^(dev-only-)?change-me" (toString $value) }}
{{- fail (printf "identity-bff: secret key %q is still an example value published in this repository." $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "identity-bff.secretName" . }}
  labels:
{{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key := concat (keys $required) (keys $optional) | sortAlpha }}
{{- if index $values $key }}
  {{ $key }}: {{ index $values $key | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
