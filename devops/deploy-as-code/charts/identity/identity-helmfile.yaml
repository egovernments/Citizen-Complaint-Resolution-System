# Identity stack: Keycloak and the Identity BFF (/identity/v1).
#
# OFF unless `identity.enabled: true` in charts/environments/env.yaml. Once
# legacy identity is removed (#2271) every digit-ui sign-in goes through the BFF
# and Keycloak, so with this off nobody can sign in: on such a release it is
# REQUIRED. See docs/setup/deployment/helm-identity.md.
#
# Values are release-scoped (deploy-as-code/README.md: "prefer a release-scoped
# block over a new top-level key"): each chart gets `global`, the shared
# `identity` settings, its own overrides from identity.keycloak /
# identity.identity-bff, and the secret reference from secrets.identity — not
# the whole env.yaml tree.
environments:
  env:
    values:
      # Defaults for the keys read below, listed BEFORE env.yaml so it
      # overrides them and so they always exist (same reason as
      # charts/monitoring/monitoring-helmfile.yaml).
      - identity:
          enabled: false
      - ../environments/env-secrets.yaml
      - ../environments/env.yaml
  # cms-saas.digit.org: env.yaml + environments/cms-saas.yaml, and the real
  # secrets from the git-ignored cms-saas-secrets.yaml (scripts/cms-saas-secrets-from-cluster.sh).
  cms-saas:
    values:
      # Defaults for the keys read below, listed BEFORE env.yaml so it
      # overrides them and so they always exist (same reason as
      # charts/monitoring/monitoring-helmfile.yaml).
      - identity:
          enabled: false
      - ../environments/env-secrets.yaml
      - ../environments/cms-saas-secrets.yaml
      - ../environments/env.yaml
      - ../environments/cms-saas.yaml
---
{{- /* Read defensively, as monitoring-helmfile.yaml does: helmfile renders
       with missingkey=error and CI pins helmfile v0.140.0 (no sprig `dig`). An
       `identity:` that is not a map is a typo for "turn identity on"; failing
       beats silently uninstalling the stack. */ -}}
{{- $id := dict }}
{{- if hasKey .Values "identity" }}
{{-   if not (kindIs "map" (index .Values "identity")) }}
{{-     fail "`identity:` in charts/environments/env.yaml must be a map (enabled, realm, publicUrl, ...), not a single value" }}
{{-   end }}
{{-   $id = .Values.identity }}
{{- end }}
{{- $enabled := index $id "enabled" | default false }}
{{- $namespace := "egov" }}
{{- /* Where identity-bff reaches Keycloak: the keycloak chart's Service name
       (common.name: its `name` override, else the chart name), this
       namespace and its httpPort, read from the same identity.keycloak
       overrides the keycloak release gets. Both charts build the URL with
       common.identity.keycloakUrl, and the keycloak chart fails the render if
       these do not match its Service. The defaults are the chart's. */ -}}
{{- $kcOverrides := index $id "keycloak" | default dict }}
{{- $keycloak := dict
      "service" (index $kcOverrides "name" | default "keycloak")
      "namespace" $namespace
      "httpPort" (index $kcOverrides "httpPort" | default 8180) }}
{{- $shared := dict
      "realm" (index $id "realm" | default "digit")
      "publicUrl" (index $id "publicUrl" | default "")
      "postLoginRedirect" (index $id "postLoginRedirect" | default "")
      "allowedOrigins" (index $id "allowedOrigins" | default "")
      "keycloak" $keycloak }}
{{- /* secrets.identity in env-secrets.yaml: existingSecret (preferred) or
       values (escape hatch). Both charts get the same block, so Keycloak's
       clients and the BFF share one value per secret. */ -}}
{{- $sec := dict }}
{{- if and (hasKey .Values "secrets") (hasKey .Values.secrets "identity") }}
{{-   $sec = index .Values.secrets "identity" }}
{{- end }}
{{- $secret := dict "existingSecret" (index $sec "existingSecret" | default "") "values" (index $sec "values" | default dict) }}
{{- /* identity-bootstrap (identity.bootstrap.enabled, off by default): creates
       identity-secrets, pgr-onboarding, Keycloak's database and the two DIGIT
       employees instead of the manual "Before enabling" steps. It needs the
       existingSecret path: it writes the Secret the charts then read. The
       employees are the BFF's DIGIT_ADMIN_USERNAME and pgr-services'
       onboarding provisioner, read from where those are configured. */ -}}
{{- $boot := index $id "bootstrap" | default dict }}
{{- $bootstrap := and $enabled (index $boot "enabled" | default false) }}
{{- if and $bootstrap (eq $secret.existingSecret "") }}
{{-   fail "identity.bootstrap.enabled needs secrets.identity.existingSecret: the bootstrap writes that Secret" }}
{{- end }}
{{- $bffConfig := index (index $id "identity-bff" | default dict) "config" | default dict }}
{{- $pgr := index .Values "pgr-services" | default dict }}
{{- $pgrOnboarding := index $pgr "onboarding" | default dict }}
{{- $kcConfigure := index $kcOverrides "configure" | default dict }}
{{- $kcSmtp := index $kcConfigure "smtp" | default dict }}
{{- $kcDb := index $kcOverrides "db" | default dict }}

releases:
  # Keycloak's database and identity-secrets must exist before Keycloak starts.
  - name: identity-bootstrap
    chart: ./identity-bootstrap
    namespace: {{ $namespace }}
    installed: {{ $bootstrap }}
    missingFileHandler: Warn
    wait: true
    # Above the Job's activeDeadlineSeconds (900 s, egov-user's start included).
    timeout: 1200
    values:
      - identitySecret: {{ $secret.existingSecret | quote }}
        onboardingSecret: {{ index $pgrOnboarding "secretName" | default "pgr-onboarding" | quote }}
        smtpAuth: {{ index $kcSmtp "auth" | default false }}
        keycloakDb:
          database: {{ index $kcDb "database" | default "keycloak" | quote }}
          username: {{ index $kcDb "username" | default "keycloak" | quote }}
        adminUsername: {{ index $bffConfig "DIGIT_ADMIN_USERNAME" | default "ADMIN" | quote }}
        provisionerUsername: {{ index $pgrOnboarding "provisionerUsername" | default "PGR_PROVISIONER" | quote }}
      - {{ omit $boot "enabled" | toYaml | nindent 8 }}

  # Ready before the BFF starts: the BFF's readiness needs the realm the
  # keycloak release's post-install Job creates.
  - name: keycloak
    chart: ./keycloak
    namespace: {{ $namespace }}
    installed: {{ $enabled }}
    missingFileHandler: Warn
    {{- if $bootstrap }}
    needs:
      - identity-bootstrap
    {{- end }}
    wait: true
    # Helm applies this to each wait in turn: the Deployment's readiness (a
    # first start runs Keycloak's database migrations), then the realm-configure
    # hook Job. It must exceed the Job's configure.activeDeadlineSeconds
    # (keycloak/values.yaml, 600 s, all retries included) so the Job, not Helm,
    # decides when the reconcile has failed: a Helm timeout first would fail the
    # release with the Job still running and skip identity-bff (needs: keycloak).
    # local-setup/tests/static/helm-identity.test.ts checks the ordering.
    timeout: 900
    values:
      - global:
          {{- .Values.global | toYaml | nindent 10 }}
        identity:
          {{- $shared | toYaml | nindent 10 }}
        secret:
          {{- $secret | toYaml | nindent 10 }}
      - {{ $kcOverrides | toYaml | nindent 8 }}

  - name: identity-bff
    chart: ./identity-bff
    namespace: {{ $namespace }}
    installed: {{ $enabled }}
    missingFileHandler: Warn
    needs:
      - keycloak
    values:
      - global:
          {{- .Values.global | toYaml | nindent 10 }}
        identity:
          {{- $shared | toYaml | nindent 10 }}
        secret:
          {{- $secret | toYaml | nindent 10 }}
      - {{ index $id "identity-bff" | default dict | toYaml | nindent 8 }}
