{{- /*
Rendered only when secret.existingSecret is empty (the escape hatch; see
values.yaml). Same refusal of published placeholders as
charts/backbone-services/novu/templates/secret.yaml: a forgotten override is
not blank, it is the example string, and a known client secret or admin
password is a working credential for anyone who reads this repository.
*/ -}}
{{- if not .Values.secret.existingSecret }}
{{- $values := .Values.secret.values | default dict }}
{{- $required := list "keycloak-db-password" "keycloak-admin-password" "keycloak-bff-client-secret" "keycloak-admin-client-secret" "keycloak-employee-client-secret" "keycloak-citizen-client-secret" }}
{{- $optional := list "keycloak-magic-link-client-secret" "keycloak-smtp-password" "keycloak-google-client-secret" "keycloak-github-client-secret" }}
{{- range $key := $required }}
{{- if not (index $values $key) }}
{{- fail (printf "keycloak: secret key %q is required. Set secrets.identity.values.%s in environments/env-secrets.yaml, or point secrets.identity.existingSecret at a Secret created out of band." $key $key) }}
{{- end }}
{{- end }}
{{- range $key, $value := $values }}
{{- if regexMatch "^<.*>$" (toString $value) }}
{{- fail (printf "keycloak: secret key %q is still the placeholder %q." $key (toString $value)) }}
{{- end }}
{{- if regexMatch "(?i)^(dev-only-)?change-me" (toString $value) }}
{{- fail (printf "keycloak: secret key %q is still an example value published in this repository." $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.secretName" . }}
  labels:
{{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key := concat $required $optional }}
{{- if index $values $key }}
  {{ $key }}: {{ index $values $key | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
