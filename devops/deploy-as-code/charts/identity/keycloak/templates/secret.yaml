{{- /*
Rendered only when secret.existingSecret is empty (the escape hatch; see
values.yaml). Required keys and published placeholders are checked by
common.refuseSecretPlaceholders (charts/common), shared with identity-bff.
*/ -}}
{{- if not .Values.secret.existingSecret }}
{{- $values := .Values.secret.values | default dict }}
{{- $required := list "keycloak-db-password" "keycloak-admin-password" "keycloak-bff-client-secret" "keycloak-admin-client-secret" "keycloak-employee-client-secret" "keycloak-citizen-client-secret" }}
{{- $optional := list "keycloak-magic-link-client-secret" "keycloak-smtp-password" "keycloak-google-client-secret" "keycloak-github-client-secret" }}
{{- include "common.refuseSecretPlaceholders" (dict "chart" "keycloak" "secrets" "secrets.identity" "values" $values "required" $required) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.secretName" . }}
  labels:
{{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key := concat $required $optional }}
{{- if index $values $key }}
  {{ $key }}: {{ index $values $key | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
