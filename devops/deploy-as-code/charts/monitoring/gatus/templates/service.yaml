apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: {{ .Values.namespace }}
  labels:
    app: gatus
spec:
  selector:
    app: gatus
  ports:
    # The /status ingress targets the sidecar proxy, which rewrites the SPA and
    # forwards to Gatus. Port 8080 stays exposed for direct port-forward/debug.
    - name: proxy
      port: {{ .Values.proxyPort | default 8081 }}
      targetPort: {{ .Values.proxyPort | default 8081 }}
    - name: http
      port: {{ .Values.gatusPort | default 8080 }}
      targetPort: {{ .Values.gatusPort | default 8080 }}
