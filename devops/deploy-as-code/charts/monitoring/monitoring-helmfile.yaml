environments:
  env:
    values:
      - namespace: monitoring
      - ../environments/env-secrets.yaml
      - ../environments/env.yaml
---
repositories:
- name: grafana
  url: https://grafana.github.io/helm-charts
- name: prometheus-community
  url: https://prometheus-community.github.io/helm-charts
- name: jaegertracing
  url: https://jaegertracing.github.io/helm-charts
- name: kafka-ui
  url: https://provectus.github.io/kafka-ui-charts
- name: apm-server
  url: https://helm.elastic.co
- name: apm-attacher
  url: https://helm.elastic.co

releases:
- name: loki-stack
  installed: true
  namespace: {{ .Values.namespace | default "default-namespace" }}
  chart: grafana/loki-stack
  version: 2.10.1
  values:
  - ./values/loki-stack.yaml
  - {{ .Values | toYaml | nindent 8 }}

- name: kube-prometheus-stack
  installed: true
  namespace: {{ .Values.namespace | default "default-namespace" }}
  chart: prometheus-community/kube-prometheus-stack
  version: 56.6.2
  disableValidation: true
  values:
  - ./values/prometheus.yaml
  - {{ .Values | toYaml | nindent 8 }}

- name: jaeger
  installed: false
  namespace: es-cluster
  chart: jaegertracing/jaeger
  version: 0.35.0
  values:
  - ./values/jaeger.yaml
  - {{ .Values | toYaml | nindent 8 }}
  - storage:
      elasticsearch:
        password: {{ .Values.secrets.elasticsearch.password }}
  set:
    - name: query.ingress.hosts[0]
      value: "{{ .Values.global.domain }}"

- name: grafana
  installed: true
  namespace: {{ .Values.namespace | default "default-namespace" }}
  chart: grafana/grafana
  version: 7.3.0
  values:
  - ./values/grafana.yaml
  - grafana.ini:
      auth.github:
        allowed_organizations: {{ .Values.grafana.github.allowed_organizations }}
        role_attribute_path: {{ .Values.grafana.github.role_attribute_path }}
  # Grafana's override convention is GF_<SECTION>_<KEY>, so auth.github /
  # client_id is GF_AUTH_GITHUB_CLIENT_ID (#1650). The name used previously —
  # GF_AUTH_GITHUB_YAMLAPPLICATIONCONFIG_AUTH_OAUTH2_CLIENT_GITHUB_CLIENTID —
  # matches no Grafana setting and was silently ignored; it is copy-paste debris
  # from kafka-ui's yamlApplicationConfig.auth.oauth2.client.github.clientId.
  # The line below it already used the correct form for the secret, so OAuth had
  # a secret and no client id: the provider could never complete a login.
  #
  # GF_SECURITY_ADMIN_PASSWORD is set from the same secrets file. Without it the
  # chart falls back to its own default for the `admin` account, on an instance
  # published at /monitoring with no ingress-level auth — so a broken OAuth
  # provider left a local login form as the only door, with an unmanaged
  # password behind it.
  - envRenderSecret:
      GF_AUTH_GITHUB_CLIENT_ID: {{ .Values.secrets.grafana.clientID }}
      GF_AUTH_GITHUB_CLIENT_SECRET: {{ .Values.secrets.grafana.clientSecret }}
      GF_SECURITY_ADMIN_PASSWORD: {{ .Values.secrets.grafana.adminPassword }}
  set:
    - name: ingress.hosts[0]
      value: {{ .Values.global.domain | quote }}
    - name: ingress.tls[0].hosts[0]
      value: {{ .Values.global.domain | quote }}

- name: dashboards
  # Vendored Grafana dashboards as labelled ConfigMaps (#1650). A local chart,
  # not an upstream one -- it exists only to turn the JSON files in this repo
  # into ConfigMaps the grafana sidecar can pick up.
  #
  # NOTE for whoever merges #1675 (per-component monitoring toggles): this
  # should be gated alongside grafana, i.e. on monitoring.dashboards. Left
  # ungated here only because that toggle block does not exist on this branch.
  # Deploying it unconditionally is harmless in the meantime -- they are inert
  # ConfigMaps until a Grafana with the sidecar reads them.
  installed: true
  namespace: {{ .Values.namespace | default "default-namespace" }}
  chart: ./dashboards
  version: 0.1.0

- name: blackbox
  installed: false
  namespace: {{ .Values.namespace | default "default-namespace" }}
  chart: prometheus-community/prometheus-blackbox-exporter
  version: 8.2.0
  values:
  - ./values/blackbox-exporter.yaml
  - {{ .Values | toYaml | nindent 8 }}

- name: kafka-ui
  installed: true
  namespace: backbone
  chart: kafka-ui/kafka-ui
  version: 0.7.6
  values:
  - ./values/kafka-ui.yaml
  - {{ .Values | toYaml | nindent 8 }}
  set:
    - name: ingress.host
      value: {{ .Values.global.domain | quote }}
    - name: ingress.tls.secretName
      value: {{ printf "%s-tls-certs" .Values.global.domain | quote }}
