# Guardrails for OpenSRE on CCRS (docker-compose.opensre.yml).
#
# OpenSRE scans every message against these rules immediately before each LLM
# API call and replaces matches with [REDACTED:<rule name>], so whatever a tool
# fetched — a Loki line, a Grafana panel, a Kafka error — reaches the model
# provider with these masked. Patterns are case-insensitive regexes. YAML
# single quotes keep backslashes literal; a quote inside one is written ''.
#
# Why these exist:
#   - Kong's auth-enrichment call puts the live session token in a query string
#     (/user/_details?access_token=...), and egov-user-proxy's nginx access log
#     carries it into Loki. Unmasked, every investigation that reads that log
#     would export working credentials.
#   - DIGIT request and response bodies carry citizen mobile numbers, usernames
#     (usually the mobile number) and email addresses.
#   - Deploy and service logs can carry OpenBao tokens, Novu API keys,
#     credentials inside database URLs, and OTP codes.
#
# Not covered, because no pattern can match them: names and free-text complaint
# descriptions. The sweep prompt keeps the agent on infrastructure, but a log
# line can still contain them.
#
# Order matters: OpenSRE stops scanning a message after 1000 matches, and the
# rules it has not reached by then are not applied to that message at all. So
# every credential rule comes first, and the broad citizen-contact rules
# (phone numbers match plenty of counters too) come last.
#
# Escaped text: OpenSRE masks the conversation as one text, in which a tool
# result is JSON-encoded, and a JSON log line inside it is encoded again. A
# field reads \\\"password\\\":\\\"...\\\" there, and a newline inside a log line is
# \\n. So the field rules allow any run of backslashes before a quote
# (\\*["']) and treat an escaped newline or tab as whitespace (\\+[nrt]).
#
# Test a change inside the running container before relying on it:
#   docker exec digit-opensre opensre guardrails test 'GET /user/_details?access_token=abc'
# and add samples to local-setup/tests/static/opensre-guardrails.test.ts, which
# checks each one raw and JSON-encoded once and twice.
rules:
  - name: jwt
    description: JSON Web Tokens
    action: redact
    patterns:
      - 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'

  - name: session_token
    description: access/refresh/auth tokens in query strings, headers and JSON
    action: redact
    patterns:
      - '(?:access|refresh|auth|id)[_-]?token(?:\\*["''])?\s*[=:]\s*(?:\\*["''])?[^&"''\s,}]+'

  - name: authorization_header
    description: Bearer, Basic, ApiKey (Novu) and Token credentials
    action: redact
    patterns:
      - 'authorization(?:\\*["''])?\s*[:=]\s*(?:\\*["''])?(?:bearer|basic|apikey|token|digest)\s+[A-Za-z0-9._~+/=-]+'

  - name: secret_fields
    description: password, secret and API-key fields
    action: redact
    patterns:
      # A quoted value is masked whole, so a password with a space or comma in
      # it does not leak its tail.
      # The keyword may be followed by more of the name, so env-style names
      # match too: NOVU_SECRET_KEY=, IDENTITY_CREDENTIAL_KEYS=, ENC_MASTER_SALT=,
      # IDENTITY_CONTROL_PLANE_TOKEN=, AWS_KEY=. `_key` needs a letter or digit
      # before it and no letter after, so KEYCLOAK_URL= is left alone. Not
      # matched: Kubernetes references that name a Secret rather than hold one
      # (secretKeyRef:, secretRef:, secretName:) and token counts (max_tokens:).
      - '(?:password|passwd|secret(?!keyref|ref\b|name\b)|salt|api[_-]?key|apikey|private[_-]?key|credential|(?<=[a-z0-9])_token(?!s)|(?<=[a-z0-9])_keys?(?![a-z]))[a-z0-9_]*(?:\\*["''])?\s*[=:]\s*(?:\\*"[^"]*"|\\*''[^'']*''|[^&"''\s,}]+)'

  - name: env_secret_pairs
    description: env entries written as a name/value pair whose name says it holds a secret
    action: redact
    patterns:
      # Kubernetes and Python forms, where a quote and a comma or a newline sit
      # between the name and its value, so secret_fields cannot see them:
      #   {"name":"DB_PASSWORD","value":"s3cr3t"}
      #   {'name': 'DB_PASSWORD', 'value': 's3cr3t'}
      #   - name: DB_PASSWORD
      #     value: s3cr3t
      # The whole pair is masked, name included. valueFrom (a secretKeyRef)
      # carries no value and is left alone.
      - 'name(?:\\*["''])?\s*[:=]\s*(?:\\*["''])?[a-z0-9_.-]*(?:password|passwd|secret|salt|token|api[_-]?key|private[_-]?key|credential|_keys?(?![a-z]))[a-z0-9_.-]*(?:\\*["''])?(?:\s|\\+[nrt])*,?(?:\s|\\+[nrt])*(?:\\*["''])?value(?:\\*["''])?\s*[:=]\s*(?:\\*"[^"]*"|\\*''[^'']*''|[^\s,}]+)'

  - name: vault_token
    description: OpenBao/Vault tokens, in the X-Vault-Token header or bare
    action: redact
    patterns:
      - 'x-vault-token(?:\\*["''])?\s*[:=]\s*(?:\\*["''])?[^&"''\s,}]+'
      - '\bhv[sbr]\.[A-Za-z0-9_-]{20,}'
      - '\b[sbr]\.[A-Za-z0-9]{24}\b'

  - name: url_credentials
    description: user:password@ in connection strings and URLs (postgresql://, redis://, amqp://)
    action: redact
    patterns:
      - '\b[a-z][a-z0-9+.-]*://[^/\s:@]+:[^/\s@]+@'

  - name: provider_keys
    description: Anthropic and other sk- style API keys
    action: redact
    patterns:
      - 'sk-(?:ant-)?[A-Za-z0-9_-]{20,}'

  - name: otp_code
    description: one-time passwords in notification and OTP-service logs
    action: redact
    patterns:
      - '\botp\D{0,20}?\d{4,8}\b'

  - name: citizen_contact_fields
    description: DIGIT fields that hold a citizen's phone, username or email
    action: redact
    patterns:
      # A quoted value is masked whole: "+258 84 123 4567" has spaces in it.
      - '(?:mobile(?:_?number|no)?|phone(?:_?number)?|recipient(?:_value)?|username|emailid)(?:\\*["''])?\s*[=:]\s*(?:\\*"[^"]*"|\\*''[^'']*''|[^&"''\s,}]+)'

  - name: email
    description: email addresses
    action: redact
    patterns:
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'

  - name: phone_number
    description: Kenyan, Mozambican and Indian mobile numbers, with or without country code
    action: redact
    # Local formats: Kenya 07xx/01xx (10 digits), Mozambique 82-87 (9 digits,
    # how maputo logs them), India 6-9 (10 digits). Spaces or dashes may sit
    # between digit groups after a +code. A 9- or 10-digit counter that happens
    # to look like a mobile number (a Kafka offset, a byte count) is masked too;
    # that costs the agent the value, never a citizen their number.
    patterns:
      - '\+(?:254|258)(?:[ -]?\d){9}\b'
      - '\+91(?:[ -]?\d){10}\b'
      - '(?<!\+)\b(?:254|258)\d{9}\b'
      - '(?<!\+)\b91\d{10}\b'
      - '\b0[17]\d{8}\b'
      - '\b8[2-7]\d{7}\b'
      - '\b[6-9]\d{9}\b'
