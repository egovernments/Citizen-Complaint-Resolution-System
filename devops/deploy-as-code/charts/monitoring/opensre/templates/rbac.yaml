{{- if .Values.rbac.create }}
# Read-only cluster access for the agent.
#
# get/list only, and no secrets: the agent is diagnose-only, so it must never
# be able to change a workload or read a credential. This is what gives the
# Kubernetes tier the view the compose tier lacks — pod restart counts, OOM
# kills and crash-loop events come from here rather than from Docker.
#
# Cluster-scoped rather than a Role per namespace: an incident rarely respects
# namespace boundaries (a pod in `egov` failing because a node is under
# pressure, or backbone Postgres is down), and nodes/namespaces are
# cluster-scoped resources anyway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: opensre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensre-read
  labels:
    app: opensre
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces", "nodes", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opensre-read
  labels:
    app: opensre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opensre-read
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.serviceAccountName }}
    namespace: {{ .Values.namespace }}
{{- end }}
