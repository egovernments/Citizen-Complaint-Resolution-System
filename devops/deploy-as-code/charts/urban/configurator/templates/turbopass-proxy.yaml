{{- /*
  Same-origin /turbopass, proxied to a shared Turbopass elsewhere: the Ansible
  tier serves /turbopass from the box (enable_turbopass), and the SPA's default
  TURBOPASS_URL is exactly that path. With turbopassProxy.host set, this
  cluster answers /turbopass/* from https://<host>/turbopass/* instead of
  running its own search-api. Read from the wholesale values like runtimeConfig.
*/ -}}
{{- $proxy := merge (dict) ((index .Values .Chart.Name | default dict).turbopassProxy | default dict) (.Values.turbopassProxy | default dict) -}}
{{- if $proxy.host }}
{{- $ns := .Values.namespace | default .Release.Namespace }}
apiVersion: v1
kind: Service
metadata:
  name: turbopass-upstream
  namespace: {{ $ns }}
  labels:
    app: configurator
spec:
  type: ExternalName
  externalName: {{ $proxy.host | quote }}
  ports:
    - name: https
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: turbopass-proxy
  namespace: {{ $ns }}
  labels:
    app: configurator
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: {{ printf "%s/$2" ($proxy.path | default "/turbopass") | quote }}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/upstream-vhost: {{ $proxy.host | quote }}
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: {{ $proxy.host | quote }}
    {{- if ne ((.Values.global | default dict).setup | default "") "quickstart" }}
    cert-manager.io/cluster-issuer: {{ index .Values "ingress-nginx" "cert-issuer" | default "letsencrypt-prod" }}
    {{- end }}
spec:
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /turbopass(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: turbopass-upstream
                port:
                  number: 443
  {{- if ne ((.Values.global | default dict).setup | default "") "quickstart" }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.global.domain }}-tls-certs
  {{- end }}
{{- end }}
