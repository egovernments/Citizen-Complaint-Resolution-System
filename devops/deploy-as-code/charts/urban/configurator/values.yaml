# Common Labels
labels:
  app: "configurator"
  group: "web"

# Ingress Configs
# The SPA is served under /configurator/ (its image bakes that base path) and
# auto-detects the DIGIT API base from window.location.origin, so it talks to
# the same-origin gateway with each user's own OAuth token — same public-SPA
# model as digit-ui. No API base is baked at build time.
ingress:
  enabled: true
  context: "configurator"

# Init Containers Configs
initContainers: {}

# Container Configs
# Tenant-neutral CI image (no VITE_* baked); tag tracks the compose/ansible
# default (CONFIGURATOR_IMAGE in local-setup) so every tier runs the same build.
image:
  repository: "configurator"
  tag: "2.12.1-6e8adb3"
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/configurator/"
  readinessProbePath: "/configurator/"

# Static nginx SPA — a small, fixed footprint.
resources: |
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    memory: 64Mi

# Runtime config (<base>/config.js), the keys of the Ansible tier's
# configurator-config.js.j2. Blank = the SPA's own default:
#   STATE_TENANT_ID        login form's tenant (default pg)
#   OVERPASS_URL           boundary-polygon Overpass endpoint (default overpass-api.de)
#   TURBOPASS_URL          Turbopass base for boundary search and the Geography
#                          step's preconfigured official sets (default same-origin
#                          /turbopass). A shared instance serves any configurator.
#   BOUNDARY_SEARCH_LIMIT  boundary-service page cap (default 300)
#   SENTRY_DSN, POSTHOG_KEY, POSTHOG_HOST  this console's own telemetry (default off)
runtimeConfig:
  STATE_TENANT_ID: ""
  OVERPASS_URL: ""
  TURBOPASS_URL: ""
  BOUNDARY_SEARCH_LIMIT: ""
  SENTRY_DSN: ""
  POSTHOG_KEY: ""
  POSTHOG_HOST: ""

# Same-origin /turbopass proxied to a shared Turbopass (https://<host><path>/*),
# the address the SPA uses by default. Blank host = no proxy.
turbopassProxy:
  host: ""
  path: "/turbopass"

extraVolumes: |
  - name: runtime-config
    configMap:
      name: configurator-runtime-config
extraVolumeMounts: |
  - name: runtime-config
    mountPath: /usr/share/nginx/html/configurator/config.js
    subPath: config.js
    readOnly: true

