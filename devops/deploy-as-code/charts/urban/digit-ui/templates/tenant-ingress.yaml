{{- /*
Canonical tenant-scoped DIGIT UI, same contract as the Compose nginx
(local-setup/ansible/templates/nginx-site.conf.j2):

  /{slug}/digit-ui/...  is served from the /digit-ui mount; the slug stays in
                        the browser URL and the SPA resolves it via the BFF.
  /{slug}/digit-ui      302 -> /{slug}/digit-ui/. ingress-nginx can't redirect
                        with a capture (snippets are off, *-redirect takes a
                        literal URL), so it is rewritten to an internal path
                        the digit-ui image's nginx answers with the 302
                        (digit-ui-esbuild/docker/nginx.conf).

Case: ingress-nginx matches regex paths case-INsensitively (`~*`); Compose
nginx uses `~` (case-sensitive). An upper-case slug therefore reaches the SPA
here but not under Compose; the SPA rejects it either way (slugs are
lower-case, identity-bff docs §2.4.1), so both end on a not-found page.
*/ -}}
{{- define "digit-ui.tenantIngress" -}}
{{- $root := .root -}}
{{- $name := .name -}}
{{- $path := .path -}}
{{- $rewrite := .rewrite -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "common.name" $root }}-{{ $name }}
{{- if $root.Values.global.namespace }}
  namespace: {{ $root.Values.global.namespace }}
{{- else if $root.Values.ingress.namespace }}
  namespace: {{ $root.Values.ingress.namespace }}
{{- else }}
  namespace: {{ $root.Values.namespace }}
{{- end }}
  {{- /* The chart's usual annotations (ingress class, WAF, additionalAnnotations,
       as in common.ingress), with this route's regex rewrite taking precedence. */}}
  {{- $annotations := dict "nginx.ingress.kubernetes.io/use-regex" "true" "nginx.ingress.kubernetes.io/rewrite-target" $rewrite }}
  {{- $annotations = merge $annotations ($root.Values.ingress.annotations | default dict) }}
  {{- if $root.Values.ingress.waf.enabled }}
  {{- $annotations = merge $annotations ($root.Values.ingress.waf.annotations | default dict) }}
  {{- end }}
  annotations:
{{- toYaml $annotations | nindent 4 }}
{{- if $root.Values.ingress.additionalAnnotations }}
  {{- tpl $root.Values.ingress.additionalAnnotations $root | nindent 4 }}
{{- end }}
  labels:
{{- include "common.labels" $root | nindent 4 }}
spec:
  rules:
{{- if $root.Values.ingress.host }}
  {{- tpl $root.Values.ingress.host $root | nindent 2 }}
{{- else if $root.Values.ingress.hostName }}
  - host: {{ $root.Values.ingress.hostName }}
{{- else }}
  - host: {{ $root.Values.global.domain }}
{{- end }}
    http:
      paths:
        - path: {{ $path }}
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ $root.Values.ingress.serviceName | default (include "common.name" $root) }}
              port:
                number: {{ $root.Values.ingress.servicePort | default $root.Values.httpPort }}
{{- if ne $root.Values.global.setup "quickstart" }}
  tls:
{{- if $root.Values.ingress.tls }}
  {{- tpl $root.Values.ingress.tls $root | nindent 2 }}
{{- else if $root.Values.ingress.hostName }}
    - hosts:
        - {{ $root.Values.ingress.hostName }}
      secretName: {{ $root.Values.ingress.hostName }}-tls-certs
{{- else }}
    - hosts:
        - {{ $root.Values.global.domain }}
      secretName: {{ $root.Values.global.domain }}-tls-certs
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{ include "digit-ui.tenantIngress" (dict "root" . "name" "tenant-routes" "path" "/([a-z0-9-]{2,63})/digit-ui/(.*)" "rewrite" "/digit-ui/$2") }}
---
{{ include "digit-ui.tenantIngress" (dict "root" . "name" "tenant-root-redirect" "path" "/([a-z0-9-]{2,63})/digit-ui$" "rewrite" "/digit-ui-tenant-root/$1") }}
{{- end }}
