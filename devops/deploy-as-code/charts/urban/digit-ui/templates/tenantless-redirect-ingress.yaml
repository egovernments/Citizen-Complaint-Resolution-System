{{- if and .Values.ingress.enabled (ne (.Values.ingress.defaultTenantSlug | default "") "") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "common.name" . }}-tenantless-redirect
{{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
{{- else if .Values.ingress.namespace }}
  namespace: {{ .Values.ingress.namespace }}
{{- else }}
  namespace: {{ .Values.namespace }}
{{- end }}
  {{- /* ingress-nginx rejects a relative redirect target ("only http and https
       are valid protocols"), so the target is absolute. Static assets never
       reach this ingress: static-assets-ingress.yaml's longer regex path is
       matched first. */}}
  {{- $scheme := ternary "http" "https" (eq .Values.global.setup "quickstart") }}
  {{- $host := .Values.ingress.hostName | default .Values.global.domain }}
  annotations:
    nginx.ingress.kubernetes.io/temporal-redirect: {{ printf "%s://%s/%s$request_uri" $scheme $host .Values.ingress.defaultTenantSlug | quote }}
  labels:
{{- include "common.labels" . | nindent 4 }}
spec:
  rules:
{{- if .Values.ingress.host }}
  {{- tpl .Values.ingress.host . | nindent 2 }}
{{- else if .Values.ingress.hostName }}
  - host: {{ .Values.ingress.hostName }}
{{- else }}
  - host: {{ .Values.global.domain }}
{{- end }}
    http:
      paths:
        - path: /digit-ui
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.ingress.serviceName | default (include "common.name" .) }}
              port:
                number: {{ .Values.ingress.servicePort | default .Values.httpPort }}
{{- end }}
