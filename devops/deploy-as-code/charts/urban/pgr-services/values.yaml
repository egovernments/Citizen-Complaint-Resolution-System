# Common Labels
labels:
  app: "pgr-services"
  group: "rainmaker"

# Deployment strategy — Recreate, NOT a rolling update.
#
# During the thin-event cutover an OLD pgr-services replica renders and publishes N
# pre-rendered envelopes while a NEW one publishes one thin event the bridge resolves
# into the same N. Their transaction ids differ: the new seed carries the workflow
# ProcessInstance id, the old one does not. novu-bridge skips a transactionId it has
# already SENT or DELIVERED, but it matches on the id, so the same message arriving
# once per path under two ids is sent twice — two real SMS for one workflow transition.
# (Even with equal ids the skip is check-then-act and two near-simultaneous copies can
# both pass it.) So the release must stop the old pod before starting the new one.
#
# Upgrade order: novu-bridge BEFORE this chart. A bridge from before the thin-event
# stack dead-letters thin events and nothing replays them (docs/2.20/notifications/
# migration.md). digit-helmfile.yaml applies common-services (novu-bridge, with
# wait: true) before urban for that reason.
#
# docker compose already recreates; Kubernetes does not unless told. Consumed by
# charts/common/templates/_deployment.yaml. Do not add a rollingUpdate block here — the
# API rejects rollingUpdate together with type: Recreate.
deploymentStrategy:
  type: Recreate


# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "pgr-services"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "pgr_services_schema"
    # Same build as the app image below and as novu-bridge — see "One build" below.
    image:
      repository: "pgr-services-db"
      tag: "nightly-develop"   # RELEASE STEP: develop-<sha8> — see "One build" below
      pullPolicy: IfNotPresent   # Always while the tag is rolling (templates/deployment.yaml)
    env: |
        {{- if index .Values "pgr-ismultischema-enabled" }}        
        - name: SCHEMA_NAME
          value: {{ index .Values "pgr-schemas" | quote }}
        {{- end }}
        - name: "DB_URL"
          valueFrom: 
            configMapKeyRef: 
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}              
        - name: "FLYWAY_USER"
          valueFrom: 
            secretKeyRef: 
                name: db
                key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef: 
                name: db
                key: flyway-password
        - name: "FLYWAY_LOCATIONS"
          valueFrom: 
            configMapKeyRef: 
                name: egov-config
                key: flyway-locations

# Container Configs
# One build for the notification stack: pgr-services, pgr-services-db, novu-bridge and
# novu-bridge-db MUST come from the same build. This pgr-services publishes thin events
# only a novu-bridge of the same build resolves, and each app needs the Flyway
# migrations its -db image carries. global.notificationStackTag in
# charts/environments/env.yaml, when set, moves all four at once (templates/deployment.yaml);
# otherwise these chart defaults apply — the same place every other image in these charts
# is pinned.
#
# Tag policy. `nightly-develop` below is a STOPGAP: it is the rolling tag the develop
# nightly publishes, and no immutable tag containing this stack exists until the change
# that introduced it has merged and been built. RELEASE STEP (build/NIGHTLY-BUILDS.md,
# "Release step: pin the notification stack"): replace it, here AND in
# common-services/novu-bridge/values.yaml (image + dbMigration), with the develop-<sha8>
# the develop nightly minted for the merge commit, checked on Docker Hub for all four
# images. Until then the template pulls a rolling tag with Always, and a production
# environment pins explicitly: global.notificationStackTag: "develop-<sha8>" (or a release
# tag) in its env.yaml.
image:
  repository: "pgr-services"
  tag: "nightly-develop"   # RELEASE STEP: develop-<sha8> of the merge build
  pullPolicy: IfNotPresent   # Always while the tag is rolling (templates/deployment.yaml)
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/pgr-services/health"
  readinessProbePath: "/pgr-services/health"
appType: "java-spring"
tracing-enabled: true
notification-sms-enabled: "true"
notification-email-enabled: "false"
new-complaint-enabled: "true"
reassign-complaint-enabled: "true"
reopen-complaint-enabled: "true"
comment-by-employee-notif-enabled: "false"
notification-allowed-status: "open,assigned,rejected,resolved"
heap: "-Xmx192m -Xms192m"
java-args: "-Dspring.profiles.active=monitoring"

# Additional Container Envs
env: |
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: egov-pgr-services
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  {{- if index .Values "global" "serializers-timezone-in-ist" }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.egov.tracer.kafka.serializer.ISTTimeZoneJsonSerializer
  {{- end }}
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-idgen
  - name: EGOV_URL_SHORTNER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-url-shortening
  - name: EGOV_WORKFLOW_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-workflow-v2
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-service-v2
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: EGOV_INFRA_SEARCHER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-searcher
  - name: EGOV_FILESTORE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-filestore
  - name: EGOV_UI_APP_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-services-fqdn-name
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: boundary-service
  - name: NOTIFICATION_SMS_ENABLED
    value: {{ index .Values "notification-sms-enabled" | quote }}
  - name: NOTIFICATION_EMAIL_ENABLED
    value: {{ index .Values "notification-email-enabled" | quote }}
  - name: NEW_COMPLAINT_ENABLED
    value: {{ index .Values "new-complaint-enabled" | quote }}
  - name: REASSIGN_COMPLAINT_ENABLED
    value: {{ index .Values "reassign-complaint-enabled" | quote }}
  - name: REOPEN_COMPLAINT_ENABLED
    value: {{ index .Values "reopen-complaint-enabled" | quote }}
  - name: COMMENT_BY_EMPLOYEE_NOTIF_ENABLED
    value: {{ index .Values "comment-by-employee-notif-enabled" | quote }}
  - name: EGOV_PGR_APP_PLAYSTORE_LINK
    value: "https://goo.gl/ArDyQ1"
  - name: NOTIFICATION_ALLOWED_ON_STATUS
    value: {{ index .Values "notification-allowed-status" | quote }}
  - name: EGOV_HRMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-hrms
  {{- if index .Values "global" "tracer-errors-provideexceptionindetails" }}
  - name: TRACER_ERRORS_PROVIDEEXCEPTIONINDETAILS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: tracer-errors-provideexceptionindetails
  {{- end }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: JAVA_ENABLE_DEBUG
    value: {{ index .Values "java-enable-debug" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false" 
  - name: EGOV_LOCATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-location
  - name: EGOV_USR_EVENTS_NOTIFICATION_ENABLED
    value: "true"
  - name: EGOV_USR_EVENTS_CREATE_TOPIC
    value: "persist-user-events-async"
  - name: EGOV_USR_EVENTS_RATE_LINK
    value: "/citizen/otpLogin?mobileNo=$mobile&redirectTo=feedback/$servicerequestid"
  - name: EGOV_USR_EVENTS_REOPEN_LINK
    value: "/citizen/otpLogin?mobileNo=$mobile&redirectTo=reopen-complaint/$servicerequestid"
  - name: EGOV_USR_EVENTS_RATE_CODE
    value: "RATE"
  - name: EGOV_USR_EVENTS_REOPEN_CODE
    value: "REOPEN" 
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-url
  {{- if index .Values "tracing-enabled" }}
  - name: TRACER_OPENTRACING_ENABLED
    value: "true" 
  {{- end }}
  {{- if index .Values "tracing-enabled" }}
  - name: TRACER_REQUESTLOGGINGENABLED
    value: "true" 
  {{- end }}
  {{- if index .Values "time-before-closing-complaint" }}
  - name: PGR_COMPLAIN_IDLE_TIME
    value: {{ index .Values "time-before-closing-complaint" | quote }} 
  {{- end }}
  {{- if index .Values "configmaps" "egov-config" "data" "is-environment-central-instance" }}        
  - name: IS_ENVIRONMENT_CENTRAL_INSTANCE
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: is-environment-central-instance
  {{- end }}
  {{- if index .Values "configmaps" "egov-config" "data" "is-environment-central-instance" }}        
  - name: STATE_LEVEL_TENANTID_LENGTH
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: state-level-tenantid-length
  {{- end }}   
  - name: STATE_LEVEL_TENANT_ID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: state-level-tenant-id
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: {{ index .Values "egov.mdms.search.endpoint" | quote }}
