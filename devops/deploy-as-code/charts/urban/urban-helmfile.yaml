environments:
  env:
    values:
      - ../environments/env-secrets.yaml
      - ../environments/env.yaml
---
templates:
  default: &default
    chart: ./{{`{{ .Release.Name }}`}}
    labels:
      target: ./{{`{{ .Release.Name }}`}}
    version: 0.1.0
    namespace: egov
    # This prevents helmfile exiting when it encounters a missing file
    # Valid values are "Error", "Warn", "Info", "Debug". The default is "Error"
    # Use "Debug" to make missing files errors invisible at the default log level(--log-level=INFO)
    missingFileHandler: Warn
    values:
      - {{ .Values | toYaml | nindent 8 }}

releases:
  - name: pgr-services # Replace with your desired namespace
    installed: true
    <<: *default

  - name: digit-ui # Replace with your desired namespace
    installed: true
    <<: *default

  - name: egov-bndry-mgmnt # Replace with your desired namespace
    installed: true
    <<: *default

  - name: configurator # DIGIT Studio tenant onboarding/management SPA
    installed: true
    <<: *default

  # Citizen UI v2 (Vite SPA under /citizen/). No common-chart image: it serves a
  # tenant-baked dist pulled from object storage (see the chart's values.yaml for
  # why + how to build the tarball). Declares its own values instead of *default.
  - name: digit-ui-v2
    installed: true
    chart: ./digit-ui-v2
    namespace: egov
    missingFileHandler: Warn
    values:
      - global:
          domain: {{ .Values.global.domain | quote }}
        namespace: egov
        distUrl: {{ index .Values "digit-ui-v2" "distUrl" | default "" | quote }}
  # Frontend services end