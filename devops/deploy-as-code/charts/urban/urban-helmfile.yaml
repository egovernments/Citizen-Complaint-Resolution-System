bases:
  - ../environments/environments.yaml
---
{{- /* Releases this environment turns off by name (env values `disabledReleases`,
       empty by default): every release that is otherwise always installed reads it. */ -}}
{{- $disabled := index .Values "disabledReleases" | default list }}
{{- $turbopassUpstream := index (index .Values "turbopass-proxy" | default dict) "upstream" | default dict }}
templates:
  default: &default
    chart: ./{{`{{ .Release.Name }}`}}
    labels:
      target: ./{{`{{ .Release.Name }}`}}
    version: 0.1.0
    namespace: egov
    # This prevents helmfile exiting when it encounters a missing file
    # Valid values are "Error", "Warn", "Info", "Debug". The default is "Error"
    # Use "Debug" to make missing files errors invisible at the default log level(--log-level=INFO)
    missingFileHandler: Warn
    values:
      - {{ .Values | toYaml | nindent 8 }}

releases:
  - name: pgr-services # Replace with your desired namespace
    installed: {{ not (has "pgr-services" $disabled) }}
    <<: *default

  - name: digit-ui # Replace with your desired namespace
    installed: {{ not (has "digit-ui" $disabled) }}
    <<: *default

  # Boundary management (bulk boundary upload/generation from Excel): not used
  # by this deployment, so it is disabled. Re-enable by setting installed: true
  # here and gatus.checks.boundaryManagement: true in
  # monitoring/gatus/values.yaml.
  - name: egov-bndry-mgmnt # Replace with your desired namespace
    installed: false
    <<: *default

  # Same-origin /turbopass forwarded to a shared Turbopass, cookies stripped
  # (the chart's values.yaml). Only where the environment names the upstream.
  - name: turbopass-proxy
    installed: {{ ne (index $turbopassUpstream "host" | default "") "" }}
    <<: *default

  - name: configurator # DIGIT Studio tenant onboarding/management SPA
    installed: {{ not (has "configurator" $disabled) }}
    <<: *default
  # Frontend services end