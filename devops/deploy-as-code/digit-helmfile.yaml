#checking helmfile

environments:
  env:
    values:
      - ./charts/environments/env-secrets.yaml
      - ./charts/environments/env.yaml

---

helmfiles:
  - path: ./charts/backbone-services/backboneservices-helmfile.yaml
  - path: ./charts/core-services/coreservices-helmfile.yaml
  # common-services BEFORE urban: it holds novu-bridge (released with wait: true), and
  # urban holds pgr-services. A new pgr-services publishes thin events that a bridge
  # from before the thin-event stack dead-letters — unrecoverably, nothing replays the
  # DLQ — so on an upgrade the new bridge must be rolled out and Ready before the new
  # pgr-services starts. Nothing in common-services depends on urban.
  - path: ./charts/common-services/common-services-helmfile.yaml
  - path: ./charts/urban/urban-helmfile.yaml
  - path: ./charts/analytics/analytics-helmfile.yaml
  - path: ./charts/auxiliary-services/auxiliary-helmfile.yaml
  # Monitoring (#1619). This arrived already commented out in the wholesale
  # import from upstream DIGIT-DevOps -- nobody here disabled it deliberately,
  # so every monitoring fix in this tree was inert.
  #
  # Enabling the path is safe on its own: all six releases in that helmfile are
  # gated on `monitoring.*` in charts/environments/env.yaml and default to
  # false, so this line deploys NOTHING until an operator opts in.
  - path: ./charts/monitoring/monitoring-helmfile.yaml
