apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "digit-mcp.fullname" . }}
  labels:
    {{- include "digit-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "digit-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "digit-mcp.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # `node` in the official node images
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.healthcheck.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "digit-mcp.fullname" . }}
            - secretRef:
                name: {{ include "digit-mcp.fullname" . }}
          # readOnlyRootFilesystem is on, so every path the server writes needs
          # an explicit mount: the access log, the session JSONL directory, and
          # the snapshot artifact directory it confines output_path to.
          volumeMounts:
            - name: logs
              mountPath: /var/log/digit-mcp
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: logs
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
