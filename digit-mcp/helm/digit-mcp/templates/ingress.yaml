{{- if .Values.ingress.enabled }}
{{- $fullName := include "digit-mcp.fullname" . -}}
# Public ingress for digit-mcp. The MCP is a platform-admin surface, so this is
# OPT-IN (ingress.enabled=false by default) and is meant to front a READ-ONLY
# instance (env.MCP_READ_ONLY=1). Auth is enforced at the EDGE so nothing reaches
# the pod without credentials — even the /mcp endpoint, which has no app-level
# auth: HTTP basic auth (ingress.basicAuthSecret) and/or an IP allowlist
# (ingress.allowSourceRange). TLS comes from the cert-manager cluster-issuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "digit-mcp.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.ingress.basicAuthSecret }}
    # htpasswd Secret the operator creates out of band, e.g.:
    #   htpasswd -c auth mcp && kubectl -n <ns> create secret generic <name> --from-file=auth
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.ingress.basicAuthSecret | quote }}
    nginx.ingress.kubernetes.io/auth-realm: "digit-mcp (read-only)"
    {{- end }}
    {{- if .Values.ingress.allowSourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.ingress.allowSourceRange | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecret | quote }}
  {{- end }}
{{- end }}
