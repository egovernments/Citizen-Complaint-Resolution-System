replicaCount: 1

image:
  repository: ghcr.io/chakshugautam/digit-mcp
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# Public exposure. OFF by default — the MCP is a platform-admin surface and is
# only reachable in-cluster (port-forward) unless you opt in here. Intended for a
# SEPARATE read-only release (env.MCP_READ_ONLY=1). Auth is enforced at the edge,
# because /mcp has no app-level auth: set basicAuthSecret and/or allowSourceRange.
ingress:
  enabled: false
  className: nginx
  host: ""                 # e.g. mcp.cms-saas.digit.org
  path: /
  clusterIssuer: ""        # e.g. letsencrypt-prod (cert-manager issues TLS)
  tlsSecret: ""            # e.g. <host>-mcp-tls
  # htpasswd Secret created out of band (kubectl create secret generic <name> --from-file=auth).
  # Leave empty ONLY if allowSourceRange alone is your gate.
  basicAuthSecret: ""
  # CIDR(s) allowed to reach the ingress, e.g. "1.2.3.4/32,10.0.0.0/8".
  allowSourceRange: ""
  annotations: {}

env:
  MCP_TRANSPORT: http
  MCP_PORT: "3000"
  CRS_ENVIRONMENT: "self-hosted"
  CRS_TENANT_ID: "pg"
  # DIGIT API base the shim proxies to (in-cluster gateway service).
  CRS_API_URL: "http://gateway.egov:8080"
  CRS_ENV_NAME: "CCRS"
  # Read-only mode. Leave unset for the normal (full) instance. Set to "1" for a
  # SEPARATE, publicly-exposable instance that carries only read tools — every
  # write-risk tool (tenant_destroy, decrypt_data, *_create/_update, ...) is
  # absent, on /mcp and every /v1 route. Even so, gate it with auth/allowlist:
  # some reads (user_search, pgr_search) return data.
  # MCP_READ_ONLY: "1"

secret:
  # Set these when installing: --set secret.CRS_USERNAME=... --set secret.CRS_PASSWORD=...
  CRS_USERNAME: ""
  CRS_PASSWORD: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

healthcheck:
  path: /healthz
  port: 3000
