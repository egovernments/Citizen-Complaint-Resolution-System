server {
    listen 80;

    location /digit-ui {
        root /var/web;
        index index.html;
        try_files $uri $uri/ /digit-ui/index.html;

        # A missing asset is a 404, not the SPA shell with a 200.
        location ~ "[.](?:js|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf|eot)$" {
            try_files $uri =404;
        }
    }

    # Kubernetes only: ingress-nginx can't redirect with a regex capture, so the
    # digit-ui chart's tenant-root-redirect Ingress rewrites /{slug}/digit-ui to
    # this internal path and the 302 to /{slug}/digit-ui/ is issued here
    # (Compose nginx does it directly). Relative Location: the ingress, not this
    # container, knows the public scheme and host.
    location ~ "^/digit-ui-tenant-root/([a-z0-9-]{2,63})$" {
        absolute_redirect off;
        return 302 /$1/digit-ui/;
    }
}
