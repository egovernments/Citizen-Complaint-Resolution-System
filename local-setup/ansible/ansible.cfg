[defaults]
# ansible.builtin.shell tasks run via /bin/sh by default. On Debian/Ubuntu
# controllers /bin/sh is dash, which rejects `set -o pipefail` — so every
# task that starts with `set -o pipefail` fails immediately with
# "set: Illegal option -o pipefail" (rc=2). deploy.sh runs from this
# directory, so ansible loads this file and forces bash for all shell
# tasks — pipefail (and other bashisms) then work uniformly, instead of
# needing `args: { executable: /bin/bash }` pinned on each task.
executable = /bin/bash

# Verify host keys. Ansible defaults this to True, but it reads
# ANSIBLE_HOST_KEY_CHECKING from the environment — pin it here so a stray
# export on a controller cannot silently turn verification off for a run that
# ships root credentials and bootstrap secrets to the target. The generated
# inventory pairs this with StrictHostKeyChecking=accept-new (deploy.sh), so a
# first-contact box still connects without manual key seeding while a CHANGED
# key aborts the play.
host_key_checking = True
