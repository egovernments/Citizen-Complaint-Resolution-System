[defaults]
# ansible.builtin.shell tasks run via /bin/sh by default. On Debian/Ubuntu
# controllers /bin/sh is dash, which rejects `set -o pipefail` — so every
# task that starts with `set -o pipefail` fails immediately with
# "set: Illegal option -o pipefail" (rc=2). deploy.sh runs from this
# directory, so ansible loads this file and forces bash for all shell
# tasks — pipefail (and other bashisms) then work uniformly, instead of
# needing `args: { executable: /bin/bash }` pinned on each task.
executable = /bin/bash

# NOTE on the shell plugin that makes the line above safe (#2111): Ansible also
# derives a shell PLUGIN name from that basename, and ships none called "bash",
# so ansible.posix.synchronize fails with "Could not find the shell plugin
# required (bash)". shell_plugins/bash.py aliases the POSIX sh plugin.
#
# There is deliberately NO `shell_plugins = ...` key here: it is not an Ansible
# config option. `ansible-config list` has no such setting, and
# shell_loader.config is the hardcoded literal ['shell_plugins'] resolved
# against the process CWD. The plugin is found because ansible-playbook calls
# add_all_plugin_dirs(playbook_dir), which picks up <playbook_dir>/shell_plugins
# — so what matters is that the file sits NEXT TO THIS PLAYBOOK, not any config
# line. Verified: removing a cfg key changes nothing; moving the file breaks
# every synchronize task.

# Verify host keys. This is Ansible's default; pinning it states the intent and
# guards against a competing value in another ansible.cfg on the controller.
#
# It does NOT defeat the environment: Ansible's config precedence puts
# ANSIBLE_HOST_KEY_CHECKING (and ANSIBLE_SSH_HOST_KEY_CHECKING) ABOVE the ini
# file, and the resulting `-o StrictHostKeyChecking=no` is placed before the
# inventory's `accept-new` on the ssh command line, where the first value wins.
# deploy.sh therefore unsets those two variables before invoking the playbook —
# that is what actually closes the override, not this line.
#
# Paired with StrictHostKeyChecking=accept-new in the generated inventory: a
# first-contact box connects without manual key seeding, a CHANGED key aborts.
host_key_checking = True
