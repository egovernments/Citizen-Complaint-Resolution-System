# Variables shared across every host in this inventory. Anything
# DIGIT-specific belongs in `group_vars/digit.yml`; anything host-specific
# in `host_vars/<host>.yml`.

# Where the deploy lays down the stack on each target.
# /opt/digit on Linux (unchanged). On macOS (thin Mac path, ansible_connection
# local) /opt needs sudo; default to a user-writable path instead. host_vars
# still overrides this (higher precedence).
digit_dir: "{{ '/opt/digit' if (ansible_system | default('Linux')) != 'Darwin' else (ansible_env.HOME ~ '/digit') }}"

# Minimum Docker Compose version we'll accept on the target before deploying.
docker_compose_version_min: "2.20"

# Where the configurator SPA dist is served from. /var/www/configurator on
# Linux (host nginx). On macOS nginx runs as a container and /var/www needs
# sudo, so default to a digit_dir-relative path that the container bind-mounts.
configurator_www_dir: "{{ (www_root ~ '/configurator') if (ansible_system | default('Linux')) != 'Darwin' else (digit_dir ~ '/configurator') }}"
# The path nginx itself resolves the configurator alias to. On Linux nginx runs
# on the host, so it is configurator_www_dir; on macOS nginx is a container that
# bind-mounts configurator_www_dir at /var/www/configurator (review of #2788).
configurator_nginx_root: "{{ configurator_www_dir if (ansible_system | default('Linux')) != 'Darwin' else '/var/www/configurator' }}"

# Root of everything host nginx serves from disk (Linux). Each directory below
# can also be overridden on its own; nginx-site.conf.j2 and the playbook read
# ONLY these variables, never a literal /var/www path.
www_root: /var/www
brand_www_dir: "{{ www_root }}/brand"                              # nginx_features.brand_assets
integration_tests_www_dir: "{{ www_root }}/integration-tests"      # enable_integration_tests
integration_tests_v2_www_dir: "{{ www_root }}/integration-tests-v2"

# Where the deploy keeps the digit-ui (esbuild) source tree and its build.
digit_ui_src_dir: /opt/digit-ui-esbuild

# Optional: bind named data volumes to host directories (e.g. a dedicated
# /data disk) instead of Docker's data-root. Keys are volume names declared
# in the compose files (postgres_data, minio_data, ...), values are absolute
# host paths; the deploy creates the directories and layers a generated
# docker-compose.hostpaths.yml. Only for a stack that has not created the
# volume yet: Docker will not re-point an existing named volume, so moving a
# live database is a migration (stop, copy, then set this). Example:
#   data_volume_host_paths:
#     postgres_data: /data/postgres
#     minio_data: /data/minio
data_volume_host_paths: {}

# Host port the macOS nginx container publishes (maps to its :80). Linux is
# unaffected (host nginx binds 80/443 directly).
nginx_host_port: 80

# Optional: move Docker's data-root (images + named volumes — the bulk of
# disk usage) off the root filesystem onto a dedicated partition, e.g.
# "/opt/docker". Empty = Docker's default (/var/lib/docker). Set this on any
# box where `/` is small and a larger partition (commonly /opt) is available
# — a fresh RHEL box pulling the ~30 images in this stack onto a small `/`
# reliably fills it mid-deploy. Setting this ALSO relocates containerd's own
# root (a separate config file Docker's data-root does not control — the
# image layers actually live there) to a sibling "containerd" directory, e.g.
# "/opt/containerd". Only takes effect on a box where Docker/containerd have
# never been started before — see local-setup/ansible/README.md for the
# migration steps if they're already populated on the root filesystem.
docker_data_root: ""
