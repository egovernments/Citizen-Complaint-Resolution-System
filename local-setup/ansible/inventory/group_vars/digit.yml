# DIGIT-stack defaults — every tenant inherits these unless its host_vars
# overrides a specific key.
#
# Only things that are GENUINELY cross-tenant / cross-country live here.
# Anything country-specific (boundary taxonomy, mobile-number format),
# instance-specific (S3 bucket, brand URLs), or operator-preference
# (which nginx blocks to render) lives in host_vars — see
# inventory/host_vars/_example.yml for the documented template.
#
# Per-tenant secrets (DB passwords, Keycloak admin, OAuth client secrets,
# registry creds) DO NOT belong in this file. They live in OpenBao and
# are referenced via `secrets_path:` in host_vars.

# Tear down the running stack before re-deploying (containers + orphaned
# networks, but NOT volumes). Off by default — prod tenants must never
# lose a running stack unintentionally. Flip true on CI/dev boxes or
# when you explicitly want a clean redeploy from scratch.
force_clean: false

# ──────────────────────────────────────────────────────────────────────
# digit-ui SPA — values read at boot via Digit.Utils.getConfig(KEY)
# ──────────────────────────────────────────────────────────────────────

# Empty default — every tenant MUST set state_tenant_id in host_vars.
# Examples: `ke` (Kenya root), `pb` (Punjab root), `ke.nairobi`
# (Nairobi city, when the citizen UI should pin to a single city).
state_tenant_id: ""

# Top-level country/state tenant. Used for `STATE_LEVEL_TENANT_ID` env
# vars on the DIGIT services (auth lookup encryption tenant, MDMS state
# root, boundary hierarchy root). This is distinct from `state_tenant_id`
# above, which is the city tenant the citizen SPA pins to. Examples:
# `ke`, `pb`, `mz`. Required in host_vars; the playbook fails open with
# the upstream `pg` if unset, which silently breaks login on any tenant
# with encrypted usernames since the encrypt-for-lookup ends up using
# `pg`'s key (177813) instead of e.g. `ke`'s (74493). See PR description.
state_root: ""

# digit-ui serving mode — `hmr` for live-reload dev (host-side esbuild
# in tmux), `static` for the pre-built bundle served by host nginx.
# Default is static; flip to hmr only on hosts where you actively want
# live reload from /opt/digit-ui-esbuild. The playbook converges to
# whichever the host requests, killing the off-mode runner first to
# free port 18080.
digit_ui_mode: static

# Bring up Elasticsearch + egov-indexer + inbox-v2 (heavy; ~2 GB RAM).
# Off by default; tenants that use the inbox opt in via host_vars.
enable_search_stack: false

# ──────────────────────────────────────────────────────────────────────
# How much observability to deploy (#1657)
# ──────────────────────────────────────────────────────────────────────
# Cumulative levels — each includes the ones above it. Default `traces`
# is the whole stack, i.e. exactly what every tenant runs today, so this
# knob only ever lets an operator take LESS.
#
# `gatus` and `otel-collector` carry no profile, so they run at EVERY
# level and form the floor (~384 MB). What the levels actually gate:
#
#   metrics  + prometheus, node-exporter, grafana               ~1.2 GB
#   logs     + loki, promtail                                   ~1.8 GB
#   traces   + tempo                                            ~2.2 GB
#
# The collector is ungated on purpose: 12 UNPROFILED services declare
# `depends_on: otel-collector`, and compose rejects the whole project
# when a selected service depends on a profile-excluded one — so gating
# it broke every ad-hoc `docker compose` command, not just low levels
# (#1666, fixed in #1687). It also earns its place regardless of level:
# JVM metrics flow OTLP → otel-collector → /metrics on :8889, which is
# what Prometheus scrapes, so dropping it costs per-service JVM metrics
# and not just traces. Tempo is the only traces-exclusive component.
#
# A gatus-only `uptime` level is therefore not the ~64 MB it once looked
# like — the floor above is what any level costs. Removing the
# application → collector dependency (a telemetry sink should never gate
# application startup) is tracked separately.
#
# Lowering this value on an existing box now TEARS DOWN the containers
# that leave the selection, rather than orphaning them running (#1687).
#
# Footprints are approximate. The caps from #1612 have since landed as
# `deploy.resources.limits.memory` in docker-compose.egov-digit.yaml:
# prometheus 512M, loki 512M, tempo 384M, otel-collector 320M,
# grafana 256M, promtail 128M, gatus 64M. So these are enforced ceilings
# now, though the figures below are still budget rather than measurement.
#
# This matters because the boxes are small: 29 services declare ~12.8 GB
# of max heap on machines that are commonly 16 GB and have NO swap, so
# memory pressure means OOM kills rather than slowdown. An operator who
# wants uptime and metrics but cannot afford log and trace storage should
# be able to say so.
observability_level: traces

# SPA configuration — stable cross-tenant defaults.
context_path: digit-ui
gmaps_api_key: ""
fin_env: dev
central_instance_enabled: false
digit_home_url: "https://www.digit.org/"
config_module_name: "commonMDMSConfig"
locale_region: "IN"           # Drives locale formatting (en_IN). Override per country.
locale_default: "en"
mdms_context: "mdms-v2"
hrms_context: "egov-hrms"
invalid_employee_roles: ["SYSTEM"]
auth_provider: "digit"

# Empty defaults — tenants set actual values in host_vars/_example.yml.
asset_s3_bucket: ""           # filestore S3 fallback bucket

# Country-specific. Override per tenant:
#   Kenya:  highest=County, lowest=Ward
#   India:  highest=State,  lowest=Locality
pgr_boundary_highest_level: ""
pgr_boundary_lowest_level: ""
boundary_type: ""

# Country-specific mobile validation. Set per tenant:
#   Kenya:  prefix=+254, pattern=^[17][0-9]{8}$, length=9
#   India:  prefix=+91,  pattern=^[6-9][0-9]{9}$, length=10
core_mobile_configs: {}

# Footer logos. Empty by default; tenants ship branded URLs (typically
# mirrored under /var/www/brand/ when nginx_features.brand_assets: true).
footer_logo_url: ""
footer_bw_logo_url: ""

# Tenant-restriction lists. Empty = no filtering. Tenants override
# when they want to surface only their own city or hide modules.
login_tenant_allowlist: []
employee_module_denylist: []

# Client-side dashboard render-lag instrumentation (#1110): the supervisor
# dashboard POSTs OTLP metrics/logs to the same-origin /otel Kong route.
# ON by default (the emitter self-mutes when the route is absent). This is
# the deployed-box KILL SWITCH: set false in host_vars and re-render
# globalConfigs.js (ansible/nightly) — no rebuild needed.
dashboard_metrics_enabled: true

# ──────────────────────────────────────────────────────────────────────
# nginx vhost — feature flags + upstream ports
# ──────────────────────────────────────────────────────────────────────
# Each toggle controls whether a `location` block is rendered. Defaults
# are CONSERVATIVE — only render what's safe by default. Operators flip
# features on per-tenant once the prerequisite assets/services exist.

nginx_features:
  brand_assets: false       # /brand/ alias — requires /var/www/brand on host
  configurator: false       # /configurator + /configurator/assets
  configurator_caching: false  # /configurator/assets/ long-cache headers
  status: false             # /status/ Gatus board (sub_filter rewrites)
  grafana: true             # /grafana/ dashboards — the only public path to
                            # Grafana (#1604). Default on: it carries a real
                            # login since #1602. Set false to take Grafana off
                            # the internet entirely (reach it over an SSH
                            # tunnel to 127.0.0.1:13000 instead).
  api_pgr: false            # /api/pgr/ proxied to MCP for the dashboard
  mcp: false                # /mcp HTTP transport — see CLAUDE.md security note
  # Note: `/` routing is derived from `digit_ui_mode`:
  #   static → host nginx serves /digit-ui/* + Kong gets / for API calls
  #   hmr    → esbuild dev server on :18080 gets / (serves both UI + API proxy)

# Upstreams (host-side ports). Container ports are fixed in compose;
# these are how the host nginx reaches them.
upstream_kong_port: 18000
upstream_grafana_port: 13000
upstream_gatus_port: 18889
upstream_mcp_port: 13101
upstream_esbuild_port: 18080
upstream_minio_port: 19000

# ──────────────────────────────────────────────────────────────────────
# Custom Docker registry (digit-mcp image, future custom builds)
# ──────────────────────────────────────────────────────────────────────

# Where pre-built custom DIGIT images live. The egov-ci box in the
# Hetzner VPC runs an insecure registry at 10.0.0.4:5000. Operators
# outside the VPC should override this in host_vars (e.g. to a public
# registry like ghcr.io/<org>) or set it to an empty string + flip
# enable_mcp: false if they don't need digit-mcp at all.
docker_registry: 10.0.0.4:5000

# Hosts to add to Docker daemon.json `insecure-registries`. Defaults to
# the docker_registry above (matches the historical Hetzner-VPC behaviour
# of writing 10.0.0.4:5000 as insecure). Override to `[]` when using a
# public TLS registry like ghcr.io — Docker rejects a path-bearing or
# TLS hostname in `insecure-registries` and refuses to start, taking the
# whole stack down. Each entry must be `host` or `host:port`, never with
# a path component.
insecure_registries:
  - "{{ docker_registry }}"

# Docker log rotation (daemon.json log-opts). Without these the json-file
# driver grows a container's log without bound; a chatty JVM service can fill
# the disk on a long-running tenant.
#
# Docker's real per-container ceiling is max-size * max-file, so these are not
# independent. docker_log_total_size is the INVARIANT — the most any single
# container may consume — and docker_log_max_size is the tunable slice size.
# The file count is derived (total / max-size) so changing the slice size
# cannot breach the cap. The deploy fails fast if max-size exceeds the total.
#
# 100m x 10 = 1g per container by default.
docker_log_max_size: "100m"
docker_log_total_size: "1g"
#
# Escape hatch: set docker_log_max_file to pin the file count directly. This
# BYPASSES the derivation and the cap check, so the effective ceiling becomes
# docker_log_max_size * docker_log_max_file. Only use it if you need Docker's
# native two-knob behaviour. It is a file COUNT, not a size — a unit on it
# ('10m') is rejected by preflight. Uncommenting it and leaving the value blank
# is treated as unset, so the derivation still applies.
# docker_log_max_file: 10

# Live progress sink for the deploy's two long compose steps (image pull +
# stack up). Their output streams here as they run, so the operator can
# `tail -f` it from another terminal instead of waiting for the task to end.
# Same idea as the Mac path's /tmp/mac-stack-up.progress.
# Per-tenant filename: concurrent deploys of two tenants on one box must
# not interleave into one file.
# Lives under digit_dir, NOT /tmp: the deploy writes here with tee as
# root, and a predictable root-written path in world-writable /tmp is a
# symlink-attack target (a local user pre-creates a symlink, root's tee
# follows it and overwrites the target). digit_dir is root-owned on
# Linux, so only root can place anything at this path; the file itself
# is created 0644 so a non-root operator can still tail it.
compose_progress_file: "{{ digit_dir }}/digit-stack-up.{{ inventory_hostname }}.progress"

# WSL2-only (ignored everywhere else): the [wsl2] resource caps the deploy
# writes into the Windows-side .wslconfig. WSL defaults to ~50% of host
# RAM, which starves the JVM stack and freezes the whole VM; these are
# sized for a 16 GB host (12 GB VM + big swap for JVM startup spikes).
# Hosts with 32 GB should override wsl_memory_gb: 20 in host_vars.
# NOTE: ansible can WRITE the config but cannot APPLY it — that takes
# `wsl --shutdown` from Windows, which would kill the VM ansible runs in.
# The deploy fails fast with instructions when the running VM doesn't
# match these values yet.
wsl_memory_gb: 12
wsl_swap_gb: 16
wsl_processors: 6

# On-target directory for digit-mcp when build_mcp is true. Vendored deploys
# rsync CCRS digit-mcp/ here; a git mcp_repo_url clones/updates here instead.
mcp_repo: "{{ digit_dir }}/digit-mcp"
# "-" = vendored (rsync from controller); set a git URL to clone on the target.
mcp_repo_url: "-"
mcp_ref: main

# Optional git source for the digit-ui SPA, cloned onto the target at
# /opt/digit-ui-esbuild. EMPTY BY DEFAULT (#1503): the SPA source lives in this
# monorepo at digit-ui-esbuild/ and CI publishes it nightly as the image below,
# so no deploy needs to clone anything. Set this in host_vars only to build a
# fork's source on the box — and note it is only consulted by `hmr` mode, or by
# `static` mode with digit_ui_bundle_image deliberately blanked out.
digit_ui_esbuild_repo: ""
digit_ui_esbuild_branch: main

# Prebuilt digit-ui bundle (static mode) — the DEFAULT, and the robust
# alternative to building the SPA on-host. The playbook pulls this image and
# extracts its baked /var/web/digit-ui into build/, skipping the on-host
# node/npm/esbuild build entirely (no Node-version / missing-npm fragility) and
# skipping the git clone with it.
#
# This is the multi-arch egovio Docker Hub build of THIS repo's
# digit-ui-esbuild/ tree, rebuilt every night from develop
# (build/build-config.yml → image-name: digit-ui-esbuild). Pin a
# develop-<sha> / v2.12-beta tag in host_vars for a reproducible deploy.
# Set to "" in host_vars to force an on-host build instead, which then needs
# digit_ui_esbuild_repo pointed at a source tree.
digit_ui_bundle_image: "egovio/digit-ui-esbuild:nightly-develop"

# Slack webhook for Gatus outage alerts (#1609). Empty = alerting OFF, which is
# the default for every tenant: gatus warns about the unusable provider and
# carries on, so nothing changes for deployments that do not want alerts.
#
# Set it per tenant in host_vars to switch alerting on. Treat it as a SECRET --
# anyone holding the URL can post into the channel -- so prefer pulling it from
# OpenBao via secrets_path rather than committing it here.
gatus_slack_webhook_url: ""
