# Ensure Node 20 + a matching npm from NodeSource.
#
# Why not just `apt install nodejs` / `dnf install nodejs`? On Ubuntu the
# archive ships Node 18 AND NO npm (npm is a separate archive package), so
# apt alone leaves node present but npm missing — downstream `npm install`
# silently no-op'd and builds failed later with a confusing "Cannot find
# module 'esbuild'". NodeSource bundles a matching npm on both package
# families. The install is gated on a version probe so re-deploys are a
# no-op once Node >=20 is already present.
#
# Contract for callers:
#   - Set `node_ensure_label` (a string) for readable task names.
#   - Apply the enabling `when:` (e.g. feature flags) on the `include_tasks`
#     statement — it propagates to every task in this file. Always exclude
#     Darwin at the call site (NodeSource is Linux-only).
- name: "{{ node_ensure_label }} — probe installed node version"
  ansible.builtin.command: node --version
  register: _ensure_node_ver
  changed_when: false
  failed_when: false

- name: "{{ node_ensure_label }} — probe installed npm version"
  ansible.builtin.command: npm --version
  register: _ensure_npm_ver
  changed_when: false
  failed_when: false

# One decision, one install task. The version floor/probe logic lives only
# here — the Debian and RHEL paths differ solely in the NodeSource repo host
# and the package manager, so those two strings are templated rather than
# duplicating the whole task per OS family (which previously let the version
# regexps drift apart).
- name: "{{ node_ensure_label }} — probe dpkg architecture (for the apt source line)"
  ansible.builtin.command: dpkg --print-architecture
  register: _node_deb_arch
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: "{{ node_ensure_label }} — decide whether NodeSource Node 20 is needed"
  ansible.builtin.set_fact:
    _node_needs_install: >-
      {{ _ensure_node_ver.rc != 0
         or _ensure_npm_ver.rc != 0
         or (_ensure_node_ver.stdout | default('') is not match('^v(2[0-9]|[3-9][0-9])\.')) }}

# Declarative repo setup instead of `curl … | bash -` as root.
#
# The old form piped an unauthenticated remote script straight into a root
# shell on the target: whatever NodeSource served (or whatever a MITM or a
# compromised CDN served in its place) executed with full privileges on a box
# that holds every tenant secret, and nothing about the transfer was verified
# beyond TLS. It also ran on every deploy that needed Node — it was the default
# path, not an opt-in.
#
# The replacement is the same shape the Docker install above already uses:
# fetch the publisher's GPG key to /etc/apt/keyrings, register a `signed-by=`
# apt source, and let apt verify every package signature. On RHEL the dnf repo
# carries gpgcheck=1 with the same key. A tampered package now fails the
# signature check instead of executing.
#
# NOTE: setting `digit_ui_bundle_image` in group_vars skips the on-host UI
# build entirely, so no Node install is needed at all — prefer that where the
# deploy does not need a toolchain on the box.

- name: "{{ node_ensure_label }} — NodeSource repo (Debian/Ubuntu)"
  when:
    - _node_needs_install | bool
    - ansible_facts['os_family'] == 'Debian'
  block:
    - name: "{{ node_ensure_label }} — prerequisites for a signed apt repo"
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: yes

    - name: "{{ node_ensure_label }} — install NodeSource GPG key to /etc/apt/keyrings"
      ansible.builtin.shell: |
        set -euo pipefail
        install -m 0755 -d /etc/apt/keyrings
        # Dearmor to a TEMP file, then mv into place only on full success.
        # `gpg -o <dest>` (and the old `creates:` guard) truncated the dest
        # BEFORE the piped curl's exit status was known: a failed download left
        # a 0-byte keyring that `creates:` then skipped forever, wedging every
        # later deploy with an unverifiable apt repo. `set -o pipefail` catches
        # the curl failure; the temp+mv makes the dest all-or-nothing.
        tmp=$(mktemp)
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o "$tmp"
        test -s "$tmp"
        install -m 0644 "$tmp" /etc/apt/keyrings/nodesource.gpg
        rm -f "$tmp"
      args:
        executable: /bin/bash
        # No `creates:` — the task is cheap and idempotent (mv over the same
        # content), and a `creates:` guard on a path a previous run may have
        # left empty is exactly the wedge described above.

    - name: "{{ node_ensure_label }} — register signed-by NodeSource apt source"
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nodesource.list
        mode: '0644'
        content: |
          deb [arch={{ _node_deb_arch.stdout | trim }} signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main

    - name: "{{ node_ensure_label }} — install nodejs (signature-verified by apt)"
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes

- name: "{{ node_ensure_label }} — NodeSource repo (RHEL family)"
  when:
    - _node_needs_install | bool
    - ansible_facts['os_family'] == 'RedHat'
  block:
    - name: "{{ node_ensure_label }} — register NodeSource dnf repo with gpgcheck"
      ansible.builtin.yum_repository:
        name: nodesource-nodejs
        description: Node.js Packages - Node 20
        baseurl: https://rpm.nodesource.com/pub_20.x/nodistro/nodejs/$basearch
        gpgcheck: true
        gpgkey: https://rpm.nodesource.com/gpgkey/ns-operations-public.key
        enabled: true

    - name: "{{ node_ensure_label }} — install nodejs (signature-verified by dnf)"
      ansible.builtin.dnf:
        name: nodejs
        state: present
