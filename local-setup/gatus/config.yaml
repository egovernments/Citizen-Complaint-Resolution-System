# Gatus Configuration for DIGIT Core Services
# https://github.com/TwiN/gatus
#
# Kept in sync with the k3s tier: local-setup/k8s/tools/gatus.yaml (gatus-config ConfigMap).
# Both files define the SAME endpoint catalogue -- identical names, groups, URLs and
# conditions, with no tier-only entries. Only runtime enablement differs: the
# GATUS_PROFILE_* / GATUS_PROXIES toggles are set per deployment to match what that
# deployment actually runs. Add an endpoint to one file, add it to the other.
# CI enforces this (.github/workflows/gatus-coverage.yml).

# Uptime history survives restarts (#1610). With the previous `type: memory`
# every redeploy wiped it, so "how long was it down?" and "is this endpoint
# flapping or is this the first failure?" were unanswerable — which is the
# first question anyone asks when an alert fires.
#
# Retention is deliberately left unset: Gatus bounds it itself, per endpoint, at
# maximum-number-of-results 100 and maximum-number-of-events 50 (upstream
# storage/config.go, DefaultMaximumNumberOfResults / DefaultMaximumNumberOfEvents),
# and the SQL store prunes past those thresholds. gatus.db therefore settles at a
# steady-state size instead of growing forever. Set those keys here only if a
# deployment wants a different window -- and check the pinned image supports them,
# since Gatus rejects unknown config keys outright.
storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: DIGIT Core Services - Health Dashboard
  description: Real-time health monitoring for all DIGIT microservices

# Alerting (#1609). Gatus detected outages but told nobody -- the dashboard is
# only useful to someone already looking at it, which is never at 3am.
#
# OFF BY DEFAULT, and safely so: Gatus expands ${GATUS_SLACK_WEBHOOK_URL} to an
# EMPTY STRING when the variable is unset, and a slack provider with an empty
# webhook-url fails its own Validate(). Gatus then logs a warning, drops that
# provider, and carries on serving the dashboard normally -- it does not refuse
# to start. So a deployment that never sets the variable behaves exactly as it
# does today. Set the variable to turn alerting on; nothing else changes.
#
# The webhook URL is a secret (anyone holding it can post into the channel), so
# it comes from the environment, never from this file. The channel is chosen by
# whoever mints the webhook -- there is no channel name to configure here.
alerting:
  slack:
    webhook-url: "${GATUS_SLACK_WEBHOOK_URL}"
    # Defaults merged into every endpoint's `alerts:` entry below. This block
    # alone does NOT attach alerts to anything -- Gatus requires each endpoint to
    # declare `alerts: - type: slack` for these defaults to apply to it, which is
    # why every endpoint in this file carries that two-line block.
    default-alert:
      enabled: true
      # 3 consecutive failures before alerting, not 1. At a 30s interval that is
      # ~90s of sustained failure, which is what keeps a single dropped health
      # check or a rolling restart from paging anyone.
      failure-threshold: 3
      success-threshold: 2
      # Send the recovery message too -- an alert with no all-clear leaves people
      # checking manually to find out whether it is still broken.
      send-on-resolved: true

endpoints:
  # ==================== Infrastructure ====================
  # NOTE: `postgres` is a network alias for PgBouncer, not for Postgres itself.
  # The database is reachable as `postgres-db`. Both are checked separately so a
  # dead database cannot hide behind a healthy pooler.
  - name: PostgreSQL
    group: Infrastructure
    url: "tcp://postgres-db:5432"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: slack

  - name: PgBouncer
    group: Infrastructure
    url: "tcp://postgres:5432"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: slack

  - name: Redis
    group: Infrastructure
    url: "tcp://redis:6379"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: slack

  - name: Redpanda (Kafka)
    group: Infrastructure
    url: "tcp://redpanda:9092"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: slack

  - name: MinIO
    group: Infrastructure
    url: "http://minio:9000/minio/health/live"
