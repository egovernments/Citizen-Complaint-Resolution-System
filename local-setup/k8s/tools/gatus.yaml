# Gatus health dashboard for the k3s tier.
#
# Kept in sync with the compose tier: local-setup/gatus/config.yaml.
# Both files define the SAME endpoint catalogue -- identical names, groups, URLs and
# conditions, with no tier-only entries. Only runtime enablement differs.
#
# The optional stacks (otp/search/keycloak/mcp/notifications) and the two nginx proxies
# have no manifests under local-setup/k8s/ yet, so their checks are DEFINED here and
# switched OFF via the GATUS_PROFILE_* / GATUS_PROXIES values in the Deployment env
# below. When those manifests land, flip the matching toggle to "true" -- the endpoint
# blocks already exist, so do not add new ones.
# CI enforces tier parity (.github/workflows/gatus-coverage.yml).
#
# This ConfigMap is the ONLY definition of gatus-config. Tiltfile.k8s used to
# generate one of the same name from gatus/config.yaml; defining it in both places
# makes Tilt abort the entire tier with "Duplicate YAML: ConfigMap gatus-config".
# If you reintroduce generation there, delete this ConfigMap -- never both.
#
# What the old generated-from-compose arrangement bought, and this one gives up:
# tier drift used to be impossible by construction, since both tiers read one file.
# This file duplicates the catalogue so the k3s tier can pin its own toggles, so
# drift is now merely *detected* (by the CI guard above) rather than prevented.
# Keep the two catalogues identical by hand; the guard will fail the PR if you don't.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: digit
data:
  config.yaml: |
    # Uptime history survives container restarts (#1610). emptyDir, not a PVC:
    # it is tied to the pod, so a restart keeps history while a reschedule does
    # not. That is the right trade while this tier runs nothing real — revisit
    # with a PVC when it does (#1618).
    #
    # Retention is deliberately left unset: Gatus bounds it itself, per endpoint, at
    # maximum-number-of-results 100 and maximum-number-of-events 50 (upstream
    # storage/config.go, DefaultMaximumNumberOfResults / DefaultMaximumNumberOfEvents),
    # and the SQL store prunes past those thresholds. gatus.db therefore settles at a
    # steady-state size instead of growing forever. Set those keys here only if a
    # deployment wants a different window -- and check the pinned image supports them,
    # since Gatus rejects unknown config keys outright.
    storage:
      type: sqlite
      path: /data/gatus.db

    ui:
      title: DIGIT Core Services - Health Dashboard
      description: Real-time health monitoring for all DIGIT microservices

    # Alerting (#1609). Mirrors local-setup/gatus/config.yaml -- see that file for
    # the full rationale. OFF unless GATUS_SLACK_WEBHOOK_URL is set on the
    # Deployment below: Gatus expands an unset variable to the empty string, and an
    # empty webhook-url makes it drop the provider with a warning rather than fail
    # to start. The secret is supplied by an OPTIONAL secretKeyRef, so clusters
    # without the secret keep deploying unchanged.
    alerting:
      slack:
        webhook-url: "${GATUS_SLACK_WEBHOOK_URL}"
        # Does not attach alerts on its own -- each endpoint must declare
        # `alerts: - type: slack` for these defaults to apply to it.
        default-alert:
          enabled: true
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    endpoints:
      # ==================== Infrastructure ====================
      # NOTE: the `postgres` Service selects app=pgbouncer, not Postgres itself.
      # The database is reachable as `postgres-db`. Both are checked separately so a
      # dead database cannot hide behind a healthy pooler.
      - name: PostgreSQL
        group: Infrastructure
        url: "tcp://postgres-db:5432"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: PgBouncer
        group: Infrastructure
        url: "tcp://postgres:5432"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: Redis
        group: Infrastructure
        url: "tcp://redis:6379"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: Redpanda (Kafka)
        group: Infrastructure
        url: "tcp://redpanda:9092"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: MinIO
        group: Infrastructure
        url: "http://minio:9000/minio/health/live"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # ==================== Core Services ====================
      - name: MDMS Service
        group: Core Services
        url: "http://egov-mdms-service:8094/mdms-v2/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: MDMS Backend
        group: Core Services
        url: "http://mdms-backend:8094/mdms-v2/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Encryption Service
        group: Core Services
        url: "http://egov-enc-service:1234/egov-enc-service/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: ID Generation Service
        group: Core Services
        url: "http://egov-idgen:8088/egov-idgen/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: User Service
        group: Core Services
        url: "http://egov-user:8107/user/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Workflow Service
        group: Core Services
        url: "http://egov-workflow-v2:8109/egov-workflow-v2/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Localization Service
        group: Core Services
        url: "http://egov-localization:8096/localization/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Boundary Service
        group: Core Services
        url: "http://boundary-service:8081/boundary-service/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # No HTTP health endpoint exposed; its own container healthcheck is a TCP probe.
      - name: Boundary Management Service
        group: Core Services
        url: "tcp://egov-bndry-mgmnt:8080"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: Access Control Service
        group: Core Services
        url: "http://egov-accesscontrol:8090/access/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Persister Service
        group: Core Services
        url: "http://egov-persister:8091/common-persist/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Filestore Service
        group: Core Services
        url: "http://egov-filestore:8083/filestore/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: HRMS Service
        group: Core Services
        url: "http://egov-hrms:8092/egov-hrms/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: URL Shortening Service
        group: Core Services
        url: "http://egov-url-shortening:8080/egov-url-shortening/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # audit-service exists only in docker-compose.egov-digit.yaml (the tenant path
      # ansible deploys); this tier has no audit-service manifest, so GATUS_AUDIT is
      # "false" below -- defined here only to keep both catalogues identical.
      - name: Audit Service
        group: Core Services
        enabled: ${GATUS_AUDIT}
        url: "http://audit-service:8080/audit-service/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # ==================== Optional stacks (profile-gated) ====================
      # These services only exist when their compose profile is active (see
      # docker-compose.egov-digit.yaml), so their checks are gated on a matching
      # GATUS_PROFILE_* variable rather than always running. Gatus treats `enabled`
      # as true when the variable is unset, so every compose file that mounts this
      # config MUST pass each variable explicitly -- the `${VAR:-false}` defaults on
      # the gatus service are what make an unset toggle mean "off" instead of "red".
      #
      # Profiles are declared only in docker-compose.egov-digit.yaml. In the other
      # compose files these services are ungated and always start, so those files
      # pass "true" directly. Keep the toggles beside COMPOSE_PROFILES in .env.

      # -------------------- profile: otp --------------------
      - name: OTP Service
        group: OTP
        enabled: ${GATUS_PROFILE_OTP}
        url: "http://egov-otp:8089/otp/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: User OTP Service
        group: OTP
        enabled: ${GATUS_PROFILE_OTP}
        url: "http://user-otp:8090/user-otp/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == UP"
        alerts:
          - type: slack

      # The port is a variable because this service listens on 8005 under
      # docker-compose.egov-digit.yaml but on 8080 in every other compose file, and
      # they all share this config. Both work -- SERVER_PORT is honoured either way
      # and the context path is /notification-sms regardless.
      - name: Notification SMS Service
        group: OTP
        enabled: ${GATUS_PROFILE_OTP}
        url: "http://egov-notification-sms:${GATUS_SMS_PORT}/notification-sms/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == UP"
        alerts:
          - type: slack

      # -------------------- profile: search --------------------
      - name: Elasticsearch
        group: Search
        enabled: ${GATUS_PROFILE_SEARCH}
        url: "http://elasticsearch:9200/_cluster/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Indexer Service
        group: Search
        enabled: ${GATUS_PROFILE_SEARCH}
        url: "http://egov-indexer:8080/egov-indexer/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Inbox Service
        group: Search
        enabled: ${GATUS_PROFILE_SEARCH}
        url: "http://inbox:8080/inbox/actuator/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # -------------------- profile: mcp --------------------
      - name: DIGIT MCP
        group: MCP
        enabled: ${GATUS_PROFILE_MCP}
        url: "http://digit-mcp:3000/healthz"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: MCP Postgres
        group: MCP
        enabled: ${GATUS_PROFILE_MCP}
        url: "tcp://mcp-postgres:5432"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      # -------------------- profile: keycloak --------------------
      - name: Keycloak
        group: Keycloak
        enabled: ${GATUS_PROFILE_KEYCLOAK}
        url: "http://keycloak:8180/realms/master"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Keycloak Postgres
        group: Keycloak
        enabled: ${GATUS_PROFILE_KEYCLOAK}
        url: "tcp://keycloak-postgres:5432"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: Token Exchange Service
        group: Keycloak
        enabled: ${GATUS_PROFILE_KEYCLOAK}
        url: "http://token-exchange-svc:3000/healthz"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # -------------------- profile: notifications --------------------
      # novu-worker exposes no port and so cannot be probed; it is deliberately absent.
      - name: Novu API
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "http://novu-api:3000/v1/health-check"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Novu WS
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "tcp://novu-ws:3002"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: Novu Dashboard
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "tcp://novu-dashboard:4000"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: Novu Mongo
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "tcp://novu-mongo:27017"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: slack

      - name: Novu Bridge
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "http://novu-bridge:8080/novu-bridge/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Novu Bridge Endpoint
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "http://novu-bridge-endpoint:3000/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Config Service
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "http://digit-config-service:8080/config-service/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: User Preferences Service
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "http://digit-user-preferences-service:8080/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: OTP Publisher
        group: Notifications
        enabled: ${GATUS_PROFILE_NOTIFICATIONS}
        url: "http://otp-publisher:3030/healthz"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # ==================== API Gateway ====================
      - name: Kong Gateway (Proxy)
        group: API Gateway
        url: "http://kong:8000/"
        interval: 30s
        conditions:
          - "[STATUS] < 500"
        alerts:
          - type: slack

      - name: Kong Admin API
        group: API Gateway
        url: "http://kong:8001/"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Kong Status
        group: API Gateway
        url: "http://kong:8100/status"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # nginx proxies fronting egov-user / egov-workflow-v2. No Deployment for these
      # in the k3s tier yet, so GATUS_PROXIES is "false" here; defined so the two
      # tiers stay identical and flip together once the manifests land.
      - name: User Service Proxy
        group: API Gateway
        enabled: ${GATUS_PROXIES}
        url: "http://egov-user-proxy:8107/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: Workflow Service Proxy
        group: API Gateway
        enabled: ${GATUS_PROXIES}
        url: "http://egov-workflow-proxy:8109/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # ==================== Application Services ====================
      - name: PGR Services
        group: Application
        url: "http://pgr-services:8080/pgr-services/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == UP"
        alerts:
          - type: slack

      - name: DIGIT UI
        group: Application
        url: "http://digit-ui:80/digit-ui/"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # Configurator (DIGIT Studio) — tenant onboarding admin console. Defined
      # here for tier parity; no configurator manifest exists under
      # local-setup/k8s/ yet, so it is switched OFF via GATUS_CONFIGURATOR in
      # the Deployment env below. Flip that to "true" when the manifest lands.
      - name: Configurator
        group: Application
        enabled: ${GATUS_CONFIGURATOR}
        url: "http://configurator:80/configurator/"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # ==================== API Functionality Tests ====================
      - name: MDMS API - Tenant Search
        group: API Tests
        url: "http://egov-mdms-service:8094/mdms-v2/v1/_search"
        method: POST
        headers:
          Content-Type: application/json
        body: |
          {
            "RequestInfo": {"apiId": "digit", "ver": "1.0", "ts": 0},
            "MdmsCriteria": {
              "tenantId": "pg",
              "moduleDetails": [{"moduleName": "tenant", "masterDetails": [{"name": "tenants"}]}]
            }
          }
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      - name: IDGen API - Generate ID
        group: API Tests
        url: "http://egov-idgen:8088/egov-idgen/id/_generate"
        method: POST
        headers:
          Content-Type: application/json
        body: |
          {
            "RequestInfo": {"apiId": "digit", "ver": "1.0"},
            "idRequests": [{"tenantId": "pg", "idName": "pgr.servicerequestid"}]
          }
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].responseInfo.status == SUCCESSFUL"
        alerts:
          - type: slack

      - name: Localization API - Message Search
        group: API Tests
        url: "http://egov-localization:8096/localization/messages/v1/_search?tenantId=pg&locale=en_IN&module=rainmaker-common"
        method: POST
        headers:
          Content-Type: application/json
        body: |
          {
            "RequestInfo": {"apiId": "digit", "ver": "1.0"}
          }
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack

      # ==================== Observability stack ====================
      # OFF in this tier: it has no grafana/prometheus/loki/tempo/otel-collector
      # manifests (#1618). Defined here only to keep both catalogues identical,
      # per the header — flip GATUS_OBSERVABILITY to "true" when they land.
      #
      # promtail and node-exporter stay out: no reachable HTTP listener, and a
      # dead node-exporter shows as a stale prometheus target instead.
      #
      # Reached through the ExternalName aliases at the bottom of this file, not
      # by namespace-qualifying these URLs.
      #
      # Gatus runs in `digit` and #1618 deploys this stack to `monitoring`, so a
      # bare name resolves as <svc>.digit.svc.cluster.local and does not exist.
      # Verified on a cluster: all five failed with
      #   dial tcp: lookup grafana on 10.96.0.10:53: no such host
      # while grafana.monitoring answered 200 from the same pod.
      #
      # The URLs stay bare so both tiers' catalogues remain textually identical,
      # which check-gatus-coverage.py requires (it matches by URL host and fails
      # on drift between the two files). The cross-namespace hop is done once, in
      # Kubernetes, by the alias Services instead.
      - name: Grafana
        group: Observability
        enabled: ${GATUS_OBSERVABILITY}
        url: "http://grafana:3000/api/health"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        # Alerted (#1609) like every other endpoint. These five are where
        # silence is most misleading: if Grafana stops evaluating rules or
        # Loki dies, no alerts reads identically to "all clear".
        alerts:
          - type: slack

      - name: Prometheus
        group: Observability
        enabled: ${GATUS_OBSERVABILITY}
        url: "http://prometheus:9090/-/healthy"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        # Alerted (#1609) like every other endpoint. These five are where
        # silence is most misleading: if Grafana stops evaluating rules or
        # Loki dies, no alerts reads identically to "all clear".
        alerts:
          - type: slack

      - name: Loki
        group: Observability
        enabled: ${GATUS_OBSERVABILITY}
        url: "http://loki:3100/ready"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        # Alerted (#1609) like every other endpoint. These five are where
        # silence is most misleading: if Grafana stops evaluating rules or
        # Loki dies, no alerts reads identically to "all clear".
        alerts:
          - type: slack

      - name: Tempo
        group: Observability
        enabled: ${GATUS_OBSERVABILITY}
        url: "http://tempo:3200/ready"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        # Alerted (#1609) like every other endpoint. These five are where
        # silence is most misleading: if Grafana stops evaluating rules or
        # Loki dies, no alerts reads identically to "all clear".
        alerts:
          - type: slack

      - name: OTEL Collector
        group: Observability
        enabled: ${GATUS_OBSERVABILITY}
        url: "http://otel-collector:13133"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        # Alerted (#1609) like every other endpoint. These five are where
        # silence is most misleading: if Grafana stops evaluating rules or
        # Loki dies, no alerts reads identically to "all clear".
        alerts:
          - type: slack

      # ==================== Public endpoint (TLS) ====================
      # Every other check in this file runs INSIDE the cluster network and never
      # traverses the public ingress, so none of them presents the public
      # certificate. An expired cert therefore leaves this whole dashboard green
      # while every citizen and employee gets a browser security warning — the
      # dashboard would actively mislead whoever is diagnosing the outage (#1622).
      #
      # This is also the only check that exercises the REAL public path end to
      # end: DNS, firewall, TLS termination and routing through to the app.
      #
      # OFF in this tier: it has no ingress and no public hostname (see #1618).
      # Defined here only to keep both catalogues identical, per the header.
      #
      # GATUS_PUBLIC_URL is still set to a non-empty placeholder on the Deployment
      # below. Gatus validates `url` on EVERY endpoint before it consults
      # `enabled:`, so an empty value here does not disable the check -- it aborts
      # startup ("you must specify an url for each endpoint") and CrashLoopBackOffs.
      #
      # [CONNECTED] == true is what separates the two ways this can go red. On any
      # TLS failure -- SAN mismatch, broken chain, wrong cert -- the handshake never
      # completes, so [CERTIFICATE_EXPIRATION] resolves to 0s and [STATUS] to 0. With
      # only the two conditions below, "0s > 240h" would fail and read exactly like a
      # cert about to expire, sending on-call to chase a renewal that is not the
      # problem. [CONNECTED] fails too in that case and not in the expiry case, so
      # which condition is red says which fault it is. (It also closes a real gap:
      # 0 < 500 is TRUE, so [STATUS] alone stays green on a dead connection.)
      # Upstream pairs these two conditions in its own certificate examples.
      - name: TLS Certificate
        group: Public Endpoint
        enabled: ${GATUS_TLS}
        url: "${GATUS_PUBLIC_URL}"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 240h"
          - "[STATUS] < 500"
        # Alerts on this one too (#1609). It was added by #1622 after this branch
        # was written, so the textual merge left the newest -- and most public --
        # check unable to page anyone. A silently unalertable cert-expiry check is
        # the exact failure #1622 exists to prevent.
        alerts:
          - type: slack

---
# Backing store for the sqlite database (#1610). Without this the volume was an
# emptyDir, which is destroyed with the pod -- so the uptime history this PR
# exists to preserve was still lost on every rollout, drain or eviction.
# Measured before the fix: after deleting the pod, the oldest row in the
# database was timestamped one second after the new pod started.
#
# No storageClassName: k3s provisions this with local-path, the default. 1Gi is
# generous -- Gatus stores one row per check per interval and prunes on read.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus-data
  namespace: digit
  labels:
    app: gatus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: digit
  labels:
    app: gatus
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. The claim above is ReadWriteOnce
  # and holds a sqlite file, so a rolling update would deadlock: the new pod
  # cannot mount the volume until the old one releases it, and the old one is
  # not terminated until the new one is ready. Recreate also keeps two Gatus
  # processes off one sqlite file, which replicas: 1 assumes anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      containers:
        - name: gatus
          image: localhost:5000/twinproduction/gatus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            # Slack alerting (#1609). OPTIONAL secret: `optional: true` means a
            # cluster without the secret still starts the pod, the variable stays
            # unset, and Gatus drops the slack provider with a warning. Create it
            # to switch alerting on -- no manifest edit needed:
            #   kubectl -n digit create secret generic gatus-alerting \
            #     --from-literal=slack-webhook-url='https://hooks.slack.com/services/...'
            - name: GATUS_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: gatus-alerting
                  key: slack-webhook-url
                  optional: true
            # k3s has no manifests for the optional stacks, so every toggle is off.
            # Flip one to "true" only once the matching manifests land under
            # local-setup/k8s/ -- keep it in step with the compose tier.
            # No configurator Deployment in the k3s tier yet.
            - name: GATUS_CONFIGURATOR
              value: "false"
            - name: GATUS_PROFILE_OTP
              value: "false"
            - name: GATUS_PROFILE_SEARCH
              value: "false"
            - name: GATUS_PROFILE_MCP
              value: "false"
            - name: GATUS_PROFILE_KEYCLOAK
              value: "false"
            - name: GATUS_PROFILE_NOTIFICATIONS
              value: "false"
            # No nginx proxy Deployments in the k3s tier either.
            # No audit-service Deployment in the k3s tier either.
            - name: GATUS_AUDIT
              value: "false"
            - name: GATUS_PROXIES
              value: "false"
            - name: GATUS_SMS_PORT
              value: "8080"
            # No ingress and no public hostname in this tier (#1618), so the
            # public TLS check stays off. Declared rather than omitted: Gatus
            # reads an UNSET enabled-var as true, which would leave a
            # permanently-red check against a URL that never resolves.
            # No observability stack in this tier (#1618), so these checks stay off.
            # Declared rather than omitted: an unset enabled-var reads as true.
            - name: GATUS_OBSERVABILITY
              value: "false"
            - name: GATUS_TLS
              value: "false"
            # Non-empty on purpose. Gatus validates `url` on EVERY endpoint
            # before it consults `enabled:`, so "" is not an inert placeholder --
            # it aborts startup with "you must specify an url for each endpoint"
            # and CrashLoopBackOffs the pod. Only ever parsed; with GATUS_TLS
            # false this endpoint is never dialled.
            - name: GATUS_PUBLIC_URL
              value: "https://localhost/"
          resources:
            limits:
              memory: 64Mi
              cpu: "100m"
            requests:
              memory: 32Mi
              cpu: "50m"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: gatus-config
              mountPath: /config/config.yaml
              subPath: config.yaml
            # sqlite store (#1610). The config mount is a read-only ConfigMap,
            # so the database needs a writable volume of its own.
            - name: gatus-data
              mountPath: /data
      volumes:
        - name: gatus-config
          configMap:
            name: gatus-config
        - name: gatus-data
          persistentVolumeClaim:
            claimName: gatus-data
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: digit
spec:
  selector:
    app: gatus
  ports:
    - port: 8080
      targetPort: 8080
---
# Cross-namespace aliases for the observability stack (#1613).
#
# Gatus runs in `digit`; #1618 deploys Prometheus, Loki, Tempo, Grafana and the
# OTEL collector into `monitoring`. A bare `http://grafana:3000` from a pod in
# `digit` resolves as grafana.digit.svc.cluster.local and does not exist --
# confirmed on a cluster, where all five Observability checks failed with
# "no such host" while grafana.monitoring answered 200 from the same pod.
#
# Aliasing here rather than writing grafana.monitoring into the URLs keeps the
# compose and k3s endpoint catalogues textually identical, which
# check-gatus-coverage.py requires: it matches checks to services by URL HOST and
# fails on any drift between the two files. Bare names work in compose (one
# network, no namespaces) and now work here too.
#
# These resolve to nothing until #1618's stack is deployed. That is correct --
# the checks are gated off by GATUS_OBSERVABILITY until it lands.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: digit
  labels: {app: gatus-observability-alias}
spec:
  type: ExternalName
  externalName: grafana.monitoring.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: digit
  labels: {app: gatus-observability-alias}
spec:
  type: ExternalName
  externalName: prometheus.monitoring.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: digit
  labels: {app: gatus-observability-alias}
spec:
  type: ExternalName
  externalName: loki.monitoring.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: digit
  labels: {app: gatus-observability-alias}
spec:
  type: ExternalName
  externalName: tempo.monitoring.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: digit
  labels: {app: gatus-observability-alias}
spec:
  type: ExternalName
  externalName: otel-collector.monitoring.svc.cluster.local
