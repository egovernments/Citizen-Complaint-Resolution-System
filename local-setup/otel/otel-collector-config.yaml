receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
  # Browser dashboard metrics (#1110) arrive as DELTA-temporality histograms
  # (ephemeral emitters can't hold cumulative state); the prometheus exporter
  # needs CUMULATIVE, so accumulate deltas here. Inert for the (cumulative)
  # javaagent metrics already flowing through this pipeline.
  deltatocumulative:
  # Traces are read by Sherlog's investigation (docs/operations/monitoring/sherlog.md). Spans carry how a service connects and who called
  # it; neither helps a root-cause analysis and neither should be stored. db.statement is already sanitised by the
  # Java agent (literals become ?). Query strings can carry phone numbers and tenant ids: stripped. Both the current
  # attribute names and the older ones Kong's OpenTelemetry plugin still sends (http.url with the query string,
  # http.client_ip, net.peer.ip; Kong samples every request).
  attributes/privacy:
    actions:
      - {key: db.connection_string, action: delete}
      - {key: db.user, action: delete}
      - {key: client.address, action: delete}
      - {key: http.client_ip, action: delete}
      - {key: net.peer.ip, action: delete}
      - {key: net.sock.peer.addr, action: delete}
      - {key: user_agent.original, action: delete}
      - {key: http.user_agent, action: delete}
  transform/privacy:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - replace_pattern(attributes["url.query"], ".*", "[redacted]")
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(attributes["http.target"], "\\?.*$", "")

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  # Expose collected OTLP metrics in Prometheus scrape format on :8889/metrics.
  # `service.name` from OTLP resource attributes is mapped to the `job` label so
  # the JVM dashboard can group panels by service.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, transform/privacy, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, deltatocumulative, batch]
      exporters: [prometheus]
