# Promtail tails every Docker container's stdout/stderr off the host's
# /var/lib/docker/containers/*/*-json.log files and ships to Loki. Adds Loki
# labels so the existing dashboard can query both OTLP-emitted Java logs AND
# raw container stdout (Node services, nginx fronts, MinIO, Postgres, etc.).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Note: `reject_old_samples` / `reject_old_samples_max_age` belong in
# Loki's loki-config.yaml, NOT here — promtail's limits_config schema
# doesn't accept them and rejects the whole config with a fatal:
#   "field reject_old_samples not found in type limit.Config"
# Loki already enforces the 7-day rejection on its side, so there's
# nothing to mirror in promtail.

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      # Via the read-only socket proxy, NOT the raw socket. Promtail only needs
      # container metadata to build labels; a direct /var/run/docker.sock bind
      # would give this log shipper the full daemon API, which is host root
      # (`:ro` only makes the socket file read-only, not the API behind it).
      # docker-socket-proxy exposes CONTAINERS=1 and denies every write path.
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      # `compose_service` is what compose stamps on every container it starts.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      # Mirror compose_service to service_name so the existing Loki dashboard's
      # service-name selector picks up non-OTEL containers too. OTLP-emitted
      # entries already carry their own `service_name` from OTEL resource
      # attributes — both populate the same Loki label.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service_name'
    pipeline_stages:
      # Docker JSON log driver wraps each line in {"log":"...","stream":"...","time":"..."}
      - docker: {}

  # The host's journal (docs/operations/monitoring/sherlog.md): kernel OOM kills, systemd unit failures, sshd, the Docker daemon. Needs the
  # journal mounts in docker-compose.egov-digit.yaml. Labelled job=journal; Sherlog's kernel_oom pre-check reads it.
  - job_name: journal
    journal:
      json: false
      max_age: 12h
      path: /var/log/journal
      labels:
        job: journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      # Login sessions are transient units with a new name each time (session-1234.scope): one label value for all,
      # or every SSH login would open a new stream in Loki.
      - source_labels: ['unit']
        regex: 'session-.+\.scope'
        target_label: 'unit'
        replacement: 'session.scope'
      - source_labels: ['__journal__transport']
        target_label: 'transport'
      - source_labels: ['__journal_syslog_identifier']
        target_label: 'identifier'
      - source_labels: ['__journal_priority_keyword']
        target_label: 'level'
