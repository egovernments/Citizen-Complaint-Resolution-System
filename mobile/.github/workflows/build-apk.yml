name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Override version name (e.g. 1.2.3). Leave empty to use pubspec.yaml.'
        required: false
        default: ''
      split_per_abi:
        description: 'Build separate APKs for each ABI'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.38.7'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PUB_VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PUB_NAME=${PUB_VERSION_LINE%+*}
          PUB_CODE=${PUB_VERSION_LINE#*+}

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            NAME="${{ github.ref_name }}"
            NAME=${NAME#v}
          elif [[ -n "${{ inputs.version_name || '' }}" ]]; then
            NAME="${{ inputs.version_name }}"
          else
            NAME="$PUB_NAME"
          fi

          CODE=${{ github.run_number }}

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building v$NAME (build $CODE)"

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/cms_mozambique-release.keystore

      - name: Write key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=cms_mozambique-release.keystore
          EOF

      - name: Build APK
        run: |
          if [[ "${{ inputs.split_per_abi || 'false' }}" == "true" ]]; then
            flutter build apk --release --split-per-abi \
              --build-name "${{ steps.ver.outputs.name }}" \
              --build-number "${{ steps.ver.outputs.code }}"
          else
            flutter build apk --release --target-platform android-arm64 \
              --build-name "${{ steps.ver.outputs.name }}" \
              --build-number "${{ steps.ver.outputs.code }}"
          fi

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          for f in build/app/outputs/apk/release/CMS_Mozambique-*.apk; do
            cp "$f" artifacts/
          done
          ls -lh artifacts/
          if [[ "${KEYSTORE_BASE64:-}" == "" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMS_Mozambique-v${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.apk
          body: |
            ## CMS Mozambique ${{ github.ref_name }}

            Build number: `${{ steps.ver.outputs.code }}`
            Signed with release keystore: `${{ steps.collect.outputs.signed }}`

            ### Install
            Download the `arm64-v8a` APK for modern phones (any device from ~2017 onward).
